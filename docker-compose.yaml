services:
  data-init:
    image: bkg-copilot-api:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      DATA_SRC: /data
    command:
      - |
        set -eu
        src="$${DATA_SRC:-}"
        case "$$src" in
          ""|"/"|"/root"|"/home"|"/etc"|"/var"|"/usr"|"/bin"|"/sbin")
            echo "refusing unsafe COPILOT_API_DATA_DIR: $$src" >&2
            exit 1
            ;;
        esac
        mkdir -p "$$src/cache"
        chmod 700 "$$src"
        chown -R bun:bun "$$src"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${COPILOT_API_DATA_DIR:-/srv/bkg/data/copilot-api}
        target: /data
        bind:
          create_host_path: false
    restart: "no"

  # State owner: pgrust (mango) + pgvector. No host port and not on bkg_net;
  # reachable only on the internal copilot_db network via copilot-postgres:5432.
  postgres:
    image: copilot-pgrust:mango
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      RUST_MIN_STACK: "33554432"
    ulimits:
      stack:
        soft: 67108864
        hard: 67108864
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - cron.database_name=postgres
    volumes:
      - pgrust_data:/var/lib/postgresql/data
      - type: bind
        source: ./supabase/migrations/001_agent_state.sql
        target: /docker-entrypoint-initdb.d/50-agent-state.sql
        read_only: true
    networks:
      copilot_db:
        aliases:
          # bkg_net already publishes the name "postgres" for the shared server.
          # The gateway is on both networks, so the state URL uses this alias.
          - copilot-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bkgcopilot-api:
#    name: bkg-copilot-api
    image: bkg-copilot-api:local
    build:
      context: .
      dockerfile: Dockerfile
    user: bun
    depends_on:
      data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    ports:
      - "127.0.0.1:4141:4141"
    expose:
      - "4141"
    environment:
      COPILOT_API_HOME: /data
      COPILOT_API_SQLITE_DB_PATH: /data/copilot-api.sqlite
      BKG_API_GLOBAL_URL_FILE: /run/secrets/api_global.url
      BKG_API_GLOBAL_KEY_FILE: /run/secrets/api_global.key
      BKG_OV_GATEWAY_KEY_FILE: /run/secrets/bkg-ov-client.key
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@copilot-postgres:5432/postgres
    volumes:
      - type: bind
        source: ${COPILOT_API_DATA_DIR:-/srv/bkg/data/copilot-api}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/bkg/core/api/api_global/api_eysho.url
        target: /run/secrets/api_global.url
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/bkg/core/api/api_global/api_eysho.key
        target: /run/secrets/api_global.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/bkg-ov-client.key
        target: /run/secrets/bkg-ov-client.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      bkg_net:
        aliases:
          - copilot-api
      copilot_db: {}
    labels:
      - traefik.enable=false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "-T", "4", "-Y", "off", "http://127.0.0.1:4141/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bkg_net:
    external: true
    name: bkg_net
  copilot_db:
    internal: true

volumes:
  pgrust_data:
