              key: "total_tokens",
              label: "Total",
            },
            {
              color: "var(--color-blue-accent)",
              key: "input_tokens",
              label: "Input",
            },
            {
              color: "var(--color-green-accent)",
              key: "output_tokens",
              label: "Output",
            },
            {
              color: "var(--color-aqua-accent)",
              key: "cache_read_input_tokens",
              label: "Cache Read",
            },
            {
              color: "var(--color-yellow-accent)",
              key: "cache_creation_input_tokens",
              label: "Cache Write",
            },
          ];
        }

        function getDailyTrendTotals(day, selectedModel) {
          if (selectedModel === ALL_MODELS_VALUE) {
            return day.totals || EMPTY_TOKEN_USAGE_TOTALS;
          }

          return (
            day.byModel?.find((model) => model.model === selectedModel) ||
            EMPTY_TOKEN_USAGE_TOTALS
          );
        }

        function formatChartDate(value) {
          const parts = String(value).split("-");
          return parts.length === 3 ? `${parts[1]}/${parts[2]}` : value;
        }

        function getTokenUsageTrendDays(dailySummary, selectedModel) {
          const days = dailySummary?.days || [];
          if (
            state.tokenUsagePeriod !== "lifetime" ||
            days.length <= MAX_LIFETIME_TREND_POINTS
          ) {
            return days;
          }

          const usageIndexes = days.reduce((indexes, day, index) => {
            if (getDailyTrendTotals(day, selectedModel).request_count > 0) {
              indexes.push(index);
            }
            return indexes;
          }, []);
          if (usageIndexes.length >= MAX_LIFETIME_TREND_POINTS) {
            const step =
              (usageIndexes.length - 1) / (MAX_LIFETIME_TREND_POINTS - 1);
            return Array.from(
              { length: MAX_LIFETIME_TREND_POINTS },
              (_, index) => days[usageIndexes[Math.round(index * step)]],
            );
          }
          const indexes = new Set(usageIndexes);
          const sampleCount = Math.max(
            1,
            MAX_LIFETIME_TREND_POINTS - usageIndexes.length,
          );
          const step = (days.length - 1) / (sampleCount - 1 || 1);
          for (let index = 0; index < sampleCount; index += 1) {
            indexes.add(Math.round(index * step));
          }
          return [...indexes]
            .sort((left, right) => left - right)
            .slice(0, MAX_LIFETIME_TREND_POINTS)
            .map((index) => days[index]);
        }

        function renderTokenUsageDailyTrend(dailySummary, error) {
          if (state.tokenUsagePeriod === "today") {
            return "";
          }

          const models = dailySummary?.byModel || [];
          const selectedModel = models.some(
            (model) => model.model === state.tokenUsageTrendModel,
          )
            ? state.tokenUsageTrendModel
            : ALL_MODELS_VALUE;
          const options = [
            `<option value="${ALL_MODELS_VALUE}">All models</option>`,
            ...models.map(
              (model) =>
                `<option value="${escapeHtml(model.model)}" ${
                  selectedModel === model.model ? "selected" : ""
                }>${escapeHtml(model.model)}</option>`,
            ),
          ].join("");

          return `
            <div class="mt-3 grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_304px] gap-3">
              <div class="panel">
                <div class="panel-header">
                  <div>
                    <p class="panel-title">Token Usage Over Time</p>
                    <p class="panel-meta">${escapeHtml(
                      renderTokenUsageRangeText(
                        state.tokenUsagePeriod,
                        dailySummary?.range || null,
                      ),
                    )}</p>
                  </div>
                </div>
                ${
                  error
                    ? `<div class="p-4">${renderError(
                        error,
                        "Token usage daily trend failed",
                      )}</div>`
                    : ""
                }
                ${renderTokenUsageTrendChart(dailySummary, selectedModel)}
              </div>

              <aside class="panel">
                <div class="panel-header">
                  <div>
                    <p class="panel-title">Filters</p>
                    <p class="panel-meta">Applied to the trend chart</p>
                  </div>
                </div>
                <div class="p-4 space-y-4">
                  <div>
                    <label class="field-label">Model</label>
                    <select
                      data-token-usage-trend-model
                      class="select-control input-focus text-sm"
                    >${options}</select>
                  </div>
                  <div>
                    <div class="field-label">Metric</div>
                    <div class="flex flex-wrap gap-2">
                      ${renderTokenUsageTrendMetricButtons()}
                    </div>
                  </div>
                </div>
              </aside>
            </div>
          `;
        }

        function renderTokenUsageTrendMetricButtons() {
          const metrics = getTokenUsageTrendMetrics();
          return [
            {
              color: "var(--color-fg-lightest)",
              key: ALL_METRICS_VALUE,
              label: "All",
            },
            ...metrics,
          ]
            .map((metric) => {
              const isActive = state.tokenUsageTrendMetric === metric.key;
              return `
                <button
                  type="button"
                  data-trend-metric="${metric.key}"
                  class="pill-button inline-flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold"
                  style="background-color: ${isActive ? "rgba(0, 255, 204, 0.1)" : "var(--color-bg)"}; border-color: ${isActive ? "rgba(0, 255, 204, 0.28)" : "var(--color-bg-light-2)"}; color: ${isActive ? "var(--color-blue)" : "var(--color-fg-medium)"};"
                >
                  <span class="h-2 w-2 rounded-full" style="background-color: ${metric.color};"></span>
                  ${escapeHtml(metric.label)}
                </button>
              `;
            })
            .join("");
        }

        function renderTokenUsageTrendChart(dailySummary, selectedModel) {
          const metrics = getTokenUsageTrendMetrics();
          const visibleMetrics =
            state.tokenUsageTrendMetric === ALL_METRICS_VALUE
              ? metrics
              : metrics.filter(
                  (metric) => metric.key === state.tokenUsageTrendMetric,
                );
          const days = getTokenUsageTrendDays(dailySummary, selectedModel);
          const hasUsage = days.some(
            (day) => getDailyTrendTotals(day, selectedModel).request_count > 0,
          );
          const latestUsageIndex = days.reduce((latest, day, index) => {
            return getDailyTrendTotals(day, selectedModel).request_count > 0
              ? index
              : latest;
          }, -1);
          const selectedDayIndex = days.findIndex(
            (day) => day.date === state.tokenUsageTrendDay,
          );
          const activeIndex =
            selectedDayIndex >= 0
              ? selectedDayIndex
              : latestUsageIndex >= 0
                ? latestUsageIndex
                : Math.max(0, days.length - 1);
          const activeDay = days[activeIndex];
          const activeTotals = activeDay
            ? getDailyTrendTotals(activeDay, selectedModel)
            : EMPTY_TOKEN_USAGE_TOTALS;

          if (state.isTokenUsageLoading && !dailySummary) {
            return `<div class="p-4 min-h-[14rem] text-sm animate-pulse" style="color: var(--color-gray);">Loading...</div>`;
          }

          if (!dailySummary || days.length === 0 || !hasUsage) {
            return renderEmptyState(
              "No token usage recorded for the selected period.",
            );
          }

          const width = 720;
          const height = 220;
          const padding = { bottom: 34, left: 58, right: 16, top: 16 };
          const plotWidth = width - padding.left - padding.right;
          const plotHeight = height - padding.top - padding.bottom;
          const allValues = days.flatMap((day) => {
            const totals = getDailyTrendTotals(day, selectedModel);
            return visibleMetrics.map((metric) => totals[metric.key] || 0);
          });
          const maxValue = Math.max(1, ...allValues);
          const xForIndex = (index) =>
            days.length <= 1
              ? padding.left + plotWidth / 2
              : padding.left + (plotWidth * index) / (days.length - 1);
          const hitWidth =
            days.length <= 1 ? plotWidth : plotWidth / (days.length - 1);
          const yForValue = (value) =>
            padding.top +
            plotHeight -
            (Math.max(0, value) / maxValue) * plotHeight;
          const labelEvery = Math.max(1, Math.ceil(days.length / 6));
          const yTicks = [0, 0.25, 0.5, 0.75, 1].map((ratio) =>
            Math.round(maxValue * ratio),
          );

          const grid = yTicks
            .map((tick) => {
              const y = yForValue(tick);
              return `
                <line x1="${padding.left}" x2="${
                  width - padding.right
                }" y1="${y}" y2="${y}" stroke="var(--color-bg-light-2)" stroke-width="1" />
                <text x="${padding.left - 8}" y="${
                  y + 4
                }" text-anchor="end" font-size="11" fill="var(--color-gray-accent)">${formatNumber(
                  tick,
                )}</text>
              `;
            })
            .join("");
          const xLabels = days
            .map((day, index) => {
              if (index % labelEvery !== 0 && index !== days.length - 1) {
                return "";
              }
              return `<text x="${xForIndex(index)}" y="${
                height - 10
              }" text-anchor="middle" font-size="11" fill="var(--color-gray-accent)">${escapeHtml(
                formatChartDate(day.date),
              )}</text>`;
            })
            .join("");
          const lines = visibleMetrics
            .map((metric) => {
              const points = days
                .map((day, index) => {
                  const totals = getDailyTrendTotals(day, selectedModel);
                  return `${xForIndex(index)},${yForValue(
                    totals[metric.key] || 0,
                  )}`;
                })
                .join(" ");
              const circles = days
                .map((day, index) => {
                  const totals = getDailyTrendTotals(day, selectedModel);
                  const value = totals[metric.key] || 0;
                  return `<circle cx="${xForIndex(index)}" cy="${yForValue(
                    value,
                  )}" r="2.5" fill="${
                    metric.color
                  }" data-trend-day="${escapeHtml(day.date)}">
                    <title>${escapeHtml(
                      `${formatChartDate(day.date)} ${metric.label}: ${formatNumber(
                        value,
                      )}`,
                    )}</title>
                  </circle>`;
                })
                .join("");
              return `
                <polyline fill="none" points="${points}" stroke="${metric.color}" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25">
                  <title>${escapeHtml(metric.label)}</title>
                </polyline>
                ${circles}
              `;
            })
            .join("");
          const activeMarker = activeDay
            ? `<line x1="${xForIndex(activeIndex)}" x2="${xForIndex(
                activeIndex,
              )}" y1="${padding.top}" y2="${
                padding.top + plotHeight
              }" stroke="var(--color-bg-light-4)" stroke-dasharray="4 4" stroke-width="1" />`
            : "";
          const hitRects = days
            .map((day, index) => {
              const x = xForIndex(index);
              const hitStart = Math.max(padding.left, x - hitWidth / 2);
              const hitEnd = Math.min(width - padding.right, x + hitWidth / 2);
              const totals = getDailyTrendTotals(day, selectedModel);
              const title = [
                formatChartDate(day.date),
                ...visibleMetrics.map(
                  (metric) =>
                    `${metric.label}: ${formatNumber(totals[metric.key] || 0)}`,
                ),
              ].join("\n");
              return `<rect x="${hitStart}" y="${padding.top}" width="${
                hitEnd - hitStart
              }" height="${plotHeight}" fill="transparent" style="cursor: pointer;" data-trend-day="${escapeHtml(day.date)}">
                <title>${escapeHtml(title)}</title>
              </rect>`;
            })
            .join("");
          const legend = [
            ...metrics.map(
              (metric) => `
                <span class="inline-flex items-center gap-1.5 text-xs font-medium" style="color: var(--color-gray);">
                  <span class="h-2 w-2 rounded-full" style="background-color: ${
                    metric.color
                  };"></span>
                  ${escapeHtml(metric.label)}
                </span>
              `,
            ),
          ].join("");
          const activeValues = activeDay
            ? `
              <div class="mt-2 flex flex-wrap gap-3 px-3 py-2 text-xs" style="background-color: var(--color-bg-soft); color: var(--color-fg-dark);">
                <span class="font-semibold" style="color: var(--color-fg-lightest);">${escapeHtml(
                  formatChartDate(activeDay.date),
                )}</span>
                ${visibleMetrics
                  .map(
                    (metric) =>
                      `<span>${escapeHtml(metric.label)}: ${formatNumber(
                        activeTotals[metric.key] || 0,
                      )}</span>`,
                  )
                  .join("")}
              </div>
            `
            : "";

          return `
            <div class="p-4 ${state.isTokenUsageLoading ? "opacity-60" : ""}">
              <svg class="w-full h-56" viewBox="0 0 ${width} ${height}" role="img">
                ${grid}
                ${xLabels}
                ${activeMarker}
                ${lines}
                ${hitRects}
              </svg>
              <div class="mt-2 flex flex-wrap gap-5">
                ${legend}
              </div>
              ${activeValues}
            </div>
          `;
        }

        function renderTokenUsageValueLines(value) {
          const lines = Array.isArray(value) ? value : [value];
          return lines
            .map(
              (line) =>
                `<span class="block whitespace-nowrap">${escapeHtml(line)}</span>`,
            )
            .join("");
        }

        function renderTokenUsageMetric(label, value, accentColor, fontSize) {
          const displayText = getMetricDisplayText(value);
          return `
            <div class="metric-card">
              <div class="metric-label">
                <span class="metric-dot" style="background-color: ${accentColor};"></span>
                <span>${escapeHtml(label)}</span>
              </div>
              <div class="metric-value" style="color: var(--color-fg-lightest);${
                fontSize ? ` font-size: ${fontSize};` : ""
              }">${renderTokenUsageValueLines(displayText)}</div>
              <div class="metric-note">Current period</div>
            </div>
          `;
        }

        function renderTokenUsageCostMetric(
          label,
          value,
          accentColor,
          fontSize,
        ) {
          return `
            <div class="metric-card">
              <div class="metric-label">
                <span class="metric-dot" style="background-color: ${accentColor};"></span>
                <span>${escapeHtml(label)}</span>
              </div>
              <div class="metric-value" style="color: var(--color-fg-lightest);${
                fontSize ? ` font-size: ${fontSize};` : ""
              }">${renderTokenUsageValueLines(value)}</div>
              <div class="metric-note">Estimated total</div>
            </div>
          `;
        }

        function renderTokenUsageModelBreakdown(summary, by = "model") {
          const items =
            by === "session" ? summary?.bySession : summary?.byModel;
          if (!items || items.length === 0) {
            return renderEmptyState(
              "No token usage recorded for the selected period.",
            );
          }

          const rows = items
            .map((model) => {
              const name = formatCellText(
                by === "session" ? model.session_id : model.model,
              );
              return `
                <tr class="border-b last:border-b-0" style="border-color: var(--color-bg-light-1);">
                  <td class="px-4 py-2${by === "session" ? " font-mono" : ""}" style="color: var(--color-fg-lightest);" title="${escapeHtml(
                    name,
                  )}">${escapeHtml(name)}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatNumber(
                    model.request_count,
                  )}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatNumber(
                    model.input_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatNumber(
                    model.output_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatNumber(
                    model.cache_read_input_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatNumber(
                    model.cache_creation_input_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatCacheHitRate(model)}</td>
                  ${
                    by === "model"
                      ? `
                    <td class="px-4 py-2 text-right whitespace-nowrap" style="color: var(--color-fg-dark);">${formatLatency(model.average_first_token_ms)}</td>
                    <td class="px-4 py-2 text-right whitespace-nowrap" style="color: var(--color-fg-dark);">${formatOutputSpeed(model.output_tokens_per_second)}</td>
                  `
                      : ""
                  }
                  <td class="px-4 py-2 text-right font-semibold" style="color: var(--color-yellow-accent);">${formatNumber(
                    model.total_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right font-semibold" style="color: var(--color-yellow-accent);">
                    <span class="inline-flex flex-col items-end leading-5">${renderTokenUsageValueLines(
                      formatTokenUsageCosts(model.costs),
                    )}</span>
                  </td>
                </tr>
              `;
            })
            .join("");

          return `
            <div class="overflow-auto [scrollbar-gutter:stable] ${state.isTokenUsageLoading ? "opacity-60" : ""}">
              <table class="data-table breakdown-table w-full text-left">
                <thead>
                  <tr>
                    <th class="px-4 py-2 font-semibold">${by === "session" ? "Session" : "Model"}</th>
                    <th class="px-4 py-2 text-right font-semibold">Requests</th>
                    <th class="px-4 py-2 text-right font-semibold">Input</th>
                    <th class="px-4 py-2 text-right font-semibold">Output</th>
                    <th class="px-4 py-2 text-right font-semibold">Cache Read</th>
                    <th class="px-4 py-2 text-right font-semibold">Cache Write</th>
                    <th class="whitespace-nowrap px-4 py-2 text-right font-semibold">Cache Hit Rate</th>
                    ${
                      by === "model"
                        ? `
                      <th class="px-4 py-2 text-right font-semibold" title="Average over valid completed requests, timed from thinking start or first output">Avg. TTFT</th>
                      <th class="whitespace-nowrap px-4 py-2 text-right font-semibold" title="Output tokens divided by summed generation time of valid completed requests">Output speed</th>
                    `
                        : ""
                    }
                    <th class="px-4 py-2 text-right font-semibold">Total Tokens</th>
                    <th class="px-4 py-2 text-right font-semibold">Total Cost</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows}
                </tbody>
              </table>
            </div>
          `;
        }

        function renderTokenUsageEventsTable(eventsPage) {
          if (!eventsPage || eventsPage.items.length === 0) {
            return renderEmptyState(
              "No token usage detail rows for the selected period.",
            );
          }

          const rows = eventsPage.items
            .map((event) => {
              const userId = formatCellText(event.user_id);
              const sessionId = formatCellText(event.session_id);
              const traceId = formatCellText(event.trace_id);

              return `
                <tr class="border-b last:border-b-0" style="border-color: var(--color-bg-light-1);">
                  <td class="px-4 py-2 max-w-[170px] truncate whitespace-nowrap" style="color: var(--color-fg-dark);" title="${escapeHtml(
                    event.created_at_utc,
                  )}">${escapeHtml(formatDateTime(event.created_at_ms))}</td>
                  <td class="px-4 py-2 max-w-[100px] truncate" style="color: var(--color-fg-lightest);" title="${escapeHtml(
                    userId,
                  )}">${escapeHtml(userId)}</td>

                  <td class="px-4 py-2 max-w-[140px] truncate" style="color: var(--color-fg-lightest);" title="${escapeHtml(
                    event.model,
                  )}">${escapeHtml(event.model)}</td>
                  <td class="px-4 py-2 whitespace-nowrap font-mono" style="color: var(--color-fg-dark);" title="${escapeHtml(
                    sessionId,
                  )}">${escapeHtml(sessionId)}</td>
                  <td class="px-4 py-2 max-w-[200px] truncate font-mono" style="color: var(--color-fg-dark);" title="${escapeHtml(
                    traceId,
                  )}">${escapeHtml(traceId)}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatNumber(
                    event.input_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatNumber(
                    event.output_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatNumber(
                    event.cache_read_input_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right" style="color: var(--color-fg-dark);">${formatNumber(
                    event.cache_creation_input_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right whitespace-nowrap" style="color: var(--color-fg-dark);">${formatLatency(event.duration_ms)}</td>
                  <td class="px-4 py-2 text-right font-semibold" style="color: var(--color-yellow-accent);">${formatNumber(
                    event.total_tokens,
                  )}</td>
                  <td class="px-4 py-2 text-right font-semibold" style="color: var(--color-yellow-accent);">
                    <span class="inline-flex flex-col items-end leading-5">${renderTokenUsageValueLines(
                      formatTokenUsageCost(event.cost),
                    )}</span>
                  </td>
                </tr>
              `;
            })
            .join("");

          return `
            <div class="overflow-auto ${state.isEventsLoading ? "opacity-60" : ""}">
              <table class="data-table events-table w-full text-left">
                <thead>
                  <tr>
                    <th class="px-4 py-2 font-semibold">Time</th>
                    <th class="px-4 py-2 font-semibold">User</th>

                    <th class="px-4 py-2 font-semibold">Model</th>
                    <th class="px-4 py-2 font-semibold">Session</th>
                    <th class="px-4 py-2 font-semibold">Trace</th>
                    <th class="px-4 py-2 text-right font-semibold">Input</th>
                    <th class="px-4 py-2 text-right font-semibold">Output</th>
                    <th class="px-4 py-2 text-right font-semibold">Cache Read</th>
                    <th class="px-4 py-2 text-right font-semibold">Cache Write</th>
                    <th class="px-4 py-2 text-right font-semibold">Duration</th>
                    <th class="px-4 py-2 text-right font-semibold">Total Tokens</th>
                    <th class="px-4 py-2 text-right font-semibold">Total Cost</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows}
                </tbody>
              </table>
            </div>
          `;
        }

        function renderPaginationButton(action, label, disabled) {
          return `
            <button
              type="button"
              data-page-action="${action}"
              class="pill-button px-3 py-1.5 text-xs font-semibold"
              ${disabled ? "disabled" : ""}
            >
              ${label}
            </button>
          `;
        }

        function renderEmptyState(message) {
          return `
            <div class="px-4 py-8 text-sm" style="color: var(--color-gray);">
              ${escapeHtml(message)}
            </div>
          `;
        }

        /**
         * Renders a loading spinner.
         * @returns {string} HTML string for the spinner.
         */
        function renderSpinner() {
          return `
            <div class="flex justify-center items-center py-20">
                <div class="animate-spin h-12 w-12 rounded-full border-4 border-transparent border-t-4" style="border-top-color: var(--color-blue); background-color: rgba(255, 255, 255, 0.65);"></div>
            </div>`;
        }

        /**
         * Renders an error message box.
         * @param {string} message - The error message to display.
         * @returns {string} HTML string for the error message.
         */
        function renderError(message, title = "An Error Occurred") {
          return `
            <div
              class="p-3 border rounded-lg"
              style="background-color: rgba(220, 38, 38, 0.08); border-color: rgba(220, 38, 38, 0.22); color: var(--color-red);"
              role="alert"
            >
              <div class="flex items-start">
                <i data-lucide="alert-triangle" class="h-5 w-5 mr-3 mt-0.5"></i>
                <div>
                  <p class="font-bold text-sm">${escapeHtml(title)}</p>
                  <p class="text-xs">${escapeHtml(message)}</p>
                </div>
              </div>
            </div>
          `;
        }

        /**
         * Renders a welcome message when the page first loads.
         * @returns {string} HTML string for the welcome message.
         */
        function renderWelcomeMessage() {
          return `
            <div class="panel text-center py-16 px-4">
                <i data-lucide="info" class="mx-auto h-10 w-10" style="color: var(--color-blue);"></i>

        // --- Data Fetching ---

        async function refreshSubscriptionQuotas(provider) {
          syncSubscriptionsConnection();
          try {
            if (!endpointUrlInput.value.trim())
              throw new Error("Endpoint URL cannot be empty");
            await fetchSubscriptionQuotas(
              resolveUsageUrl(endpointUrlInput.value.trim()),
              provider,
            );
          } catch (error) {
            state.subscriptionPageError = getErrorMessage(error);
            render("subscriptions");
          }
        }

        async function fetchSubscriptionQuotas(usageUrl, selectedProvider) {
          if (
            selectedProvider &&
            !Object.hasOwn(SUBSCRIPTION_PROVIDERS, selectedProvider)
          )
            return;
          if (!selectedProvider) {
            state.subscriptionRequestId += 1;
            state.subscriptionUsage = {};
            state.subscriptionUsageErrors = {};
            state.subscriptionLoadingProviders = {};
          }
          const requestId = state.subscriptionRequestId;
          const connectionKey = getConnectionKey();
          state.subscriptionPageError = null;
          const providers = selectedProvider
            ? [selectedProvider]
            : Object.keys(SUBSCRIPTION_PROVIDERS);
          await Promise.all(
            providers.map(async (provider) => {
              const revision = (state.subscriptionRequests[provider] || 0) + 1;
              state.subscriptionRequests[provider] = revision;
              delete state.subscriptionUsage[provider];
              delete state.subscriptionUsageErrors[provider];
              state.subscriptionLoadingProviders[provider] = true;
              state.isSubscriptionsLoading = true;
              render("subscriptions");
              const isCurrent = () =>
                requestId === state.subscriptionRequestId &&
                connectionKey === getConnectionKey() &&
                revision === state.subscriptionRequests[provider];
              try {
                const usage = await fetchJson(
                  deriveEndpointUrl(usageUrl, `usage/${provider}`),
                  isCurrent,
                );
                if (!isCurrent()) return;
                if (
                  usage?.provider !== provider ||
                  !Array.isArray(usage.windows)
                )
                  throw new Error("Invalid subscription quota response");
                state.subscriptionUsage[provider] = usage;
              } catch (error) {
                if (!isCurrent()) return;
                if (error?.status !== 404)
                  state.subscriptionUsageErrors[provider] = true;
              } finally {
                if (isCurrent()) {
                  delete state.subscriptionLoadingProviders[provider];
                  state.isSubscriptionsLoading =
                    Object.keys(state.subscriptionLoadingProviders).length > 0;
                  state.subscriptionsLoaded = true;
                  render("subscriptions");
                }
              }
            }),
          );
        }

        /**
         * Fetches usage data and token usage data from the specified API endpoint.
         */
        async function fetchData(page = 1) {
          await fetchTokenUsageSummaryAndEvents(page, true);
        }

        async function fetchTokenUsageSummaryAndEvents(
          page = 1,
          showSpinner = false,
        ) {
          const connectionKey = syncTokenUsageConnection();
          const requestId = ++state.tokenUsageRequestId;
          const eventsRequestId = ++state.eventsRequestId;
          const isCurrentRequest = () =>
            requestId === state.tokenUsageRequestId &&
            connectionKey === getConnectionKey();
          const isCurrentEventsRequest = () =>
            eventsRequestId === state.eventsRequestId && isCurrentRequest();
          invalidateSessionsRequest();
          state.isEventsLoading = false;
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) {
            state.isLoading = false;
            state.isTokenUsageLoading = false;
            state.tokenUsageDailySummary = null;
            state.tokenUsageSummary = null;
            state.tokenUsageEventsPage = null;
            state.tokenUsageDailyError =
              "Token usage requires a valid endpoint URL.";
            state.tokenUsageSummaryError =
              "Token usage requires a valid endpoint URL.";
            state.tokenUsageEventsError = null;
            render();
            return;
          }

          const period = getSelectedPeriod();
          state.isLoading = showSpinner;
          state.isTokenUsageLoading = true;
          state.tokenUsageDailySummary = null;
          state.tokenUsageSummary = null;
          state.tokenUsageEventsPage = null;
          state.tokenUsageDailyError = null;
          state.tokenUsageSummaryError = null;
          state.tokenUsageEventsError = null;
          render();

          try {
            const usageUrl = resolveUsageUrl(endpoint);
            const [summaryResult, dailyResult, eventsResult] =
              await Promise.allSettled([
                fetchJson(
                  buildTokenUsageSummaryUrl(usageUrl, period),
                  isCurrentRequest,
                ),
                fetchJson(
                  buildTokenUsageDailyUrl(usageUrl, period),
                  isCurrentRequest,
                ),
                fetchJson(
                  buildTokenUsageEventsUrl(usageUrl, period, page),
                  isCurrentEventsRequest,
                ),
              ]);
            if (!isCurrentRequest()) return;

            if (summaryResult.status === "fulfilled") {
              state.tokenUsageSummary = summaryResult.value;
              void fetchTokenUsageSessionsPage(1);
            } else if (isMissingTokenUsageEndpointError(summaryResult.reason)) {
              state.tokenUsageSummary = null;
              state.tokenUsageSummaryError = null;
            } else {
              state.tokenUsageSummary = null;
              state.tokenUsageSummaryError = getErrorMessage(
                summaryResult.reason,
              );
            }

            if (dailyResult.status === "fulfilled") {
              state.tokenUsageDailySummary = dailyResult.value;
            } else if (isMissingTokenUsageEndpointError(dailyResult.reason)) {
              state.tokenUsageDailySummary = null;
              state.tokenUsageDailyError = null;
            } else {
              state.tokenUsageDailySummary = null;
              state.tokenUsageDailyError = getErrorMessage(dailyResult.reason);
            }

            if (!isCurrentEventsRequest()) return;
            if (eventsResult.status === "fulfilled") {
              state.tokenUsageEventsPage = eventsResult.value;
            } else if (isMissingTokenUsageEndpointError(eventsResult.reason)) {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = null;
            } else {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = getErrorMessage(
                eventsResult.reason,
              );
            }
          } catch (error) {
            if (!isCurrentRequest()) return;
            console.error("Token usage fetch error:", error);
            state.tokenUsageDailySummary = null;
            state.tokenUsageSummary = null;
            state.tokenUsageDailyError = getErrorMessage(error);
            state.tokenUsageSummaryError = getErrorMessage(error);
            if (isCurrentEventsRequest()) {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = getErrorMessage(error);
            }
          } finally {
            if (isCurrentRequest()) {
              state.isLoading = false;
              state.isTokenUsageLoading = false;
              render("usage");
            }
          }
        }

        async function fetchTokenUsageEventsPage(page) {
          const connectionKey = syncTokenUsageConnection();
          const requestId = ++state.eventsRequestId;
          const isCurrentRequest = () =>
            requestId === state.eventsRequestId &&
            connectionKey === getConnectionKey();
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) {
            state.isEventsLoading = false;
            state.tokenUsageEventsError =
              "Token usage requires a valid endpoint URL.";
            render();
            return;
          }

          state.isEventsLoading = true;
          state.tokenUsageEventsError = null;
          render();

          try {
            const usageUrl = resolveUsageUrl(endpoint);
            const result = await fetchJson(
              buildTokenUsageEventsUrl(usageUrl, getSelectedPeriod(), page),
              isCurrentRequest,
            );
            if (isCurrentRequest()) state.tokenUsageEventsPage = result;
          } catch (error) {
            if (!isCurrentRequest()) return;
            if (isMissingTokenUsageEndpointError(error)) {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = null;
            } else {
              console.error("Token usage events fetch error:", error);
              state.tokenUsageEventsError = getErrorMessage(error);
            }
          } finally {
            if (isCurrentRequest()) {
              state.isEventsLoading = false;
              render("usage");
            }
          }
        }

        async function fetchTokenUsageSessionsPage(page) {
          const connectionKey = syncTokenUsageConnection();
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) {
            return;
          }

          const requestId = ++state.sessionsRequestId;
          const isCurrentRequest = () =>
            requestId === state.sessionsRequestId &&
            connectionKey === getConnectionKey();
          state.isSessionsLoading = true;
          state.tokenUsageSessionsError = null;
          render();

          try {
            const result = await fetchJson(
              buildTokenUsageEventsUrl(
                resolveUsageUrl(endpoint),
                getSelectedPeriod(),
                page,
                "sessions",
              ),
              isCurrentRequest,
            );
            if (!isCurrentRequest()) {
              return;
            }
            state.tokenUsageSessionsPage = result;
          } catch (error) {
            if (!isCurrentRequest()) {
              return;
            }
            // Older servers have no sessions endpoint; show the empty state.
            if (isMissingTokenUsageEndpointError(error)) {
              state.tokenUsageSessionsPage = null;
            } else {
              console.error("Token usage sessions fetch error:", error);
              state.tokenUsageSessionsError = getErrorMessage(error);
            }
          }

          state.isSessionsLoading = false;
          render("usage");
        }

        // Clears sessions when refreshing the endpoint or period and ignores
        // late responses from the previous context.
        function invalidateSessionsRequest() {
          state.sessionsRequestId += 1;
          state.isSessionsLoading = false;
          state.tokenUsageSessionsPage = null;
          state.tokenUsageSessionsError = null;
        }

        function syncTokenUsageConnection() {
          const key = getConnectionKey();
          if (state.tokenUsageConnectionKey !== key) {
            state.tokenUsageConnectionKey = key;
            state.tokenUsageRequestId += 1;
            state.eventsRequestId += 1;
            state.isLoading = false;
            state.isTokenUsageLoading = false;
            state.isEventsLoading = false;
            state.tokenUsageSummary = null;
            state.tokenUsageDailySummary = null;
            state.tokenUsageEventsPage = null;
            state.tokenUsageSummaryError = null;
            state.tokenUsageDailyError = null;
            state.tokenUsageEventsError = null;
            invalidateSessionsRequest();
          }
          return key;
        }

        async function adminRequest(path, options = {}) {
          const requestUrl = new URL(path, window.location.origin);
          const headers = new Headers(options.headers || {});
          if (options.body !== undefined)
            headers.set("content-type", "application/json");
          const response = await fetch(requestUrl.toString(), {
            method: options.method || "GET",
            headers,
            credentials: "same-origin",
            body:
              options.body === undefined
                ? undefined
                : JSON.stringify(options.body),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            const message =
              payload && payload.error && payload.error.message
                ? payload.error.message
                : "Admin request failed with HTTP " + response.status;
            const error = new Error(message);
            error.status = response.status;
            throw error;
          }
          return payload;
        }

        async function loadAdminProviders() {
          state.adminLoading = true;
          state.adminError = "";
          state.adminFeedback = "";
          render("admin");
          try {
            const result = await adminRequest("/admin/config/providers");
            state.adminProviders = Array.isArray(result.providers)
              ? result.providers
              : [];
            state.adminConnected = true;
            if (
              !state.adminProviders.some(
                (item) => item.name === state.adminSelectedProvider,
              )
            ) {
              const defaultProvider = state.adminProviders.find(
                (item) => item.name === "bkg-api",
              );
              state.adminSelectedProvider = defaultProvider
                ? defaultProvider.name
                : state.adminProviders[0]
                  ? state.adminProviders[0].name
                  : "";
            }
          } catch (error) {
            state.adminConnected = false;
            state.adminProviders = null;
            state.adminError =
              error.status === 401
                ? "Copi browser session expired. Sign in again."
                : getErrorMessage(error);
          } finally {
            state.adminLoading = false;
            render("admin");
          }
          if (state.adminConnected && state.adminSelectedProvider) {
            await discoverAdminModels();
          }
        }

        async function loadAdminFreeCatalog() {
          state.adminFreeCatalogLoading = true;
          state.adminFreeCatalogError = "";
          render("admin");
          try {
            state.adminFreeCatalog = await adminRequest("/admin/config/providers/catalog/free");
          } catch (error) {
            state.adminFreeCatalogError = getErrorMessage(error);
          } finally {
            state.adminFreeCatalogLoading = false;
            render("admin");
          }
        }

        function useAdminCatalogProvider(providerId) {
          const entry = (state.adminFreeCatalog && state.adminFreeCatalog.providers || []).find((item) => item.id === providerId);
          const form = document.querySelector("[data-admin-add-provider]");
          if (!entry || !form) return;
          form.elements.namedItem("name").value = entry.id || "";
          form.elements.namedItem("type").value = "openai-compatible";
          form.elements.namedItem("baseUrl").value = entry.baseUrl || "";
          form.elements.namedItem("authType").value = entry.authType || "authorization";
          form.elements.namedItem("apiKey").value = "";
          form.elements.namedItem("enabled").checked = entry.authType === "none";
          form.scrollIntoView({ behavior: "smooth", block: "start" });
          state.adminFeedback = entry.name + " copied into the provider form. Verify its current terms and add a key when required.";
          const feedback = document.querySelector(".admin-feedback");
          if (feedback) feedback.textContent = state.adminFeedback;
        }

        async function discoverAdminModels() {
          const provider = state.adminSelectedProvider;
          if (!provider || !state.adminConnected) return;
          state.adminLoading = true;
          state.adminError = "";
          state.adminModelSummary = "Discovering and testing model IDs…";
          render("admin");
          try {
            const result = await adminRequest(
              "/admin/config/providers/" +
                encodeURIComponent(provider) +
                "/models/discover",
              { method: "POST", body: {} },
            );
            state.adminModels = Array.isArray(result.models)
              ? result.models
              : [];
            state.adminModelSummary =
              String(result.healthyCount) +
              " healthy / " +
              String(result.discoveredCount) +
              " discovered";
          } catch (error) {
            state.adminModels = [];
            state.adminModelSummary = "Discovery failed";
            state.adminError = getErrorMessage(error);
          } finally {
            state.adminLoading = false;
            render("admin");
          }
        }

        async function testAdminModel(modelId) {
          const provider = state.adminSelectedProvider;
          if (!provider) return;
          try {
            const result = await adminRequest(
              "/admin/config/providers/" +
                encodeURIComponent(provider) +
                "/models/test",
              { method: "POST", body: { modelId: modelId } },
            );
            state.adminFeedback = result.healthy
              ? modelId + " answered successfully."
              : modelId +
                " did not return a completion: " +
                (result.reason || "unknown");
            await discoverAdminModels();
          } catch (error) {
            state.adminError = getErrorMessage(error);
            render("admin");
          }
        }

        async function toggleAdminModel(modelId, enabled) {
          const provider = state.adminSelectedProvider;
          if (!provider) return;
          try {
            await adminRequest(
              "/admin/config/providers/" +
                encodeURIComponent(provider) +
                "/models/toggle",
              { method: "POST", body: { modelId: modelId, enabled: enabled } },
            );
            state.adminFeedback = enabled
              ? modelId + " enabled."
              : modelId + " disabled.";
            await discoverAdminModels();
          } catch (error) {
            state.adminError = getErrorMessage(error);
            render("admin");
          }
        }

        async function handleAdminContentClick(event) {
          if (!(event.target instanceof Element)) return false;
          const resetLogin = event.target.closest("[data-admin-reset-login]");
          if (resetLogin) {
            window.location.replace("/");
            return true;
          }
          const catalogButton = event.target.closest("[data-admin-free-catalog]");
          if (catalogButton) {
            await loadAdminFreeCatalog();
            return true;
          }
          const catalogUse = event.target.closest("[data-admin-catalog-use]");
          if (catalogUse) {
            useAdminCatalogProvider(catalogUse.dataset.adminCatalogUse);
            return true;
          }
          const refresh = event.target.closest("[data-admin-refresh]");
          if (refresh) {
            await loadAdminProviders();
            return true;
          }
          const selectProvider = event.target.closest(
            "[data-admin-select-provider]",
          );
          if (selectProvider) {
            state.adminSelectedProvider =
              selectProvider.dataset.adminSelectProvider;
            state.adminModels = [];
            state.adminModelSummary = "";
            render("admin");
            await discoverAdminModels();
            return true;
          }
          const discover = event.target.closest("[data-admin-discover]");
          if (discover) {
            await discoverAdminModels();
            return true;
          }
          const deleteProvider = event.target.closest(
            "[data-admin-delete-provider]",
          );
          if (deleteProvider) {
            const name = deleteProvider.dataset.adminDeleteProvider;
            if (
              !window.confirm(
                "Delete provider " + name + " and its stored credentials?",
              )
            )
              return true;
            try {
              await adminRequest(
                "/admin/config/providers/" + encodeURIComponent(name),
                { method: "DELETE" },
              );
              state.adminFeedback = "Provider " + name + " deleted.";
              state.adminSelectedProvider = "";
              await loadAdminProviders();
            } catch (error) {
              state.adminError = getErrorMessage(error);
              render("admin");
            }
            return true;
          }
          const test = event.target.closest("[data-admin-test-model]");
          if (test) {
            await testAdminModel(test.dataset.adminTestModel);
            return true;
          }
          const toggle = event.target.closest("[data-admin-toggle-model]");
          if (toggle) {
            const enabled = toggle.dataset.adminModelEnabled !== "true";
            await toggleAdminModel(toggle.dataset.adminToggleModel, enabled);
            return true;
          }
          return false;
        }

        async function handleAdminFormSubmit(event) {
          const form = event.target;
          if (!(form instanceof HTMLFormElement)) return false;
          if (form.matches("[data-admin-add-provider]")) {
            event.preventDefault();
            const formData = new FormData(form);
            const body = {
              name: String(formData.get("name") || "").trim(),
              type: String(formData.get("type") || "openai-compatible"),
              baseUrl: String(formData.get("baseUrl") || "").trim(),
              authType: String(formData.get("authType") || "authorization"),
              apiKey: String(formData.get("apiKey") || "").trim(),
              enabled: formData.get("enabled") === "on",
            };
            try {
              const result = await adminRequest("/admin/config/providers", {
                method: "POST",
                body: body,
              });
              state.adminSelectedProvider = result.provider.name;
              state.adminFeedback =
                "Provider " + result.provider.name + " added.";
              await loadAdminProviders();
            } catch (error) {
              state.adminError = getErrorMessage(error);
              render("admin");
            }
            return true;
          }
          if (form.matches("[data-admin-update-provider]")) {
            event.preventDefault();
            const provider = getAdminProvider();
            if (!provider) return true;
            const formData = new FormData(form);
            const body = {
              baseUrl: String(formData.get("baseUrl") || "").trim(),
              type: String(formData.get("type") || provider.type),
              authType: String(formData.get("authType") || provider.authType),
              enabled: formData.get("enabled") === "on",
            };
            const replacementKey = String(formData.get("apiKey") || "").trim();
            if (replacementKey) body.apiKey = replacementKey;
            if (body.authType === "none") body.clearApiKey = true;
            try {
              await adminRequest(
                "/admin/config/providers/" + encodeURIComponent(provider.name),
                { method: "PATCH", body: body },
              );
              state.adminFeedback = "Provider settings saved.";
              await loadAdminProviders();
            } catch (error) {
              state.adminError = getErrorMessage(error);
              render("admin");
            }
            return true;
          }
          if (form.matches("[data-admin-manual-model]")) {
            event.preventDefault();
            const formData = new FormData(form);
            const modelId = String(formData.get("modelId") || "").trim();
            const provider = state.adminSelectedProvider;
            try {
              await adminRequest(
                "/admin/config/providers/" +
                  encodeURIComponent(provider) +
                  "/models/manual",
                {
                  method: "POST",
                  body: { modelId: modelId },
                },
              );
              state.adminFeedback =
                modelId + " passed its completion test and was added.";
              await discoverAdminModels();
            } catch (error) {
              state.adminError = getErrorMessage(error);
              render("admin");
            }
            return true;
          }
          if (form.matches("[data-admin-reset-password]")) {
            event.preventDefault();
            const formData = new FormData(form);
            const password = String(formData.get("password") || "");
            if (password !== String(formData.get("confirmPassword") || "")) {
              state.adminError = "Die Passwörter stimmen nicht überein.";
              state.adminFeedback = "";
              render("admin");
              return true;
            }
            const submitButton = form.querySelector('button[type="submit"]');
            if (submitButton instanceof HTMLButtonElement)
              submitButton.disabled = true;
            try {
              const response = await fetch("/admin/auth/reset-password", {
                method: "POST",
                credentials: "same-origin",
                cache: "no-store",
                headers: {
                  "content-type": "application/json",
                  "x-api-key": String(formData.get("adminApiKey") || ""),
                },
                body: JSON.stringify({ password }),
              });
              const payload = await response.json().catch(() => ({}));
              if (!response.ok) {
                state.adminError =
                  response.status === 401
                    ? "Der Admin-API-Key ist ungültig."
                    : payload?.error?.message ||
                      "Passwort zurücksetzen fehlgeschlagen (" +
                        response.status +
                        ").";
                state.adminFeedback = "";
                render("admin");
                return true;
              }
              state.adminError = "";
              state.adminFeedback =
                "Passwort aktualisiert. Alle Sitzungen wurden beendet. Bitte neu anmelden.";
              state.adminPasswordResetDone = true;
              render("admin");
            } catch (error) {
              state.adminError = getErrorMessage(error);
              state.adminFeedback = "";
              render("admin");
            } finally {
              const button = document.querySelector(
                '[data-admin-reset-password] button[type="submit"]',
              );
              if (button instanceof HTMLButtonElement) button.disabled = false;
            }
            return true;
          }
          return false;
        }

        // --- Event Handlers & Initialization ---

        /**
         * Handles the form submission to trigger a data fetch.
         * @param {Event} event - The form submission event.
         */
        function handleFormSubmit(event) {
          event.preventDefault();
          syncEndpointCredential();
          syncUrlState();
          if (
            state.activeTab === "models" ||
            state.activeTab === "playground"
          ) {
            void fetchModels();
          } else if (state.activeTab === "subscriptions") {
            void refreshSubscriptionQuotas();
          } else {
            void fetchData();
          }
        }

        function handlePeriodChange() {
          syncUrlState();
          void fetchTokenUsageSummaryAndEvents(1);
        }

        function handleContentAreaClick(event) {
          if (!(event.target instanceof Element)) {
            return;
          }
          if (
            event.target.closest(
              "[data-admin-reset-login], [data-admin-refresh], [data-admin-free-catalog], [data-admin-catalog-use], [data-admin-select-provider], [data-admin-discover], [data-admin-delete-provider], [data-admin-test-model], [data-admin-toggle-model]",
            )
          ) {
            void handleAdminContentClick(event);
            return;
          }
          if (event.target.closest("[data-anthropic-logout]")) {
            void signOutAnthropic();
            return;
          }
          const providerAuthStart = event.target.closest(
            "[data-provider-auth-start]",
          );
          if (providerAuthStart) {
            void startProviderAuth(providerAuthStart.dataset.providerAuthStart);
            return;
          }
          if (event.target.closest("[data-provider-auth-refresh]")) {
            void loadProviderAuthStatus();
            return;
          }
          const quotaRefresh = event.target.closest("[data-quota-refresh]");
          if (quotaRefresh) {
            void refreshSubscriptionQuotas(quotaRefresh.dataset.quotaRefresh);
            return;
          }
          if (event.target.closest("[data-playground-clear]")) {
            if (!state.playgroundBusy) {
              state.playgroundMessages = [];
              state.playgroundError = "";
              render("playground");
            }
            return;
          }
          if (event.target.closest("[data-playground-refresh]")) {
            void fetchModels();
            return;
          }
          const copyButton = event.target.closest("[data-model-copy]");
          if (copyButton) {
            void copyModelId(copyButton.dataset.modelCopy);
            return;
          }
          const collapseToggle = event.target.closest("[data-collapse-toggle]");
          if (collapseToggle) {
            toggleCollapsedSection(collapseToggle);
            return;
          }
          const detailsButton = event.target.closest("[data-model-details]");
          if (detailsButton) {
            const details = document.getElementById(
              detailsButton.dataset.modelDetails,
            );
            details.hidden = !details.hidden;
            detailsButton.setAttribute(
              "aria-expanded",
              String(!details.hidden),
            );
            detailsButton.textContent = details.hidden
              ? "View JSON"
              : "Hide JSON";
            return;
          }
          const trendMetric = event.target.closest("[data-trend-metric]");
          if (trendMetric) {
            state.tokenUsageTrendMetric =
              trendMetric.getAttribute("data-trend-metric") ||
              ALL_METRICS_VALUE;
            render();
            return;
          }

          const trendPoint = event.target.closest("[data-trend-day]");
          if (trendPoint) {
            const day = trendPoint.getAttribute("data-trend-day");
            if (day) {
              state.tokenUsageTrendDay = day;
              render();
            }
            return;
          }

          const sessionButton = event.target.closest("[data-session-page]");
          if (sessionButton) {
            if (!state.isSessionsLoading) {
              // Offset 0 is the error retry button: reload the current page.
              void fetchTokenUsageSessionsPage(
                (state.tokenUsageSessionsPage?.page ?? 1) +
                  Number(sessionButton.getAttribute("data-session-page")),
              );
            }
            return;
          }

          const actionButton = event.target.closest("[data-page-action]");
          if (
            !actionButton ||
            !state.tokenUsageEventsPage ||
            state.isEventsLoading
          ) {
            return;
          }

          const action = actionButton.getAttribute("data-page-action");
          if (action === "previous" && state.tokenUsageEventsPage.page > 1) {
            void fetchTokenUsageEventsPage(state.tokenUsageEventsPage.page - 1);
          }

          if (
            action === "next" &&
            state.tokenUsageEventsPage.page <
              state.tokenUsageEventsPage.total_pages
          ) {
            void fetchTokenUsageEventsPage(state.tokenUsageEventsPage.page + 1);
          }
        }

        function handleContentAreaChange(event) {
          if (!(event.target instanceof HTMLSelectElement)) return;
          if (event.target.matches("[data-playground-model]")) {
            state.playgroundModel = event.target.value;
            return;
          }
          if (event.target.matches("[data-playground-protocol]")) {
            state.playgroundProtocol = event.target.value;
            return;
          }
          if (!event.target.matches("[data-token-usage-trend-model]")) return;
          state.tokenUsageTrendModel = event.target.value || ALL_MODELS_VALUE;
          render();
        }

        function syncEndpointCredential() {
          const endpoint = endpointUrlInput.value.trim();
          let external = false;
          let valid = false;
          try {
            const url = new URL(endpoint, window.location.href);
            valid =
              (url.protocol === "http:" || url.protocol === "https:") &&
              !url.username &&
              !url.password;
            external = valid && url.origin !== window.location.origin;
          } catch {
            valid = false;
          }

          apiKeyField.hidden = !external;
          apiKeyInput.disabled = !external;
          if (valid && !external) apiKeyInput.value = "";
          endpointUrlInput.setAttribute(
            "aria-invalid",
            String(endpoint.length > 0 && !valid),
          );
        }

        /**
         * Initializes the application.
         */
        function init() {
          endpointForm.addEventListener("submit", handleFormSubmit);
          pageTabs.addEventListener("click", (event) => {
            const button = event.target.closest("[data-tab]");
            if (button) {
              activateTab(button.dataset.tab);
            }
          });
          pageTabs.addEventListener("keydown", handleTabsKeydown);
          tokenUsagePeriodSelect.addEventListener("change", handlePeriodChange);
          endpointUrlInput.addEventListener("change", () => {
            syncEndpointCredential();
            handleConnectionChange();
          });
          apiKeyInput.addEventListener("change", handleConnectionChange);
          endpointUrlInput.value = DEFAULT_ENDPOINT;
          syncEndpointCredential();
          contentArea.addEventListener("click", handleContentAreaClick);
          contentArea.addEventListener("submit", (event) => {
            if (event.target.matches("[data-playground-form]")) {
              void sendPlaygroundMessage(event);
              return;
            }
            if (
              event.target.matches(
                "[data-codex-callback-form], [data-oauth-callback-form]",
              )
            ) {
              void submitCodexOAuthCallback(event);
              return;
            }
            if (event.target.matches("[data-anthropic-form]")) {
              void saveAnthropicKey(event);
              return;
            }
            if (event.target.matches("[data-opencode-go-form]")) {
              void saveOpenCodeGoToken(event);
              return;
            }
            void handleAdminFormSubmit(event);
          });
          contentArea.addEventListener("change", handleContentAreaChange);
          contentArea.addEventListener("input", (event) => {
            if (event.target.matches("[data-playground-prompt]")) {
              state.playgroundDraft = event.target.value;
              return;
            }
            handleModelsSearch(event);
          });

          const urlParams = new URLSearchParams(window.location.search);
          const periodFromUrl = normalizePeriod(urlParams.get("period"));
          const endpointFromUrl = null;
          const initialEndpoint = DEFAULT_ENDPOINT;

          const initialTab = urlParams.get("tab");
          if (
            [
              "usage",
              "subscriptions",
              "playground",
              "models",
              "admin",
            ].includes(initialTab)
          )
            state.activeTab = initialTab;
          state.tokenUsagePeriod = periodFromUrl;
          tokenUsagePeriodSelect.value = periodFromUrl;
          endpointUrlInput.value = initialEndpoint;
          syncEndpointCredential();
          state.adminConnected = true;
          state.collapsedSections = readCollapsedSections();

          if (state.activeTab === "admin") {
            render("admin");
            if (state.adminConnected) void loadAdminProviders();
          } else if (
            state.activeTab === "playground" ||
            state.activeTab === "models"
          ) {
            render();
            void fetchModels();
          } else if (endpointFromUrl) {
            if (state.activeTab === "subscriptions") {
              void loadProviderAuthStatus();
              void refreshSubscriptionQuotas();
            } else void fetchData();
          } else {
            render();
            if (state.activeTab === "subscriptions") {
              void loadProviderAuthStatus();
              void refreshSubscriptionQuotas();
            }
          }
        }

        const webLogoutButton = document.getElementById("web-logout");
        webLogoutButton?.addEventListener("click", async () => {
          webLogoutButton.disabled = true;
          try {
            await fetch("/auth/logout", {
              method: "POST",
              credentials: "same-origin",
            });
          } finally {
            window.location.replace("/");
          }
        });

        // Start the app
        init();
      });
    </script>
  </body>
</html>
