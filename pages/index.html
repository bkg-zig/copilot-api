        function formatCostAmount(value) {
          if (value === null || value === undefined) return "—";
          const n = Number(value);
          return Number.isFinite(n) ? n.toFixed(4) : "—";
        }

        function normalizeKeyDraft(input) {
          const draft = input && typeof input === "object" ? input : {};
          return {
            id: typeof draft.id === "string" ? draft.id : "",
            name: typeof draft.name === "string" ? draft.name : "",
            allowedModels: Array.isArray(draft.allowedModels)
              ? draft.allowedModels.filter((model) => typeof model === "string")
              : [],
            quotaPeriod: ["day", "month", "lifetime"].includes(draft.quotaPeriod)
              ? draft.quotaPeriod
              : "",
            quotaAmount:
              draft.quotaAmount === null || draft.quotaAmount === undefined
                ? ""
                : String(draft.quotaAmount),
            expiresAt:
              typeof draft.expiresAt === "string" ? draft.expiresAt.slice(0, 16) : "",
          };
        }

        function renderApiKeysCard() {
          const keys = state.admin.apiKeys || [];
          const draft = normalizeKeyDraft(state.admin.keyDraft);
          const rows = keys
            .map((key) => {
              const models =
                key.allowedModels && key.allowedModels.length
                  ? key.allowedModels.join(", ")
                  : "all models";
              const quota = key.quota ? `${key.quota.amount} / ${key.quota.period}` : "—";
              const usage = key.usage || {};
              const remaining =
                usage.remainingAmount === null || usage.remainingAmount === undefined
                  ? "—"
                  : formatCostAmount(usage.remainingAmount);
              return `
              <tr>
                <td>${escapeHtml(key.name || "—")}</td>
                <td><code title="${escapeHtml(key.id)}">${escapeHtml(key.maskedKey || key.key)}</code></td>
                <td>${key.enabled ? "yes" : "no"}</td>
                <td>${escapeHtml(models)}</td>
                <td>${escapeHtml(quota)}</td>
                <td>${formatCostAmount(usage.usedAmount)}</td>
                <td>${remaining}</td>
                <td>${Number(usage.totalTokens ?? 0).toLocaleString()}</td>
                <td>${Number(usage.requestCount ?? 0).toLocaleString()}</td>
                <td>
                  <button type="button" class="admin-btn secondary" data-apikey-copy="${escapeHtml(key.key)}">Copy</button>
                  <button type="button" class="admin-btn secondary" data-apikey-edit="${escapeHtml(key.id)}">Edit</button>
                  <button type="button" class="admin-btn danger" data-apikey-delete="${escapeHtml(key.id)}">Delete</button>
                </td>
              </tr>`;
            })
            .join("");

          const modelOptions = state.admin.models
            .map(
              (model) =>
                `<option value="${escapeHtml(model)}"${draft.allowedModels.includes(model) ? " selected" : ""}>${escapeHtml(model)}</option>`
            )
            .join("");

          const created = state.admin.createdKey
            ? `<div class="admin-note ok">New key created — copy it now, it is shown in full only here:<br><code>${escapeHtml(state.admin.createdKey)}</code></div>`
            : "";

          return `
            <div class="admin-card">
              <h2>Gateway API keys</h2>
              <p class="admin-hint">Client keys for the normal API routes. Restrict each key to specific models and/or a usage quota. Token counts are lifetime totals.</p>
              ${state.admin.apiKeysError ? `<div class="admin-note error">${escapeHtml(state.admin.apiKeysError)}</div>` : ""}
              ${created}
              <table class="admin-table">
                <thead><tr><th>Name</th><th>Key</th><th>Enabled</th><th>Models</th><th>Quota</th><th>Used</th><th>Remaining</th><th>Tokens</th><th>Requests</th><th></th></tr></thead>
                <tbody>${rows || '<tr><td colspan="10">No API keys configured.</td></tr>'}</tbody>
              </table>
              <div class="admin-grid" style="margin-top:14px">
                <div class="admin-field"><label>Name</label><input id="apikey-name" type="text" value="${escapeHtml(draft.name)}" placeholder="e.g. team-alice" /></div>
                <div class="admin-field"><label>Quota period</label><select id="apikey-quota-period">
                  <option value=""${draft.quotaPeriod === "" ? " selected" : ""}>no quota</option>
                  <option value="day"${draft.quotaPeriod === "day" ? " selected" : ""}>per day</option>
                  <option value="month"${draft.quotaPeriod === "month" ? " selected" : ""}>per month</option>
                  <option value="lifetime"${draft.quotaPeriod === "lifetime" ? " selected" : ""}>lifetime</option>
                </select></div>
                <div class="admin-field"><label>Quota amount (cost units)</label><input id="apikey-quota-amount" type="number" min="0" step="0.01" value="${escapeHtml(draft.quotaAmount)}" placeholder="e.g. 25" /></div>
                <div class="admin-field"><label>Expires at (optional)</label><input id="apikey-expires" type="datetime-local" value="${escapeHtml(draft.expiresAt)}" /></div>
                <div class="admin-field" style="grid-column: 1 / -1;"><label>Allowed models (empty = all)</label><select id="apikey-models" multiple size="6">${modelOptions}</select></div>
              </div>
              <div class="admin-actions">
                <button type="button" class="admin-btn" id="apikey-save">${draft.id ? "Save key" : "Create key"}</button>
                <button type="button" class="admin-btn secondary" id="apikey-clear">Clear form</button>
              </div>
            </div>`;
        }

        function readKeyDraftFromDom() {
          const value = (id) => (document.getElementById(id)?.value ?? "").trim();
          const selected = Array.from(
            document.getElementById("apikey-models")?.selectedOptions || []
          ).map((option) => option.value);
          return {
            id: state.admin.keyDraft?.id || "",
            name: value("apikey-name"),
            allowedModels: selected,
            quotaPeriod: value("apikey-quota-period"),
            quotaAmount: value("apikey-quota-amount"),
            expiresAt: value("apikey-expires"),
          };
        }

        async function saveApiKey() {
          const draft = readKeyDraftFromDom();
          const body = { name: draft.name || null };
          body.allowedModels = draft.allowedModels.length ? draft.allowedModels : null;
          if (draft.quotaPeriod) {
            const amount = Number(draft.quotaAmount);
            if (!Number.isFinite(amount) || amount < 0) {
              state.admin.error = "Quota amount must be a non-negative number.";
              render("admin");
              return;
            }
            body.quota = { period: draft.quotaPeriod, amount };
          } else {
            body.quota = null;
          }
          body.expiresAt = draft.expiresAt ? new Date(draft.expiresAt).toISOString() : null;
          try {
            if (draft.id) {
              await adminApiKeysFetch(`/${encodeURIComponent(draft.id)}`, {
                method: "PATCH",
                body,
              });
              state.admin.createdKey = null;
            } else {
              const payload = await adminApiKeysFetch("", { method: "POST", body });
              state.admin.createdKey = payload?.key?.key || null;
            }
            state.admin.keyDraft = null;
            await fetchAdminData();
            state.admin.notice = draft.id ? "API key saved." : "API key created.";
            render("admin");
          } catch (error) {
            state.admin.error = getErrorMessage(error);
            render("admin");
          }
        }

        function wireApiKeysCard() {
          const save = document.getElementById("apikey-save");
          if (save) save.addEventListener("click", () => void saveApiKey());
          const clear = document.getElementById("apikey-clear");
          if (clear) {
            clear.addEventListener("click", () => {
              state.admin.keyDraft = null;
              state.admin.createdKey = null;
              render("admin");
            });
          }
          contentArea.querySelectorAll("[data-apikey-copy]").forEach((button) => {
            button.addEventListener("click", async () => {
              const key = button.getAttribute("data-apikey-copy") || "";
              try {
                await navigator.clipboard.writeText(key);
                state.admin.notice = "API key copied to the clipboard.";
              } catch (error) {
                state.admin.error = "Could not copy: " + getErrorMessage(error);
              }
              render("admin");
            });
          });
          contentArea.querySelectorAll("[data-apikey-edit]").forEach((button) => {
            button.addEventListener("click", () => {
              const id = button.getAttribute("data-apikey-edit");
              const key = (state.admin.apiKeys || []).find((entry) => entry.id === id);
              if (!key) return;
              state.admin.createdKey = null;
              state.admin.keyDraft = {
                id: key.id,
                name: key.name || "",

                quotaPeriod: key.quota?.period || "",

              };
              render("admin");
              document.getElementById("apikey-name")?.scrollIntoView({

                block: "center",

            button.addEventListener("click", () => {
              const id = button.getAttribute("data-apikey-delete");
              const key = (state.admin.apiKeys || []).find((entry) => entry.id === id);
              const label = key?.name || key?.maskedKey || id;
              if (!window.confirm(`Delete API key '${label}'?`)) return;
              void adminAction(
                () => adminApiKeysFetch(`/${encodeURIComponent(id)}`, { method: "DELETE" }),
                `API key '${label}' deleted.`
              );
            });
          });
        }

        async function userRequest(path, method, body) {
          const response = await fetch(authUrl(path), {
            method,
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload?.error?.message || `HTTP ${response.status}`);
          return payload;
        }

        function wireUsersCard() {
          const userPath = (email) => `users/${encodeURIComponent(email)}`;
          document.getElementById("user-create")?.addEventListener("click", () => {
            const email = (document.getElementById("user-new-email")?.value || "").trim();
            const password = document.getElementById("user-new-password")?.value || undefined;
            const role = document.getElementById("user-new-role")?.value || "user";
            void adminAction(async () => {
              const payload = await userRequest("users", "POST", { email, password, role });
              if (state.admin.usersMailReady && !payload.invited) {
                throw new Error(`User '${email}' created, but the invitation email could not be sent. Use "Resend invitation".`);
              }
            }, state.admin.usersMailReady ? `Invitation sent to '${email}'.` : `User '${email}' created.`);
          });
          contentArea.querySelectorAll("[data-user-role]").forEach((select) => {
            select.addEventListener("change", () => {
              const email = select.getAttribute("data-user-role");
              void adminAction(
                () => userRequest(userPath(email), "PATCH", { role: select.value }),
                `Role of '${email}' set to ${select.value}.`
              );
            });
          });
          contentArea.querySelectorAll("[data-user-link]").forEach((button) => {
            button.addEventListener("click", () => {
              const email = button.getAttribute("data-user-link");
              void adminAction(
                () => userRequest(`${userPath(email)}/send-link`, "POST", {}),
                `Email sent to '${email}'.`
              );
            });
          });
          contentArea.querySelectorAll("[data-user-password]").forEach((button) => {
            button.addEventListener("click", () => {
              const email = button.getAttribute("data-user-password");
              const password = window.prompt(`New password for '${email}' (min. 10 characters):`);
              if (!password) return;
              const self = email === state.session?.email;
              void adminAction(
                () => self
                  ? userRequest("password", "POST", {
                      currentPassword: window.prompt("Your current password:") || "",
                      newPassword: password,
                    })
                  : userRequest(userPath(email), "PATCH", { password }),
                `Password of '${email}' updated.`
              );
            });
          });
          contentArea.querySelectorAll("[data-user-delete]").forEach((button) => {
            button.addEventListener("click", () => {
              const email = button.getAttribute("data-user-delete");
              if (!window.confirm(`Delete user '${email}'?`)) return;
              void adminAction(
                () => userRequest(userPath(email), "DELETE"),
                `User '${email}' deleted.`
              );
            });
          });
        }

        function readCheckedPool() {
          const select = document.getElementById("admin-router-pool");
          if (!select) return [];
          return Array.from(select.selectedOptions).map((option) => option.value);
        }

        function readRuleRowsFromDom() {
          const container = document.getElementById("admin-router-rules");
          if (!container) return [];
          return Array.from(container.querySelectorAll(".admin-rule-row")).map(
            (row) => ({
              match: row.querySelector("[data-admin-rule-match]")?.value ?? "",
              model: row.querySelector("[data-admin-rule-model]")?.value ?? "",
            })
          );
        }

        function readMappingRowsFromDom() {
          const container = document.getElementById("admin-mappings-rows");
          if (!container) return [];
          return Array.from(container.querySelectorAll(".admin-map-row")).map(
            (row) => ({
              source: row.querySelector("[data-admin-map-source]")?.value ?? "",
              target: row.querySelector("[data-admin-map-target]")?.value ?? "",
            })
          );
        }

        function syncRouterScalars() {
          const router = state.admin.router;
          const enabled = document.getElementById("admin-router-enabled");
          const alias = document.getElementById("admin-router-alias");
          const strategy = document.getElementById("admin-router-strategy");
          const defaultModel = document.getElementById("admin-router-default");
          if (enabled) router.enabled = enabled.value === "true";
          if (alias) router.alias = alias.value.trim() || "auto";
          if (strategy) router.strategy = strategy.value;
          if (defaultModel) router.defaultModel = defaultModel.value;
          router.pool = readCheckedPool();
        }

        async function adminAction(run, successMessage) {
          state.admin.error = null;
          state.admin.notice = null;
          try {
            await run();
            await fetchAdminData();
            state.admin.notice = successMessage;
            render("admin");
          } catch (error) {
            state.admin.error = getErrorMessage(error);
            render("admin");
          }
        }

        async function saveProvider() {
          const value = (id) => (document.getElementById(id)?.value ?? "").trim();
          const name = value("admin-provider-name");
          if (!name) {
            state.admin.error = "Provider name is required.";
            render("admin");
            return;
          }
          const agents = value("admin-provider-agentsmodels");
          const includeModels = value("admin-provider-includemodels");
          const excludeModels = value("admin-provider-excludemodels");
          const body = {
            name,
            type: value("admin-provider-type") || "openai-compatible",
            enabled: value("admin-provider-enabled") === "true",
            baseUrl: value("admin-provider-baseurl"),
            apiKey: document.getElementById("admin-provider-apikey")?.value ?? "",
            apiKeys: parseProviderApiKeys(document.getElementById("admin-provider-apikeys")?.value ?? ""),
            cookie: document.getElementById("admin-provider-cookie")?.value ?? "",
            modelsDevProviderId: value("admin-provider-modelsdev"),
            authType: value("admin-provider-authtype"),
            agentsModels: agents
              ? agents.split(",").map((part) => part.trim()).filter(Boolean)
              : null,
            includeModels: includeModels
              ? includeModels.split(",").map((part) => part.trim()).filter(Boolean)
              : null,
            excludeModels: excludeModels
              ? excludeModels.split(",").map((part) => part.trim()).filter(Boolean)
              : null,
          };
          await adminAction(
            () => adminFetch("providers", { method: "POST", body }),
            "Provider saved."
          );

        async function deleteProvider(name) {
          if (!name) return;
          await adminAction(
            () => adminFetch(`providers/${encodeURIComponent(name)}`, { method: "DELETE" }),
            `Provider '${name}' deleted.`
          );
        }

        async function saveKeys() {
          const apiKeys = (document.getElementById("admin-keys-apikeys")?.value || "")
            .split("\n")
            .map((key) => key.trim())
            .filter(Boolean);
          const adminApiKey = (document.getElementById("admin-keys-adminkey")?.value || "").trim();
          const body = { apiKeys };
          if (adminApiKey) body.adminApiKey = adminApiKey;
          await adminAction(
            () => adminFetch("keys", { method: "POST", body }),
            "Keys saved."
          );
        }

        async function saveRouter() {
          syncRouterScalars();
          const router = state.admin.router;
          const rules = readRuleRowsFromDom().filter(
            (rule) => rule.match.trim() && rule.model.trim()
          );
          const body = {
            enabled: router.enabled,
            alias: router.alias || "auto",
            pool: router.pool,
            strategy: router.strategy,
            rules,
          };
          if (router.defaultModel) body.defaultModel = router.defaultModel;
          if (router.modelHints && Object.keys(router.modelHints).length) {
            body.modelHints = router.modelHints;
          }
          await adminAction(
            () => adminFetch("router", { method: "POST", body }),
            "Router saved."
          );
        }

        async function saveMappings() {
          const rows = readMappingRowsFromDom().filter(
            (row) => row.source.trim() && row.target.trim()
          );
          const modelMappings = {};
          for (const row of rows) modelMappings[row.source.trim()] = row.target.trim();
          await adminAction(
            () => adminFetch("model-mappings", { method: "POST", body: { modelMappings } }),
            "Mappings saved."
          );
        }

                apiKey: provider.apiKey || "",
                apiKeys: Array.isArray(provider.apiKeys) ? provider.apiKeys : [],
                cookie: provider.cookie || "",
                modelsDevProviderId: provider.modelsDevProviderId || "",
                authType: provider.authType || "",
                agentsModels: Array.isArray(provider.agentsModels)
                  ? provider.agentsModels.join(", ")
                  : "",
                includeModels: Array.isArray(provider.includeModels)
                  ? provider.includeModels.join(", ")
                  : "",
                excludeModels: Array.isArray(provider.excludeModels)

            allowedProviders: (document.getElementById("vmodel-providers")?.value || "")

              .filter(Boolean),

              .split(",")
              .map((s) => s.trim())
              .filter(Boolean),

        function clearVirtualModelForm() {
          const fields = [
            "vmodel-name",
            "vmodel-target",
            "vmodel-providers",
            "vmodel-context",
            "vmodel-version",
            "vmodel-v2threads",
            "vmodel-enabled",
            "vmodel-description",
            "vmodel-tags",
          ];
          fields.forEach((id) => {
            const el = document.getElementById(id);
            if (el) {
              if (el.type === "select-one") el.value = el.options[0]?.value || "";
              else el.value = "";
            }
          });
        }

        async function upsertVirtualModel() {
          const form = readVirtualModelForm();
          if (!form.name) {
            state.admin.error = "Virtual model name is required.";
            render("admin");
            return;
          }
          if (!form.target) {
            state.admin.error = "Target model is required.";
            render("admin");
            return;
          }

          const config = {
            target: form.target,
            allowedProviders: form.allowedProviders.length ? form.allowedProviders : undefined,
            contextWindow: form.contextWindow ? Number(form.contextWindow) : undefined,
            version: form.version || "base",
            v2ThreadLimit: form.v2ThreadLimit ? Number(form.v2ThreadLimit) : undefined,
            enabled: form.enabled,
            description: form.description || undefined,
            tags: form.tags.length ? form.tags : undefined,
          };

          state.admin.error = null;
          state.admin.notice = null;

          try {
            await adminFetch("virtual-models/upsert", {
              method: "POST",
              body: { name: form.name, config },
            });
            state.admin.notice = `Virtual model '${form.name}' saved.`;
            clearVirtualModelForm();
            await fetchAdminData();
          } catch (error) {
            state.admin.error = getErrorMessage(error);
            render("admin");
          }
        }

        function editVirtualModel(name) {
          const vm = state.admin.virtualModels?.models?.[name];
          if (!vm) return;

          const nameEl = document.getElementById("vmodel-name");
          const targetEl = document.getElementById("vmodel-target");
          const providersEl = document.getElementById("vmodel-providers");
          const contextEl = document.getElementById("vmodel-context");
          const versionEl = document.getElementById("vmodel-version");
          const v2threadsEl = document.getElementById("vmodel-v2threads");
          const enabledEl = document.getElementById("vmodel-enabled");
          const descriptionEl = document.getElementById("vmodel-description");
          const tagsEl = document.getElementById("vmodel-tags");

          if (nameEl) nameEl.value = name;
          if (targetEl) targetEl.value = vm.target || "";
          if (providersEl) providersEl.value = vm.allowedProviders?.join(", ") || "";
          if (contextEl) contextEl.value = vm.contextWindow || "";
          if (versionEl) versionEl.value = vm.version || "base";
          if (v2threadsEl) v2threadsEl.value = vm.v2ThreadLimit || "";
          if (enabledEl) enabledEl.value = vm.enabled !== false ? "true" : "false";
          if (descriptionEl) descriptionEl.value = vm.description || "";
          if (tagsEl) tagsEl.value = vm.tags?.join(", ") || "";

          nameEl?.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        async function removeVirtualModel(name) {
          if (!confirm(`Remove virtual model '${name}'?`)) return;

          state.admin.error = null;
          state.admin.notice = null;

          try {
            await adminFetch(`virtual-models/${encodeURIComponent(name)}`, { method: "DELETE" });
            state.admin.notice = `Virtual model '${name}' removed.`;
            await fetchAdminData();
          } catch (error) {
            state.admin.error = getErrorMessage(error);
            render("admin");
          }
        }

        async function saveVirtualModelDefaults() {
          const defaults = {
            version: document.getElementById("vmodel-default-version")?.value || "base",
            v2ThreadLimit: (document.getElementById("vmodel-default-v2threads")?.value || "").trim(),
            contextWindow: (document.getElementById("vmodel-default-context")?.value || "").trim(),
          };

          const currentModels = state.admin.virtualModels?.models || {};
          const body = {
            models: currentModels,
            defaults: {
              version: defaults.version,
              v2ThreadLimit: defaults.v2ThreadLimit ? Number(defaults.v2ThreadLimit) : undefined,
              contextWindow: defaults.contextWindow ? Number(defaults.contextWindow) : undefined,
            },
          };

          state.admin.error = null;
          state.admin.notice = null;

          try {
            await adminFetch("virtual-models", {
              method: "POST",
              body,
            });
            state.admin.notice = "Virtual model defaults saved.";
            await fetchAdminData();
          } catch (error) {
            state.admin.error = getErrorMessage(error);
            render("admin");
          }
        }

        let currentEndpointOrigin = "";

        function syncEndpointCredential() {
          const endpoint = endpointUrlInput.value.trim();
          const endpointOrigin = getEndpointOrigin(endpoint);
          if (endpointOrigin === currentEndpointOrigin) {
            return;
          }
          apiKeyInput.value = loadStoredApiKey(endpoint);
          currentEndpointOrigin = endpointOrigin;
        }

        /**
         * Initializes the application.
         */
        function init() {
          endpointForm.addEventListener("submit", handleFormSubmit);
          pageTabs.addEventListener("click", (event) => {
            const button = event.target.closest("[data-tab]");
            if (button) {
              activateTab(button.dataset.tab);
            }
          });
          pageTabs.addEventListener("keydown", handleTabsKeydown);
          tokenUsagePeriodSelect.addEventListener("change", handlePeriodChange);
          apiKeyInput.addEventListener("input", () => {
            storeApiKey(
              apiKeyInput.value,
              endpointUrlInput.value.trim()
            );
            handleConnectionChange();
          });
          endpointUrlInput.addEventListener("input", handleConnectionChange);
          endpointUrlInput.addEventListener("change", () => {
            syncEndpointCredential();
            handleConnectionChange();
          });
          contentArea.addEventListener("click", handleContentAreaClick);
          contentArea.addEventListener("change", handleContentAreaChange);
          contentArea.addEventListener("input", handleModelsSearch);

          const urlParams = new URLSearchParams(window.location.search);
          const periodFromUrl = normalizePeriod(urlParams.get("period"));
          const endpointFromUrl = urlParams.get("endpoint");
          const initialEndpoint = endpointFromUrl || DEFAULT_ENDPOINT;

          const initialTab = urlParams.get("tab");
          if (["usage", "subscriptions", "models", "providers", "admin"].includes(initialTab)) state.activeTab = initialTab;
          state.tokenUsagePeriod = periodFromUrl;
          tokenUsagePeriodSelect.value = periodFromUrl;
          endpointUrlInput.value = initialEndpoint;
          migrateLegacyApiKey(initialEndpoint);
          syncEndpointCredential();
          state.collapsedSections = readCollapsedSections();

          const startApp = () => {
            if (state.session && state.activeTab === "admin" && state.session.role !== "admin") {
              state.activeTab = "usage";
            }
            if (endpointFromUrl || state.session) {
              if (state.activeTab === "subscriptions") void refreshSubscriptionQuotas();
              else if (state.activeTab === "models") void fetchModels();
              else if (state.activeTab === "admin") void fetchAdminData();
              else if (state.activeTab === "usage") void fetchData();
              else render();
            } else {
              render();
            }
          };
          void initAuth(startApp);
        }

        // --- Text size (low-vision friendly, remembered per browser) ---
        const FONT_SCALE_KEY = "copilot-api.ui-scale-v2";
        const FONT_SCALE_STEPS = [0.9, 1, 1.1, 1.25, 1.4, 1.6, 1.8, 2];
        function currentFontScale() {
          const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ui-scale"));
          return Number.isFinite(value) ? value : 1;
        }
        function setFontScale(scale) {
          document.documentElement.style.setProperty("--ui-scale", String(scale));
          document.getElementById("font-scale-value").textContent = `${Math.round(scale * 100)}%`;
          try {
            window.localStorage.setItem(FONT_SCALE_KEY, String(scale));
          } catch (error) {
            console.warn("Could not store text size:", getErrorMessage(error));
          }
        }
        function stepFontScale(direction) {
          const current = currentFontScale();
          const next = direction > 0
            ? FONT_SCALE_STEPS.find((step) => step > current + 0.001)
            : [...FONT_SCALE_STEPS].reverse().find((step) => step < current - 0.001);
          if (next !== undefined) setFontScale(next);
        }
        document.getElementById("font-smaller").addEventListener("click", () => stepFontScale(-1));
        document.getElementById("font-bigger").addEventListener("click", () => stepFontScale(1));
        document.getElementById("font-scale-value").textContent = `${Math.round(currentFontScale() * 100)}%`;

        // --- Dashboard login (session cookie, user/admin roles) ---
        const authGate = document.getElementById("auth-gate");
        const authForm = document.getElementById("auth-form");
        const authError = document.getElementById("auth-error");
        const authAdminKeyField = document.getElementById("auth-admin-key-field");
        let authMode = "login";
        let afterLogin = () => render();

        function authUrl(path) {
          return new URL(`/auth/${path}`, window.location.origin).toString();
        }

        async function authRequest(path, body) {
          const response = await fetch(authUrl(path), {
            method: body === undefined ? "GET" : "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload?.error?.message || `HTTP ${response.status}`);
          }
          return payload;
        }

        let authStatus = {};
        let authLinkToken = null;
        const authEmail = document.getElementById("auth-email");
        const authPassword = document.getElementById("auth-password");
        const authPassword2 = document.getElementById("auth-password2");
        const authInfo = document.getElementById("auth-info");

        function setAuthMessage(error, info) {
          authError.textContent = error || "";
          authError.hidden = !error;
          authInfo.textContent = info || "";
          authInfo.hidden = !info;
        }

        // Modes: "login", "setup" (first admin), "link" (password from an emailed link).
        function showAuthGate(mode, message, linkInfo) {
          authMode = mode;
          const setup = mode === "setup";
          const link = mode === "link";
          const adminReset = mode === "adminreset";
          const setupByEmail = setup && authStatus.setupByEmail;
          const keySetup = setup && authStatus.setupNeedsAdminKey;
          const titles = {
            login: "Sign in",
            setup: "Set up the first admin",
            adminreset: "Reset password with admin key",
            link: linkInfo?.purpose === "reset" ? "Choose a new password" : "Choose your password",
          };
          document.getElementById("auth-title").textContent = titles[mode];
          document.getElementById("auth-description").textContent = link
            ? `For ${linkInfo?.email || "your account"}. At least 10 characters.`
            : adminReset
              ? "Enter the account email, a new password, and the admin API key from config.json (auth.adminApiKey)."
            : setup
              ? setupByEmail
                ? "No account exists yet. A setup link goes to the admin email address."
                : "No account exists yet. Create the first admin with the admin API key from config.json (auth.adminApiKey)."
              : "Sign in with your email address.";
          document.getElementById("auth-setup-mail").hidden = !setupByEmail;
          document.getElementById("auth-setup-mail-hint").textContent = setupByEmail
            ? `The link is sent to ${authStatus.setupEmailHint}. It is valid for 30 minutes.${keySetup ? " Without email: use the admin API key below." : ""}`
            : "";
          document.getElementById("auth-fields").hidden = setup && !keySetup;
          authEmail.readOnly = link;
          if (link) authEmail.value = linkInfo?.email || "";
          authPassword.autocomplete = setup || link || adminReset ? "new-password" : "current-password";
          document.getElementById("auth-password2-field").hidden = !(link || adminReset);
          authPassword2.required = link || adminReset;
          authAdminKeyField.hidden = !(keySetup || adminReset);
          document.getElementById("auth-forgot").hidden = !(mode === "login" && authStatus.passwordResetAvailable);
          document.getElementById("auth-adminreset").hidden = !(mode === "login" && authStatus.setupNeedsAdminKey);
          document.getElementById("auth-submit").textContent = adminReset ? "Reset password" : link ? "Save password and sign in" : setup ? "Create admin" : "Sign in";
          setAuthMessage(message, null);
          authGate.hidden = false;
          (adminReset ? authEmail : link ? authPassword : setupByEmail && !keySetup ? document.getElementById("auth-setup-mail-button") : authEmail).focus();
        }

        function applySession(user) {
          state.session = user;
          const chip = document.getElementById("session-chip");
          chip.hidden = !user;
          document.getElementById("session-user").textContent = user ? user.email : "";
          document.getElementById("session-role").textContent = user ? user.role : "";
          // A session replaces manual key entry in the dashboard.
          document.getElementById("credential-field").hidden = Boolean(user);
          document.getElementById("credential-hint").hidden = Boolean(user);
          document.getElementById("admin-tab").hidden = Boolean(user) && user.role !== "admin";
          if (user) authGate.hidden = true;
        }

        // Takes ?auth_token=… from an emailed link and removes it from the address bar.
        function takeLinkToken() {
          const url = new URL(window.location.href);
          const token = url.searchParams.get("auth_token");
          if (!token) return null;
          url.searchParams.delete("auth_token");
          window.history.replaceState(null, "", url.toString());
          return token;
        }

        async function initAuth(start) {
          afterLogin = start;
          const linkToken = takeLinkToken();
          try {
            authStatus = await authRequest("status");
          } catch (error) {
            // Older gateway without login support: keep the key-based flow.
            start();
            return;
          }
          state.authSetupNeedsAdminKey = Boolean(authStatus.setupNeedsAdminKey);
          if (linkToken) {
            try {
              const info = await authRequest("link/inspect", { token: linkToken });
              authLinkToken = linkToken;
              showAuthGate("link", null, info);
              return;
            } catch (error) {
              if (authStatus.user) {
                applySession(authStatus.user);
                start();
                return;
              }
              showAuthGate(authStatus.setupRequired ? "setup" : "login", getErrorMessage(error));
              return;
            }
          }
          if (authStatus.user) {
            applySession(authStatus.user);
            start();
            return;
          }
          showAuthGate(authStatus.setupRequired ? "setup" : "login");
        }

        document.getElementById("auth-setup-mail-button").addEventListener("click", async (event) => {
          const button = event.currentTarget;
          button.disabled = true;
          setAuthMessage(null, null);
          try {
            const payload = await authRequest("setup/request", {});
            setAuthMessage(null, `Email sent to ${payload.to}. Open the link in it to set your password.`);
          } catch (error) {
            setAuthMessage(getErrorMessage(error), null);
          } finally {
            button.disabled = false;
          }
        });

        document.getElementById("auth-forgot").addEventListener("click", async () => {
          const email = authEmail.value.trim();
          if (!email) {
            setAuthMessage("Enter your email address first.", null);
            authEmail.focus();
            return;
          }
          try {
            await authRequest("password/forgot", { email });
            setAuthMessage(null, "If this address has an account, a reset link is on its way.");
          } catch (error) {
            setAuthMessage(getErrorMessage(error), null);
          }
        });

        document.getElementById("auth-adminreset").addEventListener("click", () => {
          authPassword.value = "";
          authPassword2.value = "";
          document.getElementById("auth-admin-key").value = "";
          showAuthGate("adminreset");
        });

        authForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const submit = document.getElementById("auth-submit");
          setAuthMessage(null, null);
          let path;
          let body;
          if (authMode === "link") {
            if (authPassword.value !== authPassword2.value) {
              setAuthMessage("The passwords do not match.", null);
              return;
            }
            path = "link/complete";
            body = { token: authLinkToken, password: authPassword.value };
          } else if (authMode === "adminreset") {
            if (authPassword.value !== authPassword2.value) {
              setAuthMessage("The passwords do not match.", null);
              return;
            }
            path = "password/reset-via-admin";
            body = {
              email: authEmail.value.trim(),
              password: authPassword.value,
              adminKey: document.getElementById("auth-admin-key").value.trim(),
            };
          } else {
            path = authMode === "setup" ? "setup" : "login";
            body = { email: authEmail.value.trim(), password: authPassword.value };
            if (authMode === "setup") body.adminKey = document.getElementById("auth-admin-key").value.trim();
          }
          submit.disabled = true;
          try {
            const payload = await authRequest(path, body);
            authPassword.value = "";
            authPassword2.value = "";
            document.getElementById("auth-admin-key").value = "";
            authLinkToken = null;
            authEmail.readOnly = false;
            if (authMode === "adminreset") {
              showAuthGate("login", "Password changed. Sign in with the new password.");
              return;
            }
            applySession(payload.user);
            afterLogin();
          } catch (error) {
            setAuthMessage(getErrorMessage(error), null);
          } finally {
            submit.disabled = false;
          }
        });

        document.getElementById("logout-button").addEventListener("click", async () => {
          try {
            await authRequest("logout", {});
          } catch (error) {
            console.warn("Logout failed:", getErrorMessage(error));
          }
          applySession(null);
          showAuthGate("login");
        });

        // An expired session surfaces as 401 on same-origin API calls.
        const nativeFetch = window.fetch.bind(window);
        window.fetch = async (input, init) => {
          const response = await nativeFetch(input, init);
          if (response.status === 401 && state.session) {
            const url = new URL(typeof input === "string" ? input : input.url, window.location.href);
            if (url.origin === window.location.origin && !url.pathname.startsWith("/auth/")) {
              applySession(null);
              showAuthGate("login", "Your session has expired. Please sign in again.");
            }
          }
          return response;
        };

        // Start the app
        init();
      });
    </script>

  </body>
</html>
