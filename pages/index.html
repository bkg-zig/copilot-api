<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copi | BKG Model Gateway</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Das Tailwind-CDN injiziert sein Preflight nach unseren Stylesheets und
      // setzt damit graue Standard-Rahmen. Unser Neon-Design bringt自身 einen
      // Reset mit; Preflight wird deshalb deaktiviert, Utilities bleiben aktiv.
      if (window.tailwind) {
        window.tailwind.config = { corePlugins: { preflight: false } };
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js"></script>

    <style>
      :root {
        --page-zoom: 0.9;
        zoom: var(--page-zoom);

        --color-red: var(--neon-red);
        --color-green: var(--neon-green);
        --color-yellow: var(--neon-amber);
        --color-blue: var(--neon-cyan-dark);
        --color-purple: var(--neon-violet);
        --color-aqua: var(--neon-cyan);
        --color-orange: var(--neon-orange);
        --color-gray: var(--text-secondary);

        --color-red-accent: var(--neon-red-bright);
        --color-green-accent: var(--neon-green-bright);
        --color-yellow-accent: var(--neon-amber-bright);
        --color-blue-accent: var(--neon-cyan);
        --color-purple-accent: var(--neon-violet-bright);
        --color-aqua-accent: var(--neon-cyan-bright);
        --color-orange-accent: var(--neon-orange-bright);
        --color-gray-accent: var(--text-secondary);

        --color-bg-darkest: var(--cyber-bg-deep);
        --color-bg: var(--cyber-panel);
        --color-bg-light-1: var(--cyber-panel-2);
        --color-bg-light-2: var(--cyber-panel-3);
        --color-bg-light-3: var(--border);
        --color-bg-light-4: var(--text-muted);
        --color-bg-soft: var(--cyber-panel-3);

        --color-fg-darker: var(--text-muted);
        --color-fg-dark: var(--text-secondary);
        --color-fg-medium: var(--text-secondary);
        --color-fg-light: var(--text-primary);
        --color-fg-lightest: var(--text-primary);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Rajdhani", sans-serif;
        background-color: var(--cyber-bg-deep);
        color: var(--color-fg-light);
      }

      .app-shell {
        min-height: calc(100vh / var(--page-zoom));
        background: linear-gradient(180deg, var(--cyber-bg) 0%, var(--cyber-bg-deep) 100%);
      }

      .main-shell {
        min-width: 0;
        padding: 16px 24px 24px;
      }

      .topbar {
        margin: 0 auto 10px;
        max-width: 1720px;
      }

      .topbar-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 10px;
      }

      .page-title {
        font-size: clamp(28px, 3vw, 38px);
        font-weight: 750;
        line-height: 1.05;
        color: var(--color-fg-lightest);
      }

      .page-subtitle {
        margin-top: 4px;
        color: var(--color-gray);
        font-size: 14px;
      }

      .control-surface {
        display: grid;
        grid-template-columns:
          minmax(320px, 1fr)
          minmax(220px, 320px)
          150px
          132px;
        gap: 12px;
        align-items: end;
      }

      [hidden] {
        display: none !important;
      }

      .page-tabs {
        display: inline-flex;
        max-width: 100%;
        gap: 4px;
        margin-bottom: 14px;
        padding: 4px;
        border: 1px solid var(--color-bg-light-2);
        border-radius: 10px;
        background: var(--cyber-panel);
      }

      .page-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 7px;
        color: var(--color-gray);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .page-tab[aria-selected="true"] {
        background: var(--color-blue);
        color: var(--cyber-bg-deep);
      }

      .page-tab:focus-visible,
      .models-action:focus-visible {
        outline: 2px solid var(--color-blue);
        outline-offset: 3px;
      }

      .control-surface.models-view {
        grid-template-columns: minmax(320px, 1fr) minmax(220px, 320px) 132px;
      }

      .models-toolbar {
        flex-wrap: wrap;
        padding: 14px;
      }

      .models-toolbar .models-search {
        width: min(340px, 100%);
      }

      .models-table-scroll {
        overflow-x: auto;
      }

      .models-table {
        width: 100%;
        min-width: 640px;
        border-collapse: collapse;
        table-layout: fixed;
        text-align: left;
        font-size: 13px;
      }

      .models-table th,
      .models-table td {
        padding: 14px;
        border-bottom: 1px solid var(--color-bg-light-2);
        overflow-wrap: anywhere;
      }

      .models-table th {
        background: var(--cyber-panel-2);
        color: var(--color-gray);
        font-size: 12px;
        font-weight: 700;
      }

      .models-id {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .models-id code {
        min-width: 0;
        color: var(--color-fg-lightest);
        font-size: 12px;
      }

      .models-action {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        color: var(--color-blue);
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }

      .models-action:hover {
        color: var(--color-blue-accent);
        text-decoration: underline;
      }

      .models-table .models-json-cell {
        padding: 0;
      }

      .models-json {
        margin: 0;
        max-height: 480px;
        overflow-y: auto;
        padding: 16px;
        background: var(--cyber-panel-2);
        color: var(--color-fg-medium);
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        color: var(--color-fg-medium);
        font-size: 12px;
        font-weight: 700;
      }

      .input-control,
      .select-control {
        width: 100%;
        height: 42px;
        border: 1px solid var(--color-bg-light-3);
        border-radius: 8px;
        background: var(--cyber-panel);
        color: var(--color-fg-lightest);
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.16s ease,
          box-shadow 0.16s ease,
          background-color 0.16s ease;
      }

      .input-control {
        padding: 0 12px;
      }

      .select-control {
        padding: 0 34px 0 12px;
      }

      .input-control::placeholder {
        color: var(--text-muted);
      }

      .primary-action {
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--color-blue);
        color: var(--cyber-bg-deep);
        font-size: 14px;
        font-weight: 700;
        transition:
          background-color 0.16s ease,
          transform 0.16s ease;
      }

      .primary-action:hover {
        background: var(--color-blue-accent);
      }

      .content-area {
        max-width: 1720px;
        margin: 0 auto;
      }

      .dashboard-section {
        margin-bottom: 10px;
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        color: var(--color-fg-lightest);
        font-size: 16px;
        font-weight: 750;
      }

      .collapse-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .collapse-toggle:focus-visible {
        outline: 2px solid var(--color-blue);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .collapse-chevron {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: var(--color-gray);
      }

      .collapse-toggle[aria-expanded="false"] .collapse-chevron {
        transform: rotate(-90deg);
      }

      .collapse-body[hidden] {
        display: none !important;
      }

      .panel-header:has(+ .collapse-body[hidden]) {
        border-bottom-color: transparent;
      }

      .section-subtitle {
        margin-top: -4px;
        margin-bottom: 8px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .panel {
        border: 1px solid var(--color-bg-light-2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--color-bg-light-2);
      }

      .panel-title {
        color: var(--color-fg-lightest);
        font-size: 14px;
        font-weight: 750;
      }

      .panel-meta {
        margin-top: 2px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }

      .metric-grid-tight {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .subscription-grid {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      }

      .metric-grid-tight .metric-label {
        white-space: nowrap;
      }

      .metric-card {
        min-height: 88px;
        padding: 12px;
        border: 1px solid var(--color-bg-light-2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
      }

      .metric-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--color-fg-medium);
        font-size: 13px;
        font-weight: 650;
      }

      .metric-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .metric-value {
        margin-top: 10px;
        color: var(--color-fg-lightest);
        font-size: clamp(20px, 2vw, 28px);
        font-weight: 800;
        line-height: 1.1;
      }

      .metric-note {
        margin-top: 4px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .progress-bar-bg {
        background-color: var(--color-bg-soft);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-bar-fg {
        border-radius: 999px;
        transition: width 0.5s ease-in-out;
      }

      .code-block::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .code-block::-webkit-scrollbar-track {
        background: var(--color-bg-light-1);
      }

      .code-block::-webkit-scrollbar-thumb {
        background: var(--color-bg-light-3);
        border-radius: 999px;
      }

      .code-block::-webkit-scrollbar-thumb:hover {
        background: var(--color-bg-light-4);
      }

      .input-focus:focus {
        border-color: var(--color-blue);
        box-shadow: 0 0 0 3px rgba(0, 255, 204, 0.14);
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .data-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      .data-table thead {
        background: var(--color-bg-light-1);
        color: var(--color-fg-medium);
      }

      .data-table th {
        font-size: 12px;
        font-weight: 750;
      }

      .data-table td {
        font-size: 12px;
      }

      .data-table th,
      .data-table td {
        border-bottom: 1px solid var(--color-bg-light-2);
      }

      /* Breakdown tables: numeric columns hug their content, first column takes the rest and wraps. */
      .breakdown-table th:not(:first-child),
      .breakdown-table td:not(:first-child) {
        white-space: nowrap;
        padding-left: 10px;
        padding-right: 10px;
      }

      .events-table th,
      .events-table td {
        padding-left: 10px;
        padding-right: 10px;
      }

      .breakdown-table td:first-child {
        min-width: 260px;
        overflow-wrap: anywhere;
      }

      .pill-button {
        border: 1px solid var(--color-bg-light-2);
        border-radius: 7px;
        background: var(--color-bg);
        color: var(--color-fg-medium);
      }

      .quick-state-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }

      @media (max-width: 899px) {
        .metric-grid-tight {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 1100px) {
        .control-surface {
          grid-template-columns: minmax(0, 1fr) 170px 132px;
        }

        .endpoint-field {
          grid-column: 1 / -1;
        }

        .control-surface.models-view {
          grid-template-columns: minmax(0, 1fr) 132px;
        }
      }

      @media (max-width: 639px) {
        .page-tabs {
          display: flex;
          width: 100%;
          gap: 2px;
        }
        .page-tab {
          flex: 1 1 auto;
          min-width: 0;
          justify-content: center;
          gap: 5px;
          padding: 8px;
          font-size: 12px;
          white-space: nowrap;
        }
        .main-shell {
          padding: 12px 14px 18px;
        }

        .topbar-row {
          display: block;
        }

        .control-surface,
        .control-surface.models-view {
          grid-template-columns: 1fr;
        }

        .models-toolbar .models-search {
          width: 100%;
        }

        .endpoint-field {
          grid-column: auto;
        }

        .metric-grid-tight {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* Subscription allowance workspace. Provider SVGs are bundled from models.dev. */
      .subscriptions-page {
        --quota-text: var(--color-ink, var(--color-fg-lightest));
        --quota-muted: var(--color-ink-soft, var(--color-gray));
        --quota-faint: var(--color-ink-faint, var(--color-fg-darker));
        --quota-line: var(--color-line, var(--color-bg-light-2));
        --quota-soft: var(--color-sunken, var(--color-bg-light-1));
        --quota-surface: var(--color-surface, var(--color-bg));
        padding: 0;
        color: var(--quota-text);
      }
      .subscriptions-page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 26px;
      }
      .subscriptions-eyebrow {
        margin: 0 0 7px;
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.16em;
        color: var(--quota-faint);
      }
      .subscriptions-page-heading h2 {
        margin: 0;
        font-size: 25px;
        font-weight: 650;
        letter-spacing: -0.04em;
        line-height: 1.25;
      }
      .subscriptions-description {
        margin: 9px 0 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--quota-muted);
      }
      .subscriptions-count {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        flex-shrink: 0;
        padding: 7px 11px;
        border: 1px solid var(--quota-line);
        border-radius: 99px;
        font-size: 11px;
        color: var(--quota-muted);
        background: var(--quota-surface);
      }
      .subscriptions-count > span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--neon-mint);
      }
      .subscriptions-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        align-items: start;
      }
      .quota-provider-card {
        --quota-brand: #b98cff;
        position: relative;
        min-width: 0;
        padding: 22px 20px 14px;
        overflow: hidden;
        border: 1px solid var(--quota-line);
        border-radius: 18px;
        background: var(--quota-surface);
        box-shadow: 0 3px 12px rgb(0 0 0 / 2%);
      }
      .quota-provider-card[data-provider="codex"] {
        --quota-brand: var(--neon-mint);
      }
      .quota-provider-card[data-provider="anthropic"] {
        --quota-brand: var(--copi-violet, #7c5cbf);
      }
      .quota-provider-card[data-provider="xai"] {
        --quota-brand: #4dc3ff;
      }
      .dark .quota-provider-card {
        --quota-brand: #d77bff;
      }
      .dark .quota-provider-card[data-provider="codex"] {
        --quota-brand: #4dffb8;
      }
      .dark .quota-provider-card[data-provider="xai"] {
        --quota-brand: #6f8cff;
      }
      .quota-card-header {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .quota-provider-logo {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border: 1px solid var(--quota-line);
        border-radius: 13px;
        background: var(--quota-soft);
      }
      .quota-provider-logo img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }
      .quota-card-header h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.025em;
        line-height: 1.3;
      }
      .quota-provider-product {
        margin: 3px 0 0;
        font-size: 11px;
        color: var(--quota-faint);
      }
      .quota-refresh {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        padding: 0;
        margin-left: auto;
        border: 1px solid var(--quota-line);
        border-radius: 9px;
        color: var(--quota-muted);
        background: var(--quota-surface);
        cursor: pointer;
      }
      .quota-refresh:hover {
        background: var(--quota-soft);
        color: var(--quota-text);
      }
      .quota-refresh:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .quota-card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 17px 0 0;
      }
      .quota-plan {
        min-width: 0;
        max-width: 65%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--quota-soft);
        color: var(--quota-muted);
        font-size: 11px;
        font-weight: 500;
      }
      .quota-status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
        font-size: 10px;
        color: var(--quota-faint);
      }
      .quota-status > span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }
      .quota-status[data-state="ready"] {
        color: var(--quota-muted);
      }
      .quota-status[data-state="warning"] {
        color: #ffc94d;
      }
      .quota-summary {
        margin: 18px 0 22px;
        padding: 18px;
        border-radius: 13px;
        background: color-mix(
          in srgb,
          var(--quota-brand) 4%,
          var(--quota-soft)
        );
      }
      .quota-summary-label {
        margin: 0 0 9px;
        font-size: 11px;
        font-weight: 500;
        color: var(--quota-muted);
      }
      .quota-summary-value {
        font-size: 40px;
        line-height: 1.05;
        font-weight: 600;
        letter-spacing: -0.055em;
        font-variant-numeric: tabular-nums;
      }
      .quota-summary-context {
        margin: 9px 0 0;
        font-size: 11px;
        color: var(--quota-faint);
      }
      .quota-details {
        font-size: 12px;
      }
      .quota-window + .quota-window {
        margin-top: 18px;
      }
      .quota-window-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 7px;
        font-size: 12px;
      }
      .quota-window-heading > :first-child {
        color: var(--quota-muted);
      }
      .quota-window-heading > :last-child {
        font-weight: 550;
        color: var(--quota-text);
      }
      .quota-progress {
        height: 6px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--quota-soft);
      }
      .quota-progress-fill {
        height: 100%;
        border-radius: inherit;
        background: var(--quota-brand);
        transition: width 0.25s ease;
      }
      .quota-window[data-warning="true"] .quota-progress-fill {
        background: #ffc94d;
      }
      .quota-window-note {
        margin: 6px 0 0;
        font-size: 11px;
        color: var(--quota-faint);
        line-height: 1.5;
      }
      .quota-balance {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--quota-line);
        font-size: 12px;
        color: var(--quota-muted);
      }
      .quota-balance strong {
        color: var(--quota-text);
        font-weight: 600;
      }
      .quota-notice {
        margin: 0 0 15px;
        padding: 10px 12px;
        border-radius: 9px;
        background: rgb(213 138 37 / 8%);
        color: #ff8800;
        font-size: 12px;
        line-height: 1.6;
      }
      .quota-card-footer {
        margin-top: 22px;
        padding-top: 12px;
        border-top: 1px solid var(--quota-line);
        color: var(--quota-faint);

      .quota-card-message {
        display: flex;
        align-items: center;
        min-height: 180px;
        margin: 0;
        font-size: 12px;
        line-height: 1.8;
        color: var(--quota-muted);
      }
      .quota-card-message[role="alert"] {
        color: #ff8800;
      }
      .quota-skeleton {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        min-height: 230px;
        animation: quota-pulse 1.5s ease-in-out infinite;
      }
      .quota-skeleton > div {
        height: 9px;
        border-radius: 6px;
        background: var(--quota-soft);
      }
      .quota-skeleton > div:first-child {
        width: 55%;
        height: 42px;
        margin-bottom: 22px;
      }
      .quota-skeleton > div:last-child {
        width: 75%;
      }
      @keyframes quota-pulse {
        50% {
          opacity: 0.45;
        }
      }
      .subscriptions-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 260px;
        padding: 30px;
        text-align: center;
        border: 1px dashed var(--quota-line);
        border-radius: 18px;
        color: var(--quota-muted);
        font-size: 13px;
      }
      .subscriptions-empty h3 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        color: var(--quota-text);
      }
      .subscriptions-empty p {
        max-width: 360px;
        margin: 0;
        line-height: 1.7;
      }
      .subscriptions-action {
        margin-top: 5px;
        border: 0;
        border-radius: 9px;
        padding: 8px 14px;
        background: var(--quota-text);
        color: var(--quota-surface);
        cursor: pointer;
        font-size: 12px;
      }
      @media (max-width: 899px) {
        .subscriptions-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .subscriptions-page-heading {
          align-items: flex-start;
          gap: 12px;
          margin-bottom: 20px;
          flex-direction: column;
        }
        .subscriptions-page-heading h2 {
          font-size: 23px;
        }
        .subscriptions-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .quota-provider-card {
          padding: 20px 18px 14px;
        }

        gap: 16px;

        // --- Rendering Logic ---

        /**
         * Safely calls lucide.createIcons() if the library is available.
         */
        function createIcons() {
          if (typeof lucide !== "undefined") {
            lucide.createIcons();
          }
        }

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        function getErrorMessage(error) {
          if (error instanceof Error) {
            return error.message;
          }
          return typeof error === "string" ? error : "Unknown error.";
        }

        function isMissingTokenUsageEndpointError(error) {
          return Boolean(
            error &&
              typeof error === "object" &&
              "status" in error &&
              error.status === 404,
          );
        }

        const LEGACY_PERIODS = {
          day: "today",
          week: "last_7_days",
          month: "last_30_days",
        };

        function normalizePeriod(value) {
          if (VALID_PERIODS.has(value)) {
            return value;
          }
          return LEGACY_PERIODS[value] || DEFAULT_TOKEN_USAGE_PERIOD;
        }

        function getSelectedPeriod() {
          const normalized = normalizePeriod(tokenUsagePeriodSelect.value);
          tokenUsagePeriodSelect.value = normalized;
          state.tokenUsagePeriod = normalized;
          return normalized;
        }

        function parseCredential(value) {
          const credential = typeof value === "string" ? value.trim() : "";
          if (!credential) return null;

          const namedHeader = credential.match(
            /^(authorization|x-api-key)\s*:\s*(.+)$/i,
          );
          if (namedHeader) {
            return {
              name: namedHeader[1].toLowerCase(),
              value: namedHeader[2].trim(),
            };
          }

          if (/^Bearer\s+/i.test(credential)) {
            return { name: "authorization", value: credential };
          }

          if (/^x-api-key\s+/i.test(credential)) {
            return {
              name: "x-api-key",
              value: credential.replace(/^x-api-key\s+/i, "").trim(),
            };
          }

          return { name: "authorization", value: "Bearer " + credential };
        }

        function buildRequestHeaders(requestUrl = endpointUrlInput.value) {
          try {
            const configuredUrl = new URL(
              endpointUrlInput.value.trim(),
              window.location.href,
            );
            const targetUrl = new URL(requestUrl, window.location.href);
            if (
              configuredUrl.origin === window.location.origin ||
              targetUrl.origin !== configuredUrl.origin
            ) {
              return {};
            }
            const credential = parseCredential(apiKeyInput?.value || "");
            return credential ? { [credential.name]: credential.value } : {};
          } catch {
            return {};
          }
        }

        function resolveUsageUrl(endpoint) {
          const url = new URL(endpoint, window.location.href);
          if (
            (url.protocol !== "http:" && url.protocol !== "https:") ||
            url.username ||
            url.password
          ) {
            throw new Error("Endpoint URL must use HTTP(S) and must not embed credentials.");
          }
          return url.toString();
        }

        function deriveEndpointUrl(usageEndpoint, targetPath) {
          const url = new URL(usageEndpoint, window.location.href);
          const normalizedTargetPath = targetPath.replace(/^\/+/, "");
          const normalizedPath = url.pathname.replace(/\/+$/, "");
          const nextPath = normalizedPath.endsWith("/usage")
            ? normalizedPath.replace(/\/usage$/, `/${normalizedTargetPath}`)
            : `${normalizedPath || ""}/${normalizedTargetPath}`;

          url.pathname = nextPath.startsWith("/") ? nextPath : `/${nextPath}`;
          url.search = "";
          url.hash = "";
          return url.toString();
        }

        function buildTokenUsageSummaryUrl(usageEndpoint, period) {
          const url = new URL(deriveEndpointUrl(usageEndpoint, "token-usage"));
          url.searchParams.set("period", period);
          return url.toString();
        }

        function buildTokenUsageDailyUrl(usageEndpoint, period) {
          const url = new URL(
            deriveEndpointUrl(usageEndpoint, "token-usage/daily"),
          );
          url.searchParams.set("period", period);
          return url.toString();
        }

        function buildTokenUsageEventsUrl(
          usageEndpoint,
          period,
          page,
          kind = "events",
        ) {
          const url = new URL(
            deriveEndpointUrl(usageEndpoint, `token-usage/${kind}`),
          );
          url.searchParams.set("period", period);
          url.searchParams.set("page", String(page));
          url.searchParams.set(
            "page_size",
            String(
              kind === "sessions"
                ? SESSION_PAGE_SIZE
                : DEFAULT_TOKEN_USAGE_EVENTS_PAGE_SIZE,
            ),
          );
          return url.toString();
        }

        async function fetchJson(url, isCurrentRequest = () => true) {
          const connectionKey = getConnectionKey();
          const requestUrl = String(url);
          const currentOrigin =
            typeof window !== "undefined" && window.location
              ? window.location.origin || ""
              : "";
          const sameOrigin = !/^https?:\/\//i.test(requestUrl)
            ? true
            : Boolean(
                currentOrigin &&
                  (requestUrl === currentOrigin ||
                    requestUrl.startsWith(currentOrigin + "/")),
              );
          const response = await fetch(requestUrl, {
            headers: buildRequestHeaders(requestUrl),
            credentials: sameOrigin ? "same-origin" : "omit",
          });
          const isolation = response.headers.get("x-api-key-usage-isolated");
          if (
            isCurrentRequest() &&
            connectionKey === getConnectionKey() &&
            (response.ok || isolation !== null)
          ) {
            applyUsageIsolation(isolation === "true");
          }

          if (!response.ok) {
            let message = response.statusText || "Request failed";

            try {
              const contentType = response.headers.get("content-type") || "";
              if (contentType.includes("application/json")) {
                const payload = await response.json();
                const apiMessage = payload?.error?.message || payload?.message;
                if (typeof apiMessage === "string" && apiMessage.trim()) {
                  message = apiMessage.trim();
                }
              } else {
                const text = await response.text();
                if (text.trim()) {
                  message = text.trim();
                }
              }
            } catch (error) {
              console.warn(
                "Could not parse error response:",
                getErrorMessage(error),
              );
            }

            const error = new Error(
              `Request failed with status ${response.status}: ${message}`,
            );
            error.status = response.status;
            throw error;
          }

          return response.json();
        }

        function applyUsageIsolation(isolated) {
          if ((state.isolateApiKeyUsage === true) === isolated) return;
          state.isolateApiKeyUsage = isolated;
          state.tokenUsageSummary = null;
          state.tokenUsageDailySummary = null;
          state.tokenUsageEventsPage = null;
          invalidateSessionsRequest();
          state.subscriptionUsage = {};
          state.subscriptionsLoaded = false;
          if (isolated && state.activeTab === "subscriptions") {
            state.activeTab = "usage";
            syncUrlState();
            void fetchData();
          }
          if (state.activeTab === "models") void fetchData();
          render();
        }

        function syncUrlState() {
          try {
            const currentUrl = new URL(window.location.href);
            const period = getSelectedPeriod();
            if (state.activeTab === "usage")
              currentUrl.searchParams.delete("tab");
            else currentUrl.searchParams.set("tab", state.activeTab);

            currentUrl.searchParams.delete("endpoint");

            currentUrl.searchParams.set("period", period);
            window.history.pushState({}, "", currentUrl);
          } catch (error) {
            console.warn("Could not update URL:", getErrorMessage(error));
          }
        }

        function updateControls() {
          const isLoading =

              ? state.adminLoading
              : state.activeTab === "models"

            button.hidden = hidden;
            button.style.display = hidden ? "none" : "";
            const selected = button.dataset.tab === state.activeTab;
            button.setAttribute("aria-selected", String(selected));
            button.tabIndex = selected ? 0 : -1;
          }
        }

        function formatNumber(value) {
          return Number.isFinite(value) ? Number(value).toLocaleString() : "0";
        }

        function formatCacheHitRate(usage) {
          const inputTokens =
            usage.input_tokens +
            usage.cache_read_input_tokens +
            usage.cache_creation_input_tokens;
          return inputTokens > 0
            ? `${((usage.cache_read_input_tokens / inputTokens) * 100).toFixed(1)}%`
            : "—";
        }

        function getMetricDisplayText(value) {
          return typeof value === "number" ? formatNumber(value) : value;
        }

        function resolveMetricValueFontSize(displayTexts) {
          const cards = Array.isArray(displayTexts)
            ? displayTexts
            : [displayTexts];
          const longest = cards.reduce((max, cardText) => {
            const lines = Array.isArray(cardText) ? cardText : [cardText];
            const cardMax = lines.reduce((m, line) => {
              return Math.max(m, String(line ?? "").length);
            }, 0);
            return Math.max(max, cardMax);
          }, 0);
          if (longest <= 7) return "";
          if (longest <= 11) return "clamp(15px, 1.3vw, 18px)";
          if (longest <= 15) return "clamp(13px, 1.1vw, 16px)";
          return "clamp(11px, 1vw, 14px)";
        }

        function formatCurrencyAmount(currency, amount) {
          const symbols = {
            CNY: "¥",
            USD: "$",
          };
          const normalizedCurrency =
            typeof currency === "string" && currency.trim()
              ? currency.trim().toUpperCase()
              : "";
          const symbol = symbols[normalizedCurrency] || "";
          return symbol
            ? `${symbol}${Number(amount).toFixed(6)}`
            : `${normalizedCurrency} ${Number(amount).toFixed(6)}`;
        }

        function getCostAmount(cost) {
          if (Number.isFinite(cost?.amount)) {
            return Number(cost.amount);
          }
          if (Number.isFinite(cost?.total_cost_nanos)) {
            return Number(cost.total_cost_nanos) / 1_000_000_000;
          }
          return null;
        }

        function formatTokenUsageCost(cost) {
          const amount = getCostAmount(cost);
          return amount === null || !cost?.currency
            ? "—"
            : formatCurrencyAmount(cost.currency, amount);
        }

        function formatTokenUsageCosts(costs) {
          if (!Array.isArray(costs) || costs.length === 0) {
            return ["—"];
          }
          return costs.map((cost) => formatTokenUsageCost(cost));
        }

        function formatLatency(value) {
          if (typeof value !== "number" || !Number.isFinite(value) || value < 0)
            return "—";
          return value < 1000
            ? `${value.toFixed(0)} ms`
            : `${(value / 1000).toFixed(2)} s`;
        }

        function formatOutputSpeed(value) {
          return typeof value === "number" &&
            Number.isFinite(value) &&
            value >= 0
            ? `${value.toFixed(1)} tok/s`
            : "—";
        }

        function formatDateTime(value) {
          if (!Number.isFinite(value)) {
            return "N/A";
          }
          return new Date(value).toLocaleString();
        }

        function formatCellText(value) {
          if (typeof value !== "string") {
            return "—";
          }

          const trimmed = value.trim();
          return trimmed || "—";
        }

        function formatRangeDate(value) {
          const date = new Date(value);
          if (!Number.isFinite(date.getTime())) {
            return "N/A";
          }
          const options = { day: "numeric", month: "short" };
          if (date.getFullYear() !== new Date().getFullYear()) {
            options.year = "numeric";
          }
          return date.toLocaleDateString("en-US", options);
        }

        function formatRangeText(range) {
          const start = formatRangeDate(range.start_ms);
          const end = formatRangeDate(range.end_ms - 1);
          return start === end ? start : `${start} - ${end}`;
        }

        function renderTokenUsageRangeText(period, range) {
          const labels = {
            today: "Today",
            this_week: "This week",
            last_7_days: "Last 7 days",
            this_month: "This month",
            last_30_days: "Last 30 days",
            lifetime: "Lifetime",
          };
          const label = labels[period] || labels.today;

          if (!range || range.end_ms <= range.start_ms) {
            return label;
          }

          return `${label}: ${formatRangeText(range)}`;
        }

        /**
         * Renders the entire UI based on the current state.
         */
        function render(view = state.activeTab) {
          if (view !== state.activeTab) {
            return;
          }
          updateControls();

          if (state.activeTab === "admin") {
            contentArea.innerHTML = renderAdminSection();
            createIcons();
            return;
          }

          if (state.activeTab === "playground") {
            contentArea.innerHTML = renderPlaygroundSection();
            createIcons();
            return;
          }

          if (state.activeTab === "models") {
            contentArea.innerHTML = renderModelsSection();
            createIcons();
            return;
          }

          if (state.activeTab === "subscriptions") {
            contentArea.innerHTML = renderSubscriptionUsageSection();
            createIcons();
            return;
          }

          if (state.isLoading) {
            contentArea.innerHTML = renderSpinner();
            createIcons();
            return;
          }

          const hasContent = Boolean(
            state.isTokenUsageLoading ||
              state.isEventsLoading ||
              state.tokenUsageSummary ||
              state.tokenUsageDailySummary ||
              state.tokenUsageEventsPage ||
              state.tokenUsageSummaryError ||
              state.tokenUsageDailyError ||
              state.tokenUsageEventsError,
          );
          contentArea.innerHTML = hasContent
            ? renderTokenUsageSection()
            : renderWelcomeMessage();

          // Replace placeholder icons with actual Lucide icons
          createIcons();
        }

        // --- Collapsible Sections ---
        const COLLAPSED_SECTIONS_STORAGE_KEY =
          "copilot-api:usage-viewer:collapsed";
        const COLLAPSIBLE_SECTION_KEYS = new Set([
          "tokenUsage",
          "modelBreakdown",
          "sessionBreakdown",
          "requestEvents",
        ]);

        function readCollapsedSections() {
          try {
            const raw = window.localStorage.getItem(
              COLLAPSED_SECTIONS_STORAGE_KEY,
            );
            const parsed = raw ? JSON.parse(raw) : null;
            const collapsed = {};
            if (
              parsed &&
              typeof parsed === "object" &&
              !Array.isArray(parsed)
            ) {
              for (const key of COLLAPSIBLE_SECTION_KEYS) {
                if (parsed[key] === true) {
                  collapsed[key] = true;
                }
              }
            }
            return collapsed;
          } catch (error) {
            console.warn(
              "Could not read collapsed sections:",
              getErrorMessage(error),
            );
            return {};
          }
        }

        function writeCollapsedSections() {
          try {
            window.localStorage.setItem(
              COLLAPSED_SECTIONS_STORAGE_KEY,
              JSON.stringify(state.collapsedSections),
            );
          } catch (error) {
            console.warn(
              "Could not store collapsed sections:",
              getErrorMessage(error),
            );
          }
        }

        function isSectionCollapsed(key) {
          return state.collapsedSections[key] === true;
        }

        function getCollapseBodyId(key) {
          return `collapse-body-${key}`;
        }

        /**
         * Renders the toggle button (chevron + label) shown in a section header.
         * @param {string} key - A COLLAPSIBLE_SECTION_KEYS entry.
         * @param {string} labelHtml - Trusted HTML for the toggle label.
         */
        function renderCollapseToggle(key, labelHtml) {
          return `<button type="button" class="collapse-toggle" data-collapse-toggle="${key}" aria-expanded="${!isSectionCollapsed(key)}" aria-controls="${getCollapseBodyId(key)}"><i data-lucide="chevron-down" class="collapse-chevron"></i>${labelHtml}</button>`;
        }

        /**
         * Opens a section body wrapper that is hidden while the section is
         * collapsed. Pair with renderCollapseBodyEnd() for multi-part bodies.
         * @param {string} key - A COLLAPSIBLE_SECTION_KEYS entry.
         * @param {string} className - Optional extra classes for the wrapper.
         */
        function renderCollapseBodyStart(key, className = "") {
          return `<div id="${getCollapseBodyId(key)}" class="collapse-body ${className}" ${isSectionCollapsed(key) ? "hidden" : ""}>`;
        }

        function renderCollapseBodyEnd() {
          return "</div>";
        }

        function renderCollapseBody(key, bodyHtml, className = "") {
          return `${renderCollapseBodyStart(key, className)}${bodyHtml}${renderCollapseBodyEnd()}`;
        }

        function toggleCollapsedSection(button) {
          const key = button.dataset.collapseToggle;
          if (!COLLAPSIBLE_SECTION_KEYS.has(key)) {
            return;
          }
          const collapsed = !isSectionCollapsed(key);
          if (collapsed) {
            state.collapsedSections[key] = true;
          } else {
            delete state.collapsedSections[key];
          }
          const body = document.getElementById(getCollapseBodyId(key));
          if (body) {
            body.hidden = collapsed;
          }
          button.setAttribute("aria-expanded", String(!collapsed));
          writeCollapsedSections();
        }

        function getModelField(model, fields) {
          for (const field of fields) {
            if (typeof model?.[field] === "string" && model[field].trim()) {
              return model[field];
            }
          }
          return "";
        }

        function getFilteredModels() {
          const query = state.modelsSearch.trim().toLowerCase();
          return (state.models || []).filter((model) =>
            [
              getModelField(model, ["id"]),
              getModelField(model, ["display_name", "name"]),
              getModelField(model, ["owned_by", "vendor"]),
            ].some((value) => value.toLowerCase().includes(query)),
          );
        }

        function getModelsCountText() {
          const total = state.models?.length || 0;
          return state.modelsSearch.trim()
            ? `${getFilteredModels().length} of ${total} models`
            : `${total} models`;
        }

        function renderPlaygroundMessages() {
          if (!state.playgroundMessages.length) {
            return '<div class="playground-empty">Choose a model, select an API protocol and send a prompt.<br />Responses are routed through this Copi gateway.</div>';
          }
          return (
            state.playgroundMessages
              .map(
                (message) => `
            <article class="playground-message ${message.role === "user" ? "user" : "assistant"}">
              <span class="playground-message-label">${message.role === "user" ? "You" : "Model"}</span>
              ${escapeHtml(message.content)}
            </article>
          `,
              )
              .join("") +
            (state.playgroundBusy
              ? '<article class="playground-message assistant"><span class="playground-message-label">Gateway</span>Waiting for model response…</article>'
              : "")
          );
        }

        function renderPlaygroundSection() {
          const models = state.models || [];
          const selectedModel = state.playgroundModel || models[0]?.id || "";
          const options = models
            .map((model) => {

          const modelState = state.isModelsLoading
            ? "Discovering gateway models…"
            : state.modelsError
              ? "Model catalog unavailable"
              : `${models.length} models discovered from /v1/models`;
          return `
            <div class="playground-layout">
              <section class="playground-chat" aria-label="Model playground">
                <header class="playground-heading">
                  <div><h2>Model Playground</h2><p class="panel-meta">${escapeHtml(modelState)}</p></div>
                  <button type="button" class="secondary-action" data-playground-clear ${state.playgroundBusy || !state.playgroundMessages.length ? "disabled" : ""}>Clear chat</button>
                </header>
                ${state.modelsError ? `<p class="playground-error" role="alert">${escapeHtml(state.modelsError)}</p>` : ""}
                <div class="playground-controls" style="padding:14px 14px 0">
                  <label class="field-label" for="playground-model">Model</label>

                    ${options || '<option value="">No models available</option>'}
                  </select>
                  <label class="field-label" for="playground-protocol">API</label>
                  <select id="playground-protocol" class="playground-field playground-protocol-select" data-playground-protocol ${state.playgroundBusy ? "disabled" : ""}>
                    <option value="chat" ${state.playgroundProtocol === "chat" ? "selected" : ""}>OpenAI Chat</option>
                    <option value="responses" ${state.playgroundProtocol === "responses" ? "selected" : ""}>OpenAI Responses</option>
                    <option value="anthropic" ${state.playgroundProtocol === "anthropic" ? "selected" : ""}>Anthropic Messages</option>
                  </select>
                </div>
                <div id="playground-messages" class="playground-messages" aria-live="polite">${renderPlaygroundMessages()}</div>
                <form class="playground-composer" data-playground-form>
                  <label class="field-label" for="playground-prompt">Prompt</label>
                  <textarea id="playground-prompt" class="playground-prompt" data-playground-prompt placeholder="Send a prompt to the selected model…" ${state.playgroundBusy || !models.length ? "disabled" : ""}>${escapeHtml(state.playgroundDraft)}</textarea>
                  <div class="playground-controls">
                    <span class="panel-meta">Same-origin session · no browser API key</span>
                    <button type="submit" class="primary-action" ${state.playgroundBusy || !models.length ? "disabled" : ""}><i data-lucide="send" class="h-4 w-4" aria-hidden="true"></i> Send prompt</button>
                  </div>
                </form>
                ${state.playgroundError ? `<p class="playground-error" role="alert">${escapeHtml(state.playgroundError)}</p>` : ""}
              </section>
              <aside class="playground-sidebar" aria-label="Gateway compatibility">
                <h3>Gateway interfaces</h3>
                <div class="playground-compat">
                  <div class="playground-compat-item"><span class="playground-dot"></span><div><strong>OpenAI Chat Completions</strong><code>POST /v1/chat/completions</code></div></div>
                  <div class="playground-compat-item"><span class="playground-dot"></span><div><strong>OpenAI Responses</strong><code>POST /v1/responses</code></div></div>
                  <div class="playground-compat-item"><span class="playground-dot"></span><div><strong>Anthropic Messages</strong><code>POST /v1/messages</code></div></div>
                  <div class="playground-compat-item"><span class="playground-dot"></span><div><strong>Claude Code discovery</strong><code>GET /v1/models · Claude user-agent</code></div></div>
                  <div class="playground-compat-item"><span class="playground-dot"></span><div><strong>OpenCode discovery</strong><code>GET /v1/models · OpenCode user-agent</code></div></div>
                </div>
                <hr class="cyber-divider" />
                <h3>Active catalog</h3>
                <p class="panel-meta">The selector uses the gateway's live model catalog. Provider health checks and per-model enable/disable settings are applied server-side.</p>
                <p class="panel-meta" style="margin-top:10px">Models visible here are also exposed to OpenCode and Claude Code through their client-specific discovery responses.</p>
                <button type="button" class="btn btn-primary" data-playground-refresh style="margin-top:14px">Refresh model catalog</button>
              </aside>
            </div>
          `;
        }

        async function extractPlaygroundResponse(response, protocol) {
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            const message =
              payload?.error?.message ||
              payload?.message ||
              `HTTP ${response.status}`;
            throw new Error(`Gateway request failed: ${message}`);
          }
          if (protocol === "chat") {
            const content = payload?.choices?.[0]?.message?.content;
            if (typeof content === "string") return content;
            if (Array.isArray(content))
              return content.map((part) => part?.text || "").join("\n");
          }
          if (protocol === "anthropic") {
            const content = payload?.content;
            if (Array.isArray(content))
              return content
                .filter((part) => part?.type === "text")
                .map((part) => part.text || "")
                .join("\n");
          }
          if (protocol === "responses") {
            if (typeof payload?.output_text === "string")
              return payload.output_text;
            if (Array.isArray(payload?.output))
              return payload.output
                .flatMap((item) =>
                  Array.isArray(item?.content)
                    ? item.content
                        .filter(
                          (part) =>
                            part?.type === "output_text" ||
                            part?.type === "text",
                        )
                        .map((part) => part.text || [])
                    : [],
                )
                .join("\n");
          }
          throw new Error(
            "The selected API returned no readable text response.",
          );
        }

        async function sendPlaygroundMessage(event) {
          if (!event.target.matches("[data-playground-form]")) return;
          event.preventDefault();
          const prompt = state.playgroundDraft.trim();
          const model = state.playgroundModel || state.models?.[0]?.id || "";
          const protocol = state.playgroundProtocol;
          if (!prompt || !model || state.playgroundBusy) return;
          state.playgroundMessages.push({ role: "user", content: prompt });
          state.playgroundDraft = "";
          state.playgroundError = "";
          state.playgroundBusy = true;
          render("playground");
          const messages = state.playgroundMessages.map(
            ({ role, content }) => ({ role, content }),
          );
          const paths = {
            chat: "/v1/chat/completions",
            responses: "/v1/responses",
            anthropic: "/v1/messages",
          };
          const body =
            protocol === "chat"
              ? { model, messages, stream: false }
              : protocol === "responses"
                ? { model, input: messages, stream: false }
                : { model, max_tokens: 4096, messages, stream: false };
          try {
            const headers = { "content-type": "application/json" };
            if (protocol === "anthropic")
              headers["anthropic-version"] = "2023-06-01";
            const response = await fetch(paths[protocol], {
              method: "POST",
              headers,
              credentials: "same-origin",
              body: JSON.stringify(body),
            });
            const content = await extractPlaygroundResponse(response, protocol);
            state.playgroundMessages.push({ role: "assistant", content });
          } catch (error) {
            state.playgroundError = getErrorMessage(error);
          } finally {
            state.playgroundBusy = false;
            render("playground");
            const transcript = document.getElementById("playground-messages");
            if (transcript) transcript.scrollTop = transcript.scrollHeight;
          }
        }

        function renderModelsSection() {
          return `
            <section class="panel" aria-label="Available models">
              <div class="panel-header models-toolbar">
                <div>
                  <h2 class="panel-title">Models</h2>
                  <p id="models-count" class="panel-meta">${getModelsCountText()}</p>
                </div>
                <input
                  type="search"
                  class="input-control input-focus models-search"
                  data-model-search
                  aria-label="Search models by ID, name or vendor"
                  placeholder="Search by ID, name or vendor"
                  value="${escapeHtml(state.modelsSearch)}"
                  ${state.isModelsLoading || !state.models ? "disabled" : ""}
                />
              </div>
              <div id="models-results">${renderModelsResults()}</div>
              <p id="models-feedback" class="px-4 text-xs" role="status" aria-live="polite"></p>
            </section>
          `;
        }

        function renderModelsResults() {
          if (state.isModelsLoading) {
            return renderSpinner();
          }
          if (state.modelsError) {
            return `<div class="p-4">${renderError(state.modelsError, "Could not load models")}</div>`;
          }
          if (!state.models) {
            return renderEmptyState(
              "Refresh to load models for this endpoint.",
            );
          }
          if (state.models.length === 0) {
            return renderEmptyState("This endpoint returned no models.");
          }
          const models = getFilteredModels();
          if (models.length === 0) {
            return renderEmptyState("No models match your search.");
          }
          return `
            <div class="models-table-scroll">
              <table class="models-table" aria-label="Model list">
                <thead>
                  <tr>
                    <th scope="col" style="width: 40%;">Model ID</th>
                    <th scope="col" style="width: 28%;">Name</th>
                    <th scope="col" style="width: 18%;">Vendor</th>
                    <th scope="col" style="width: 14%;">Details</th>
                  </tr>
                </thead>
                <tbody>
                  ${models
                    .map((model, index) => {
                      const id = getModelField(model, ["id"]);
                      const name = getModelField(model, [
                        "display_name",
                        "name",
                      ]);
                      const vendor = getModelField(model, [
                        "owned_by",
                        "vendor",
                      ]);
                      return `
                      <tr>
                        <td>
                          <div class="models-id">
                            <code>${escapeHtml(id || "—")}</code>
                            ${id ? `<button type="button" class="models-action" data-model-copy="${escapeHtml(id)}" aria-label="Copy model ID ${escapeHtml(id)}"><i data-lucide="copy" class="h-3 w-3" aria-hidden="true"></i>Copy</button>` : ""}
                          </div>
                        </td>
                        <td>${escapeHtml(name || "—")}</td>
                        <td>${escapeHtml(vendor || "—")}</td>
                        <td><button type="button" class="models-action" data-model-details="model-details-${index}" aria-controls="model-details-${index}" aria-expanded="false">View JSON</button></td>
                      </tr>
                      <tr id="model-details-${index}" hidden>
                        <td colspan="4" class="models-json-cell"><pre class="models-json">${escapeHtml(JSON.stringify(model, null, 2))}</pre></td>
                      </tr>
                    `;
                    })
                    .join("")}
                </tbody>
              </table>
            </div>
          `;
        }

        function getConnectionKey() {
          const endpoint = endpointUrlInput.value.trim();
          let normalizedEndpoint = endpoint;
          try {
            normalizedEndpoint = new URL(
              endpoint,
              window.location.href,
            ).toString();
          } catch {
            // Invalid endpoint text still forms a distinct connection state.
          }

          // Keep only a compact derived marker for request invalidation.
          // The credential itself stays in the password input and is never
          // persisted or included in the URL.
          const value = apiKeyInput?.value?.trim() || "";
          let hash = 2166136261;
          for (let index = 0; index < value.length; index += 1) {
            hash ^= value.charCodeAt(index);
            hash = Math.imul(hash, 16777619);
          }
          const credentialFingerprint = value
            ? (hash >>> 0).toString(36)
            : "";
          return normalizedEndpoint + "|" + credentialFingerprint;
        }

        function syncModelsConnection() {
          const key = getConnectionKey();
          if (state.modelsConnectionKey !== key) {
            state.modelsConnectionKey = key;
            state.modelsRequestId += 1;
            state.models = null;
            state.modelsError = null;
            state.isModelsLoading = false;
          }
        }

        function syncSubscriptionsConnection() {
          const key = getConnectionKey();
          if (state.subscriptionsConnectionKey !== key) {
            state.subscriptionsConnectionKey = key;
            state.subscriptionRequestId += 1;
            state.subscriptionUsage = {};
            state.subscriptionUsageErrors = {};
            state.subscriptionLoadingProviders = {};
            state.subscriptionsLoaded = false;
            state.isSubscriptionsLoading = false;
            state.subscriptionPageError = null;
          }
        }

        function handleConnectionChange() {
          syncTokenUsageConnection();
          syncModelsConnection();
          syncSubscriptionsConnection();
          render();
        }

        async function fetchModels() {
          syncEndpointCredential();
          syncModelsConnection();
          const connectionKey = state.modelsConnectionKey;
          const requestId = ++state.modelsRequestId;
          const isCurrentRequest = () =>
            requestId === state.modelsRequestId &&
            connectionKey === getConnectionKey();
          state.models = null;
          state.modelsError = null;
          state.isModelsLoading = true;
          render(state.activeTab);
          try {
            const endpoint = endpointUrlInput.value.trim();
            if (!endpoint) {
              throw new Error("Gateway connection is unavailable.");
            }
            const payload = await fetchJson(
              deriveEndpointUrl(
                new URL(endpoint, window.location.href).toString(),
                "models",
              ),
              isCurrentRequest,
            );
            if (!Array.isArray(payload?.data)) {
              throw new Error("Model response must contain a data array.");
            }
            if (isCurrentRequest()) {
              state.models = payload.data;
              if (
                !state.playgroundModel ||
                !payload.data.some(
                  (model) => model.id === state.playgroundModel,
                )
              ) {
                state.playgroundModel = payload.data[0]?.id || "";
              }
            }
          } catch (error) {
            if (isCurrentRequest()) {
              state.modelsError = getErrorMessage(error);
            }
          } finally {
            if (isCurrentRequest()) {
              state.isModelsLoading = false;
              render(state.activeTab);
            }
          }
        }

        function activateTab(tab) {
          if (
            ![
              "usage",
              "subscriptions",
              "playground",
              "models",
              "admin",
            ].includes(tab)
          ) {
            return;
          }
          if (tab === "subscriptions" && state.isolateApiKeyUsage) return;
          syncEndpointCredential();
          syncTokenUsageConnection();
          syncModelsConnection();
          syncSubscriptionsConnection();
          state.activeTab = tab;
          syncUrlState();
          render();
          if (tab === "subscriptions") {
            if (typeof loadProviderAuthStatus === "function")
              void loadProviderAuthStatus();
            void refreshSubscriptionQuotas();
          }
          if (tab === "admin") {
            render("admin");
            if (
              state.adminConnected &&
              !state.adminProviders &&
              !state.adminLoading
            ) {
              void loadAdminProviders();
            }
          }
          if (
            ["models", "playground"].includes(tab) &&
            !state.models &&
            !state.isModelsLoading
          ) {
            void fetchModels();
          }
          if (
            tab === "subscriptions" &&
            !state.subscriptionsLoaded &&
            !state.isSubscriptionsLoading
          ) {
            void refreshSubscriptionQuotas();
          }
        }

        function handleTabsKeydown(event) {
          const keys = ["ArrowLeft", "ArrowRight", "Home", "End"];
          if (!keys.includes(event.key)) {
            return;
          }
          event.preventDefault();
          const visibleTabs = tabButtons.filter((button) => !button.hidden);
          const index = visibleTabs.findIndex(
            (button) => button.dataset.tab === state.activeTab,
          );
          const nextIndex =
            event.key === "Home"
              ? 0
              : event.key === "End"
                ? visibleTabs.length - 1
                : (index +
                    (event.key === "ArrowRight" ? 1 : -1) +
                    visibleTabs.length) %
                  visibleTabs.length;
          activateTab(visibleTabs[nextIndex].dataset.tab);
          visibleTabs[nextIndex].focus();
        }

        function handleModelsSearch(event) {
          if (!event.target.matches("[data-model-search]")) {
            return;
          }
          state.modelsSearch = event.target.value;
          document.getElementById("models-results").innerHTML =
            renderModelsResults();
          document.getElementById("models-count").textContent =
            getModelsCountText();
          document.getElementById("models-feedback").textContent = "";
          createIcons();
        }

        async function copyModelId(id) {
          const feedback = document.getElementById("models-feedback");
          try {
            await navigator.clipboard.writeText(id);
            feedback.textContent = "Model ID copied.";
          } catch {
            feedback.textContent =
              "Could not copy. Select the model ID and copy it manually.";
          }
          feedback.classList.add("py-3");
        }

        // Subscription quotas use the same normalized server response as desktop.
        function subscriptionQuotaLabel(window) {
          let label = "Included allowance";
          if (window.id.startsWith("copilot:")) return window.name || "Premium";
          if (window.kind === "spend") return "Monthly credit limit";
          if (window.kind === "on-demand") return "Pay as you go · Monthly";
          const seconds = window.windowSeconds;
          if (window.period === "weekly" || seconds === 604800)
            label = "Weekly limit";
          else if (window.period === "monthly") label = "Monthly limit";
          else if (Number.isFinite(seconds) && seconds >= 86400)
            label = `${seconds / 86400}-day limit`;
          else if (Number.isFinite(seconds) && seconds >= 3600)
            label = `${seconds / 3600}-hour limit`;
          else if (Number.isFinite(seconds) && seconds > 0)
            label = `${seconds / 60}-minute limit`;
          return window.name ? `${window.name} · ${label}` : label;
        }

        function formatSubscriptionAmount(value, unit) {
          if (!Number.isFinite(value)) return "—";
          return unit === "USD"
            ? value.toLocaleString(undefined, {
                style: "currency",
                currency: "USD",
              })
            : value.toLocaleString(undefined, { maximumFractionDigits: 2 });
        }

        function renderSubscriptionQuotaWindow(window) {
          const percent = window.usedPercent;
          const hasPercent = Number.isFinite(percent) && !window.unlimited;
          const width = hasPercent ? Math.min(100, Math.max(0, percent)) : 0;
          const label = escapeHtml(subscriptionQuotaLabel(window));
          const reset = Number.isFinite(window.resetAt)
            ? new Date(window.resetAt * 1000)
            : null;
          const resetDate =
            window.resetDate ||
            (reset && Number.isFinite(reset.getTime())
              ? reset.toLocaleString()
              : null);
          return `
            <div class="quota-window" data-warning="${Boolean(window.limitReached || percent >= 90)}">
              <div class="quota-window-heading"><span>${label}</span><span>${window.unlimited ? "Unlimited" : hasPercent ? `${Math.round(percent * 10) / 10}% used` : "—"}</span></div>
              ${hasPercent ? `<div role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${width}" class="quota-progress"><div class="quota-progress-fill" style="width: ${width}%;"></div></div>` : ""}
              ${!window.unlimited && (window.used !== undefined || window.limit !== undefined) ? `<p class="quota-window-note">${formatSubscriptionAmount(window.used, window.unit)} / ${formatSubscriptionAmount(window.limit, window.unit)}${window.unit === "credits" ? " Credits" : window.unit === "requests" ? " requests" : ""}</p>` : ""}
              ${resetDate ? `<p class="quota-window-note">Resets ${escapeHtml(resetDate)}</p>` : ""}
            </div>
          `;
        }

        function renderSubscriptionSummary(usage) {
          const main =
            usage.windows.find((window) => window.kind === "usage") ||
            usage.windows[0];
          const credits = usage.credits;
          const showCredits =
            credits &&
            (credits.unlimited ||
              (credits.hasCredits && credits.balance !== undefined) ||
              !main);
          const value = showCredits
            ? credits.unlimited
              ? "∞"
              : formatSubscriptionAmount(credits.balance, credits.unit)
            : main?.unlimited
              ? "∞"
              : Number.isFinite(main?.usedPercent)
                ? `${formatSubscriptionAmount(Math.max(0, Math.min(100, 100 - main.usedPercent)))}%`
                : "—";
          const label = showCredits
            ? credits.unit === "USD"
              ? "Prepaid balance"
              : "Credits"
            : "Remaining allowance";
          return `<div class="quota-summary"><p class="quota-summary-label">${label}</p><div class="quota-summary-value">${value}</div><p class="quota-summary-context">${showCredits ? (credits.unlimited ? "Unlimited" : "Available balance") : main ? escapeHtml(subscriptionQuotaLabel(main)) : "Included allowance"}</p></div>`;
        }

                return `<article class="provider-connect-card"><div class="provider-connect-heading"><div><h3>${name}</h3><p>${description}</p></div><span class="provider-connect-status" data-state="${connected ? "ready" : active ? "pending" : "idle"}">${label}</span></div>${button}${details}</article>`;

        async function loadProviderAuthStatus() {
          try {
            const response = await fetch("/auth/providers/status", {
              credentials: "same-origin",
              cache: "no-store",
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok)
              throw new Error(payload.error || `HTTP ${response.status}`);
            state.providerAuthStatus = payload;
            render("subscriptions");
          } catch (error) {
            state.providerAuthError = getErrorMessage(error);
            render("subscriptions");
          }
        }

        async function pollProviderAuthOperation(operationId) {
          for (let attempt = 0; attempt < 150; attempt += 1) {
            await new Promise((resolve) => setTimeout(resolve, 2000));
            if (state.providerAuthOperation?.id !== operationId) return;
            try {
              const response = await fetch(
                `/auth/providers/operations/${encodeURIComponent(operationId)}`,
                { credentials: "same-origin", cache: "no-store" },
              );
              const payload = await response.json().catch(() => ({}));
              if (!response.ok)
                throw new Error(payload.error || `HTTP ${response.status}`);
              state.providerAuthOperation = payload;
              render("subscriptions");
              if (payload.status !== "authorizing") {
                state.providerAuthBusy = false;
                await loadProviderAuthStatus();
                if (payload.status === "connected")
                  await refreshSubscriptionQuotas();
                return;
              }
            } catch (error) {
              state.providerAuthError = getErrorMessage(error);
              state.providerAuthBusy = false;
              render("subscriptions");
              return;
            }
          }
          state.providerAuthBusy = false;
          state.providerAuthError =
            "Der Anmeldevorgang hat das Zeitlimit erreicht.";
          render("subscriptions");
        }

        async function startProviderAuth(provider) {
          state.providerAuthBusy = true;
          state.providerAuthError = "";
          state.providerAuthOperation = null;
          render("subscriptions");
          try {
            const response = await fetch(
              `/auth/providers/${encodeURIComponent(provider)}/start`,
              { method: "POST", credentials: "same-origin" },
            );
            const payload = await response.json().catch(() => ({}));
            if (!response.ok && response.status !== 202)
              throw new Error(
                payload.error ||
                  payload.error?.message ||
                  `HTTP ${response.status}`,
              );
            state.providerAuthOperation = payload;
            render("subscriptions");
            if (payload.status === "authorizing")
              void pollProviderAuthOperation(payload.id);
            else {
              state.providerAuthBusy = false;
              await loadProviderAuthStatus();
            }
          } catch (error) {
            state.providerAuthBusy = false;
            state.providerAuthError = getErrorMessage(error);
            render("subscriptions");
          }
        }

        async function submitCodexOAuthCallback(event) {
          event.preventDefault();
          const form = event.target.closest("form");
          const input = String(new FormData(form).get("input") || "").trim();
          const operationId = state.providerAuthOperation?.id;
          if (!input || !operationId) return;
          try {
            const response = await fetch(
              `/auth/providers/operations/${encodeURIComponent(operationId)}/callback`,
              {
                method: "POST",
                credentials: "same-origin",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ input }),
              },
            );
            const payload = await response.json().catch(() => ({}));
            if (!response.ok)
              throw new Error(payload.error || `HTTP ${response.status}`);
            state.providerAuthError =
              "Authorization code accepted. Waiting for token exchange…";
            render("subscriptions");
          } catch (error) {
            state.providerAuthError = getErrorMessage(error);
            render("subscriptions");
          }
        }

        function renderSubscriptionUsageSection() {

              const loading = state.subscriptionLoadingProviders?.[provider];
              const credits = usage?.credits;
              let balance = "—";
              if (credits?.unlimited) balance = "Unlimited";
              else if (Number.isFinite(credits?.balance))
                balance = formatSubscriptionAmount(
                  credits.balance,
                  credits.unit,
                );
              else if (credits?.hasCredits) balance = "Available";
              let limitMessage = "Usage limit reached";

                usage?.limitReason === "workspace_owner_credits_depleted" ||
