        /**
         * Renders a welcome message when the page first loads.
         * @returns {string} HTML string for the welcome message.
         */
        function renderWelcomeMessage() {
          return `
            <div class="panel text-center py-16 px-4">
                <i data-lucide="info" class="mx-auto h-10 w-10" style="color: var(--color-blue);"></i>
                <h3 class="mt-3 text-lg font-bold" style="color: var(--color-fg-lightest);">Usage data is ready to load</h3>
                <p class="mt-2 text-sm" style="color: var(--color-gray);">Refresh the configured endpoint to view token totals, trends, and request events. Open Subscriptions for account allowances.</p>
            </div>
          `;
        }


        // --- Subscription sign-in: Codex (OAuth, up to 10 accounts) and Anthropic ---
        const ANTHROPIC_PROVIDER = { name: "anthropic", type: "anthropic", baseUrl: "https://api.anthropic.com" };

        function canManageSubscriptions() {
          if (state.session) return state.session.role === "admin";
          return Boolean((state.admin.adminKey || readStoredAdminKey(endpointUrlInput.value.trim())).trim());
        }

        async function loadSubscriptionAuth() {
          const sub = state.subAuth;
          if (sub.loading) return;
          if (!state.admin.adminKey) state.admin.adminKey = readStoredAdminKey(endpointUrlInput.value.trim());
          sub.loading = true;
          try {
            const [accountsPayload, providersPayload, claudeStatus, githubPayload, xaiPayload] = await Promise.all([
              adminFetch("codex/accounts"),
              adminFetch("providers"),
              adminFetch("auth/claude/status").catch((error) => ({
                available: false,
                loggedIn: false,
                error: getErrorMessage(error),
              })),
              adminFetch("github/accounts").catch((error) => ({ error: getErrorMessage(error) })),
              adminFetch("xai/accounts").catch(() => ({ accounts: [] })),
            ]);
            sub.codexAccounts = Array.isArray(accountsPayload.accounts) ? accountsPayload.accounts : [];
            sub.githubAccounts = Array.isArray(githubPayload.accounts) ? githubPayload.accounts : [];
            sub.githubMax = Number(githubPayload.maxAccounts) || 10;
            sub.githubTokenOverride = Boolean(githubPayload.tokenOverride);
            sub.githubOutsideToken = Boolean(githubPayload.outsideToken);
            sub.githubError = githubPayload.error || null;
            sub.githubCopilot = githubPayload.copilot || null;
            sub.xaiAccounts = Array.isArray(xaiPayload.accounts) ? xaiPayload.accounts : [];
            const providers = Array.isArray(providersPayload.providers) ? providersPayload.providers : [];
            const chatgpt = providers.find((provider) => provider.name === "chatgpt");
            const anthropic = providers.find((provider) => provider.name === ANTHROPIC_PROVIDER.name);
            sub.chatgptConfigured = Boolean(chatgpt?.enabled);
            sub.anthropicConfigured = Boolean(anthropic?.hasApiKey && anthropic.enabled);
            sub.claude = claudeStatus;
            sub.loaded = true;
            sub.error = null;
          } catch (error) {
            sub.error = getErrorMessage(error);
          } finally {
            sub.loading = false;
            render("subscriptions");
          }
        }

        async function subscriptionAction(run, successMessage) {
          const sub = state.subAuth;
          sub.busy = true;
          sub.error = null;
          sub.notice = null;
          render("subscriptions");
          try {
            await run();
            sub.notice = successMessage;
          } catch (error) {
            sub.error = getErrorMessage(error);
          } finally {
            sub.busy = false;
          }
          await loadSubscriptionAuth();
        }

        function renderSubscriptionSignIn() {
          if (!canManageSubscriptions()) return "";
          const sub = state.subAuth;
          const disabled = sub.busy ? "disabled" : "";
          const notes = [
            sub.error ? `<div class="admin-note error" role="alert">${escapeHtml(sub.error)}</div>` : "",
            sub.notice ? `<div class="admin-note ok" role="status">${escapeHtml(sub.notice)}</div>` : "",
          ].join("");

          const accounts = sub.codexAccounts
            .map((account, index) => {
              const displayName = account.alias || `ChatGPT account ${index + 1}`;
              const accountId = escapeHtml(account.accountId);
              const caps = account.capabilities;
              const badges = [];
              if (caps?.solAvailable) badges.push('<span class="sub-auth-badge" style="background:var(--color-aqua);color:white">Sol</span>');
              if (caps?.extraHighAvailable) badges.push('<span class="sub-auth-badge" style="background:var(--color-purple);color:white">Extra High</span>');
              if (caps?.proAvailable) badges.push('<span class="sub-auth-badge" style="background:var(--color-orange);color:white">Pro</span>');
              if (caps?.zeroRiskProEnabled) badges.push('<span class="sub-auth-badge" style="background:var(--color-blue);color:white">Zero Risk Pro</span>');
              if (caps?.browserInteractionMode === "manual") badges.push('<span class="sub-auth-badge" style="background:var(--color-gray);color:white">Zero Risk</span>');
              const capsHtml = badges.length ? `<div class="sub-auth-caps" style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${badges.join("")}</div>` : "";
              return `
              <div class="sub-auth-account">
                <span><strong>${escapeHtml(displayName)}</strong> <code>${escapeHtml(account.accountId.slice(0, 12))}…</code>${capsHtml}</span>
                <span>
                  ${account.active ? '<span class="sub-auth-badge">✓ in use</span>' : `<button type="button" class="admin-btn secondary" data-codex-use="${accountId}" ${disabled}>Use</button>`}
                  <button type="button" class="admin-btn secondary" data-codex-edit="${accountId}" ${disabled}>Edit</button>
                  ${account.active ? "" : `<button type="button" class="admin-btn danger" data-codex-remove="${accountId}" ${disabled}>Remove</button>`}
                </span>
              </div>`;
            })
            .join("");
          const full = sub.codexAccounts.length >= 10;
          const login = sub.codexLogin;
          const device = sub.codexDevice;
          const codexFlow = device
            ? `
              <ol>
                <li>Open <a class="sub-auth-link" href="${escapeHtml(device.verificationUrl)}" target="_blank" rel="noopener noreferrer">auth.openai.com/codex/device ↗</a> and sign in with ChatGPT.</li>
                <li>Enter this code:</li>
              </ol>
              <div class="device-code" aria-label="Device code">${escapeHtml(device.userCode)}</div>
              <div class="admin-actions">
                <button type="button" class="admin-btn secondary" id="codex-copy-code">Copy code</button>
                <button type="button" class="admin-btn secondary" id="codex-device-cancel" ${disabled}>Cancel</button>
              </div>
              <p class="admin-hint" role="status">Waiting for confirmation… this page updates by itself. The code is valid until ${escapeHtml(new Date(device.expiresAt).toLocaleTimeString())}.</p>`
            : login
            ? `
              <ol>
                <li>Open the OpenAI sign-in: <a class="sub-auth-link" href="${escapeHtml(login.authUrl)}" target="_blank" rel="noopener noreferrer">Sign in with ChatGPT ↗</a></li>
                <li>After signing in, the browser shows an error page at <code>localhost:1455</code>. That is expected.</li>
                <li>Copy the <b>whole address</b> from the address bar and paste it here:</li>
              </ol>
              <div class="admin-field">
                <label for="codex-paste">Address from the browser</label>
                <textarea id="codex-paste" rows="3" placeholder="http://localhost:1455/auth/callback?code=…&state=…" spellcheck="false"></textarea>
              </div>
              <div class="admin-actions">
                <button type="button" class="admin-btn" id="codex-finish" ${disabled}>Finish sign-in</button>
                <button type="button" class="admin-btn secondary" id="codex-cancel" ${disabled}>Cancel</button>
              </div>`
            : full
              ? '<p class="admin-hint">Maximum of 10 Codex accounts reached. Remove one to add another.</p>'
              : `
              <div class="admin-field">
                <label for="codex-alias">Name for the new account (optional)</label>
                <input id="codex-alias" type="text" placeholder="work" autocomplete="off" />
              </div>
              <div class="admin-actions">
                <button type="button" class="admin-btn" id="codex-device-start" ${disabled}>Add Codex account</button>
                <button type="button" class="admin-btn secondary" id="codex-start" ${disabled}>Other way: paste address</button>
              </div>
              <p class="admin-hint">If OpenAI says device sign-in is off: ChatGPT → Settings → Security → turn on "device code authorization for Codex".</p>`;

          // GitHub Copilot: several GitHub accounts, one in use at a time. The
          // device code is confirmed at github.com by whichever account is
          // signed in to the browser there.
          const githubAccounts = sub.githubAccounts;
          const githubFull = githubAccounts.length >= sub.githubMax;
          const githubRows = githubAccounts
            .map((account) => {
              const accountId = escapeHtml(account.accountId);
              const title = account.alias || account.login;
              const canRemove = !account.active || githubAccounts.length === 1;
              return `
              <div class="sub-auth-account">
                <span><strong>${escapeHtml(title)}</strong>${account.alias ? ` <span class="gh-login">@${escapeHtml(account.login)}</span>` : ""}</span>
                <span class="admin-actions" style="margin-top:0">
                  ${account.active ? '<span class="sub-auth-badge">✓ in use</span>' : `<button type="button" class="admin-btn" data-github-use="${accountId}" ${disabled}>Use</button>`}
                  <button type="button" class="admin-btn secondary" data-github-edit="${accountId}" ${disabled}>Rename</button>
                  ${canRemove ? `<button type="button" class="admin-btn danger" data-github-remove="${accountId}" ${disabled}>${account.active ? "Sign out" : "Remove"}</button>` : ""}
                </span>
              </div>`;
            })
            .join("");
          const githubDevice = sub.githubDevice;
          const githubFlow = githubDevice
            ? `
              <ol>
                <li>Open <a class="sub-auth-link" href="${escapeHtml(githubDevice.verificationUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(githubDevice.verificationUrl.replace(/^https:\/\//, ""))} ↗</a> and sign in with the GitHub account you want to add.</li>
                <li>Enter this code:</li>
              </ol>
              <div class="device-code" aria-label="Device code">${escapeHtml(githubDevice.userCode)}</div>
              <div class="admin-actions">
                <button type="button" class="admin-btn secondary" id="github-copy-code">Copy code</button>
                <button type="button" class="admin-btn secondary" id="github-device-cancel" ${disabled}>Cancel</button>
              </div>
              <p class="admin-hint" role="status">Waiting for confirmation… this page updates by itself. The code is valid until ${escapeHtml(new Date(githubDevice.expiresAt).toLocaleTimeString())}.</p>`
            : githubFull
              ? `<p class="admin-hint">Maximum of ${sub.githubMax} GitHub accounts reached. Remove one to add another.</p>`
              : `
              <div class="admin-field">
                <label for="github-alias">Name for the new account (optional)</label>
                <input id="github-alias" type="text" placeholder="work" autocomplete="off" maxlength="64" />
              </div>
              <div class="admin-actions">
                <button type="button" class="admin-btn" id="github-device-start" ${disabled}>Add GitHub account</button>
              </div>
              <p class="admin-hint">GitHub adds the account that is signed in to the browser. For another account, switch accounts on github.com first or open the link in a private window.</p>`;
          // Copilot can be switched on and still not run, for example while
          // GitHub has locked the account's billing. Say so, with GitHub's words.
          const githubCopilot = sub.githubCopilot;
          const copilotDown = Boolean(
            githubCopilot?.enabled && !githubCopilot.running
            && (githubCopilot.error || githubAccounts.some((account) => account.active))
          );
          const githubNotes = [
            copilotDown
              ? `<div class="admin-note error" role="alert">Copilot is not running${githubCopilot.error ? `: ${escapeHtml(githubCopilot.error)}` : ". Check the server log."} Fix it on github.com, or pick another account with Use.</div>`
              : "",
            sub.githubError ? `<div class="admin-note error" role="alert">${escapeHtml(sub.githubError)}</div>` : "",
            sub.githubTokenOverride ? '<div class="admin-note error" role="alert">The server was started with its own GitHub token (environment variable or --github-token). That token is used, not the account picked here.</div>' : "",
            sub.githubOutsideToken ? '<div class="admin-note" role="status">Copilot uses a GitHub token that was saved outside this page. Add or pick an account here to replace it.</div>' : "",
          ].join("");

          // Claude subscription: the gateway runs the OAuth flow itself and
          // takes the login code back by paste, because a headless server
          // cannot receive the browser callback.
          const claude = sub.claude;
          const claudeLogin = sub.claudeLogin;
          const claudeConnected = Boolean(claude && claude.loggedIn);
          const claudeStatusLine = !claude
            ? "Checking the Claude sign-in…"
            : claude.loggedIn
              ? `<span class="sub-auth-badge">✓ signed in</span>${claude.authMethod ? ` · ${escapeHtml(claude.authMethod === "oauth_token" ? "subscription" : claude.authMethod)}` : ""}${claude.email ? ` · ${escapeHtml(claude.email)}` : ""}`
              : claude.available === false
                ? "Claude sign-in is not available on this server."
                : "Not signed in.";
          const claudeFlow = claudeLogin
            ? `
              <ol>
                <li>Open the Claude sign-in: <a class="sub-auth-link" href="${escapeHtml(claudeLogin.authUrl)}" target="_blank" rel="noopener noreferrer">Sign in with Claude ↗</a></li>
                <li>Sign in with your Claude account. The browser then shows a login code.</li>
                <li>Copy that code and paste it here. The full address from the address bar works too.</li>
              </ol>
              <div class="admin-field">
                <label for="claude-paste">Login code</label>
                <textarea id="claude-paste" rows="2" placeholder="Paste the code or the full callback address" spellcheck="false"></textarea>
              </div>
              <div class="admin-actions">
                <button type="button" class="admin-btn" id="claude-finish" ${disabled}>Finish sign-in</button>
                <button type="button" class="admin-btn secondary" id="claude-cancel" ${disabled}>Cancel</button>
              </div>`
            : claudeConnected
              ? `
              <div class="admin-actions">
                <button type="button" class="admin-btn secondary" id="claude-restart" ${disabled}>Sign in again</button>
                <button type="button" class="admin-btn danger" id="claude-logout" ${disabled}>Sign out</button>
              </div>
              <p class="admin-hint">The gateway signed in to Claude itself. The OAuth token stays on this server and is refreshed automatically.</p>`
              : `
              <div class="admin-actions">
                <button type="button" class="admin-btn" id="claude-start" ${disabled}>Sign in with Claude</button>
              </div>
              <p class="admin-hint">No browser on the server is needed: the dashboard opens the Claude sign-in and takes the code back by paste.</p>${claude && claude.error ? `<p class="admin-hint">${escapeHtml(claude.error)}</p>` : ""}`;

          const anthropic = sub.anthropicConfigured
            ? `
              <p class="admin-hint"><span class="sub-auth-badge">✓ connected</span> Claude models are available with the prefix <code>anthropic/</code>.</p>
              <div class="admin-actions">
                <button type="button" class="admin-btn danger" id="anthropic-disconnect" ${disabled}>Disconnect</button>
              </div>`
            : `
              <p class="admin-hint">Use an Anthropic API key from <a class="sub-auth-link" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">console.anthropic.com ↗</a> for shared or multi-user gateways. The subscription sign-in above is handled by the gateway itself and is meant for your own account.</p>
              <div class="admin-field">
                <label for="anthropic-key">Anthropic API key</label>
                <input id="anthropic-key" type="password" placeholder="sk-ant-…" autocomplete="off" />
              </div>
              <div class="admin-actions">
                <button type="button" class="admin-btn" id="anthropic-connect" ${disabled}>Connect Anthropic</button>
              </div>`;

          // xAI (Grok) subscription: device code sign-in, multiple accounts.
          const xaiAccounts = sub.xaiAccounts
            .map((account, index) => {
              const displayName = account.alias || `Grok account ${index + 1}`;
              const accountId = escapeHtml(account.accountId);
              return `
              <div class="sub-auth-account">
                <span><strong>${escapeHtml(displayName)}</strong> <code>${escapeHtml(account.accountId.slice(0, 12))}…</code></span>
                <span>
                  ${account.active ? '<span class="sub-auth-badge">✓ in use</span>' : `<button type="button" class="admin-btn secondary" data-xai-use="${accountId}" ${disabled}>Use</button>`}
                  <button type="button" class="admin-btn secondary" data-xai-edit="${accountId}" ${disabled}>Rename</button>
                  ${account.active ? "" : `<button type="button" class="admin-btn danger" data-xai-remove="${accountId}" ${disabled}>Remove</button>`}
                </span>
              </div>`;
            })
            .join("");
          const xaiDevice = sub.xaiDevice;
          const xaiFlow = xaiDevice
            ? `
              <ol>
                <li>Open <a class="sub-auth-link" href="${escapeHtml(xaiDevice.verificationUrl)}" target="_blank" rel="noopener noreferrer">xAI device sign-in ↗</a> and sign in with your Grok/xAI account.</li>
                <li>Enter this code:</li>
              </ol>
              <div class="device-code" aria-label="Device code">${escapeHtml(xaiDevice.userCode)}</div>
              <div class="admin-actions">
                <button type="button" class="admin-btn secondary" id="xai-copy-code">Copy code</button>
                <button type="button" class="admin-btn secondary" id="xai-device-cancel" ${disabled}>Cancel</button>
              </div>
              <p class="admin-hint" role="status">Waiting for confirmation… this page updates by itself. The code is valid until ${escapeHtml(new Date(xaiDevice.expiresAt).toLocaleTimeString())}.</p>`
            : `
              <div class="admin-field">
                <label for="xai-alias">Name for the new account (optional)</label>
                <input id="xai-alias" type="text" placeholder="personal" autocomplete="off" />
              </div>
              <div class="admin-actions">
                <button type="button" class="admin-btn" id="xai-device-start" ${disabled}>Add Grok account</button>
              </div>
              <p class="admin-hint">Connect your Grok/xAI subscription (e.g. SuperGrok). Once signed in, usage appears under Subscriptions. Subscribe/manage at <a class="sub-auth-link" href="https://grok.com/#subscribe" target="_blank" rel="noopener noreferrer">grok.com/#subscribe ↗</a>.</p>`;

          return `
            <section class="sub-auth" aria-label="Sign in to subscriptions">
              <p class="sub-auth-intro">Sign in to your subscriptions. Codex and Anthropic are meant for short tasks only.</p>
              ${notes ? `<div style="grid-column: 1 / -1">${notes}</div>` : ""}
              <div class="admin-card">
                <h2>GitHub Copilot</h2>
                <p class="admin-hint">${sub.loading && !sub.loaded ? "Loading…" : `${githubAccounts.length} of ${sub.githubMax} GitHub accounts${sub.githubCopilot?.running ? " · Copilot is on" : ""}`}</p>
                ${githubNotes}
                ${githubRows}
                <div style="margin-top: 12px">${githubFlow}</div>
              </div>
              <div class="admin-card">
                <h2>Codex</h2>
                <p class="admin-hint">${sub.loading && !sub.loaded ? "Loading…" : `${sub.codexAccounts.length} of 10 accounts`}</p>
                ${accounts}
                <div style="margin-top: 12px">${codexFlow}</div>
              </div>
              <div class="admin-card">
                <h2>xAI (Grok)</h2>
                <p class="admin-hint">${sub.loading && !sub.loaded ? "Loading…" : `${sub.xaiAccounts.length} account(s)`}</p>
                ${xaiAccounts}
                <div style="margin-top: 12px">${xaiFlow}</div>
              </div>
              <div class="admin-card">
                <h2>Anthropic (Claude)</h2>
                <h3 style="margin: 14px 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--quota-muted, #8a8a8a);">Subscription</h3>
                <p class="admin-hint">${claudeStatusLine}</p>
                ${claudeFlow}
                <h3 style="margin: 18px 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--quota-muted, #8a8a8a);">API key</h3>
                ${anthropic}
              </div>
            </section>`;
        }

        let codexDeviceTimer = null;

        function stopCodexDevicePolling() {
          if (codexDeviceTimer) clearTimeout(codexDeviceTimer);
          codexDeviceTimer = null;
        }

        function pollCodexDevice() {
          stopCodexDevicePolling();
          const sub = state.subAuth;
          const device = sub.codexDevice;
          if (!device) return;
          codexDeviceTimer = setTimeout(async () => {
            if (sub.codexDevice?.flowId !== device.flowId) return;
            let status;
            try {
              status = await adminFetch(`auth/codex/device/${encodeURIComponent(device.flowId)}`);
            } catch (error) {
              if (/not found/i.test(getErrorMessage(error))) {
                sub.codexDevice = null;
                sub.error = "The sign-in expired. Start again.";
                render("subscriptions");
                return;
              }
              pollCodexDevice();
              return;
            }
            if (sub.codexDevice?.flowId !== device.flowId) return;
            if (status.status === "pending") {
              pollCodexDevice();
              return;
            }
            sub.codexDevice = null;
            if (status.status === "succeeded") {
              sub.error = null;
              sub.notice = "Codex account added and selected.";
            } else if (status.status === "failed") {
              sub.notice = null;
              sub.error = status.error || "Sign-in failed.";
            }
            await loadSubscriptionAuth();
          }, 3000);
        }

        let githubDeviceTimer = null;

        function stopGithubDevicePolling() {
          if (githubDeviceTimer) clearTimeout(githubDeviceTimer);
          githubDeviceTimer = null;
        }

        function pollGithubDevice() {
          stopGithubDevicePolling();
          const sub = state.subAuth;
          const device = sub.githubDevice;
          if (!device) return;
          githubDeviceTimer = setTimeout(async () => {
            if (sub.githubDevice?.flowId !== device.flowId) return;
            let status;
            try {
              status = await adminFetch(`auth/github/device/${encodeURIComponent(device.flowId)}`);
            } catch (error) {
              if (/not found/i.test(getErrorMessage(error))) {
                sub.githubDevice = null;
                sub.error = "The GitHub sign-in expired. Start again.";
                render("subscriptions");
                return;
              }
              pollGithubDevice();
              return;
            }
            if (sub.githubDevice?.flowId !== device.flowId) return;
            if (status.status === "pending") {
              pollGithubDevice();
              return;
            }
            sub.githubDevice = null;
            if (status.status === "succeeded") {
              const known = sub.githubAccounts.some((account) => account.accountId === status.accountId);
              sub.error = null;
              sub.notice = known
                ? `GitHub account ${status.login} signed in again and in use.`
                : `GitHub account ${status.login} added and in use. Copilot is on.`;
            } else if (status.status === "failed") {
              sub.notice = null;
              sub.error = status.error || "GitHub sign-in failed.";
            }
            await loadSubscriptionAuth();
          }, 3000);
        }

        let xaiDeviceTimer = null;

        function stopXaiDevicePolling() {
          if (xaiDeviceTimer) clearTimeout(xaiDeviceTimer);
          xaiDeviceTimer = null;
        }

        function pollXaiDevice() {
          stopXaiDevicePolling();
          const sub = state.subAuth;
          const device = sub.xaiDevice;
          if (!device) return;
          xaiDeviceTimer = setTimeout(async () => {
            if (sub.xaiDevice?.flowId !== device.flowId) return;
            let status;
            try {
              status = await adminFetch(`auth/xai/device/${encodeURIComponent(device.flowId)}`);
            } catch (error) {
              if (/not found/i.test(getErrorMessage(error))) {
                sub.xaiDevice = null;
                sub.error = "The xAI sign-in expired. Start again.";
                render("subscriptions");
                return;
              }
              pollXaiDevice();
              return;
            }
            if (sub.xaiDevice?.flowId !== device.flowId) return;
            if (status.status === "pending") {
              pollXaiDevice();
              return;
            }
            sub.xaiDevice = null;
            if (status.status === "succeeded") {
              sub.error = null;
              sub.notice = "Grok/xAI account added and selected.";
            } else if (status.status === "failed") {
              sub.notice = null;
              sub.error = status.error || "xAI sign-in failed.";
            }
            await loadSubscriptionAuth();
            void refreshSubscriptionQuotas("xai");
          }, 3000);
        }

        function wireSubscriptionSignIn() {
          const sub = state.subAuth;
          document.getElementById("github-device-start")?.addEventListener("click", () => {
            const alias = (document.getElementById("github-alias")?.value || "").trim();
            void subscriptionAction(async () => {
              sub.githubDevice = await adminFetch("auth/github/device/start", { method: "POST", body: { alias } });
              pollGithubDevice();
            }, "Enter the code on the GitHub page.");
          });
          document.getElementById("github-copy-code")?.addEventListener("click", () => {
            const code = sub.githubDevice?.userCode;
            if (code) void navigator.clipboard?.writeText(code).catch(() => {});
          });
          document.getElementById("github-device-cancel")?.addEventListener("click", () => {
            const device = sub.githubDevice;
            stopGithubDevicePolling();
            sub.githubDevice = null;
            render("subscriptions");
            if (device) void adminFetch(`auth/github/device/${encodeURIComponent(device.flowId)}`, { method: "DELETE" }).catch(() => {});
          });
          contentArea.querySelectorAll("[data-github-use]").forEach((button) => {
            button.addEventListener("click", () => {
              const accountId = button.getAttribute("data-github-use");
              void subscriptionAction(async () => {
                const result = await adminFetch("github/accounts/select", { method: "POST", body: { accountId } });
                // The card below gives the reason; this only reports the outcome.
                if (result?.copilot && !result.copilot.running) {
                  throw new Error("Switched, but Copilot did not start with this account.");
                }
              }, "GitHub account switched. Copilot now uses it.");
            });
          });
          contentArea.querySelectorAll("[data-github-edit]").forEach((button) => {
            button.addEventListener("click", () => {
              const accountId = button.getAttribute("data-github-edit");
              const current = sub.githubAccounts.find((account) => account.accountId === accountId);
              const alias = window.prompt("Name for this GitHub account (for example: Work, Private):", current?.alias || current?.login || "")?.trim();
              if (!alias) return;
              void subscriptionAction(
                () => adminFetch(`github/accounts/${encodeURIComponent(accountId)}`, { method: "PATCH", body: { alias } }),
                "Account name updated."
              );
            });
          });
          contentArea.querySelectorAll("[data-github-remove]").forEach((button) => {
            button.addEventListener("click", () => {
              const accountId = button.getAttribute("data-github-remove");
              const current = sub.githubAccounts.find((account) => account.accountId === accountId);
              const question = current?.active
                ? "Sign Copilot out of this GitHub account? It is the last one, so Copilot turns off."
                : "Remove this GitHub account from the gateway?";
              if (!window.confirm(question)) return;
              void subscriptionAction(
                () => adminFetch("github/accounts/remove", { method: "POST", body: { accountId } }),
                current?.active ? "Signed out. Copilot is off." : "GitHub account removed."
              );
            });
          });
          document.getElementById("codex-device-start")?.addEventListener("click", () => {
            const alias = (document.getElementById("codex-alias")?.value || "").trim();
            void subscriptionAction(async () => {
              sub.codexDevice = await adminFetch("auth/codex/device/start", { method: "POST", body: { alias } });
              pollCodexDevice();
            }, "Enter the code on the OpenAI page.");
          });
          document.getElementById("codex-copy-code")?.addEventListener("click", () => {
            const code = sub.codexDevice?.userCode;
            if (code) void navigator.clipboard?.writeText(code).catch(() => {});
          });
          document.getElementById("codex-device-cancel")?.addEventListener("click", () => {
            const device = sub.codexDevice;
            stopCodexDevicePolling();
            sub.codexDevice = null;
            render("subscriptions");
            if (device) void adminFetch(`auth/codex/device/${encodeURIComponent(device.flowId)}`, { method: "DELETE" }).catch(() => {});
          });
          document.getElementById("codex-start")?.addEventListener("click", () => {
            const alias = (document.getElementById("codex-alias")?.value || "").trim();
            void subscriptionAction(async () => {
              const login = await adminFetch("auth/codex/start", { method: "POST", body: { alias } });
              sub.codexLogin = login;
              window.open(login.authUrl, "_blank", "noopener");
            }, "OpenAI sign-in opened in a new tab.");
          });
          document.getElementById("codex-finish")?.addEventListener("click", () => {
            const input = (document.getElementById("codex-paste")?.value || "").trim();
            const login = sub.codexLogin;
            if (!login) return;
            void subscriptionAction(async () => {
              try {
                await adminFetch("auth/codex/complete", { method: "POST", body: { state: login.state, input } });
                sub.codexLogin = null;
              } catch (error) {
                // An expired or used sign-in cannot be retried; start over.
                if (/expired|already used/i.test(getErrorMessage(error))) sub.codexLogin = null;
                throw error;
              }
            }, "Codex account added and selected.");
          });
          document.getElementById("codex-cancel")?.addEventListener("click", () => {
            sub.codexLogin = null;
            render("subscriptions");
          });
          contentArea.querySelectorAll("[data-codex-use]").forEach((button) => {
            button.addEventListener("click", () => {
              const accountId = button.getAttribute("data-codex-use");
              void subscriptionAction(
                () => adminFetch("codex/accounts/select", { method: "POST", body: { accountId } }),
                "Codex account switched."
              );
            });
          });
          contentArea.querySelectorAll("[data-codex-edit]").forEach((button) => {
            button.addEventListener("click", () => {
              const accountId = button.getAttribute("data-codex-edit");
              const current = sub.codexAccounts.find((account) => account.accountId === accountId);
              const alias = window.prompt(
                "Name for this ChatGPT/Codex account (for example: Work, Private, Team):",
                current?.alias || "",
              )?.trim();
              if (!alias) return;
              void subscriptionAction(
                () => adminFetch(`codex/accounts/${encodeURIComponent(accountId)}`, { method: "PATCH", body: { alias } }),
                "Account name updated."
              );
            });
          });
          contentArea.querySelectorAll("[data-codex-remove]").forEach((button) => {
            button.addEventListener("click", () => {
              const accountId = button.getAttribute("data-codex-remove");
              if (!window.confirm("Remove this Codex account?")) return;
              void subscriptionAction(
                () => adminFetch("codex/accounts/remove", { method: "POST", body: { accountId } }),
                "Codex account removed."
              );
            });
          });
          const startClaudeLogin = () => {
            void subscriptionAction(async () => {
              const login = await adminFetch("auth/claude/start", { method: "POST" });
              sub.claudeLogin = login;
              window.open(login.authUrl, "_blank", "noopener");
            }, "Claude sign-in opened in a new tab.");
          };
          document.getElementById("claude-start")?.addEventListener("click", startClaudeLogin);
          document.getElementById("claude-restart")?.addEventListener("click", startClaudeLogin);
          document.getElementById("claude-finish")?.addEventListener("click", () => {
            const code = (document.getElementById("claude-paste")?.value || "").trim();
            const login = sub.claudeLogin;
            if (!login) return;
            void subscriptionAction(async () => {
              try {
                await adminFetch("auth/claude/complete", { method: "POST", body: { flowId: login.flowId, code } });
                sub.claudeLogin = null;
              } catch (error) {
                if (/expired|already/i.test(getErrorMessage(error))) sub.claudeLogin = null;
                throw error;
              }
            }, "Claude subscription connected.");
          });
          document.getElementById("claude-cancel")?.addEventListener("click", () => {
            const login = sub.claudeLogin;
            sub.claudeLogin = null;
            render("subscriptions");
            if (login) void adminFetch(`auth/claude/login/${encodeURIComponent(login.flowId)}`, { method: "DELETE" }).catch(() => {});
          });
          document.getElementById("claude-logout")?.addEventListener("click", () => {
            if (!window.confirm("Sign out of Claude Code on this server? Other tools using this CLI login will also be signed out.")) return;
            void subscriptionAction(() => adminFetch("auth/claude/logout", { method: "POST" }), "Claude Code signed out.");
          });
          document.getElementById("anthropic-connect")?.addEventListener("click", () => {
            const apiKey = (document.getElementById("anthropic-key")?.value || "").trim();
            void subscriptionAction(async () => {
              if (!apiKey) throw new Error("Enter the Anthropic API key first.");
              await adminFetch("providers", { method: "POST", body: { ...ANTHROPIC_PROVIDER, apiKey, enabled: true } });
              // Same key gives exact Claude token counts (/v1/messages/count_tokens).
              await adminFetch("anthropic/apikey", { method: "POST", body: { apiKey } });
            }, "Anthropic connected.");
          });
          document.getElementById("anthropic-disconnect")?.addEventListener("click", () => {
            if (!window.confirm("Disconnect Anthropic?")) return;
            void subscriptionAction(async () => {
              await adminFetch(`providers/${ANTHROPIC_PROVIDER.name}`, { method: "DELETE" });
              await adminFetch("anthropic/apikey", { method: "DELETE" });
            }, "Anthropic disconnected.");
          });

          document.getElementById("xai-device-start")?.addEventListener("click", () => {
            const alias = (document.getElementById("xai-alias")?.value || "").trim();
            void subscriptionAction(async () => {
              sub.xaiDevice = await adminFetch("auth/xai/device/start", { method: "POST", body: { alias } });
              pollXaiDevice();
            }, "Enter the code on the xAI page.");
          });
          document.getElementById("xai-copy-code")?.addEventListener("click", () => {
            const code = sub.xaiDevice?.userCode;
            if (code) void navigator.clipboard?.writeText(code).catch(() => {});
          });
          document.getElementById("xai-device-cancel")?.addEventListener("click", () => {
            const device = sub.xaiDevice;
            stopXaiDevicePolling();
            sub.xaiDevice = null;
            render("subscriptions");
            if (device) void adminFetch(`auth/xai/device/${encodeURIComponent(device.flowId)}`, { method: "DELETE" }).catch(() => {});
          });
          contentArea.querySelectorAll("[data-xai-use]").forEach((button) => {
            button.addEventListener("click", () => {
              const accountId = button.getAttribute("data-xai-use");
              void subscriptionAction(
                () => adminFetch("xai/accounts/select", { method: "POST", body: { accountId } }),
                "Grok/xAI account switched."
              );
            });
          });
          contentArea.querySelectorAll("[data-xai-edit]").forEach((button) => {
            button.addEventListener("click", () => {
              const accountId = button.getAttribute("data-xai-edit");
              const current = sub.xaiAccounts.find((account) => account.accountId === accountId);
              const alias = window.prompt(
                "Name for this Grok/xAI account (for example: Personal, Work):",
                current?.alias || "",
              )?.trim();
              if (!alias) return;
              void subscriptionAction(
                () => adminFetch(`xai/accounts/${encodeURIComponent(accountId)}`, { method: "PATCH", body: { alias } }),
                "Account name updated."
              );
            });
          });
          contentArea.querySelectorAll("[data-xai-remove]").forEach((button) => {
            button.addEventListener("click", () => {
              const accountId = button.getAttribute("data-xai-remove");
              if (!window.confirm("Remove this Grok/xAI account?")) return;
              void subscriptionAction(
                () => adminFetch("xai/accounts/remove", { method: "POST", body: { accountId } }),
                "Grok/xAI account removed."
              );
            });

        // --- Data Fetching ---

        async function refreshSubscriptionQuotas(provider) {
          syncSubscriptionsConnection();
          if (!provider && canManageSubscriptions()) void loadSubscriptionAuth();
          try {
            if (!endpointUrlInput.value.trim()) throw new Error("Endpoint URL cannot be empty.");
            await fetchSubscriptionQuotas(resolveUsageUrl(endpointUrlInput.value.trim()), provider);
          } catch (error) {
            state.subscriptionPageError = getErrorMessage(error);
            render("subscriptions");
          }
        }

        async function fetchSubscriptionQuotas(usageUrl, selectedProvider) {
          if (selectedProvider && !Object.hasOwn(SUBSCRIPTION_PROVIDERS, selectedProvider)) return;
          if (!selectedProvider) {
            state.subscriptionRequestId += 1;
            state.subscriptionUsage = {};
            state.subscriptionUsageErrors = {};
            state.subscriptionLoadingProviders = {};
          }
          const requestId = state.subscriptionRequestId;
          const connectionKey = getConnectionKey();
          state.subscriptionPageError = null;
          const providers = selectedProvider ? [selectedProvider] : Object.keys(SUBSCRIPTION_PROVIDERS);
          await Promise.all(providers.map(async (provider) => {
            const revision = (state.subscriptionRequests[provider] || 0) + 1;
            state.subscriptionRequests[provider] = revision;
            delete state.subscriptionUsage[provider];
            delete state.subscriptionUsageErrors[provider];
            state.subscriptionLoadingProviders[provider] = true;
            state.isSubscriptionsLoading = true;
            render("subscriptions");
            const isCurrent = () => requestId === state.subscriptionRequestId
              && connectionKey === getConnectionKey() && revision === state.subscriptionRequests[provider];
            try {
              const usage = await fetchJson(
                deriveEndpointUrl(usageUrl, `usage/${provider}`), isCurrent
              );
              if (!isCurrent()) return;
              if (usage?.provider !== provider || !Array.isArray(usage.windows)) throw new Error("Invalid subscription quota response");
              state.subscriptionUsage[provider] = usage;
            } catch (error) {
              if (!isCurrent()) return;
              if (error?.status !== 404) state.subscriptionUsageErrors[provider] = true;
            } finally {
              if (isCurrent()) {
                delete state.subscriptionLoadingProviders[provider];
                state.isSubscriptionsLoading = Object.keys(state.subscriptionLoadingProviders).length > 0;
                state.subscriptionsLoaded = true;
                render("subscriptions");
              }
            }
          }));
        }

        /**
         * Fetches usage data and token usage data from the specified API endpoint.
         */
        async function fetchData(page = 1) {
          await fetchTokenUsageSummaryAndEvents(page, true);
        }

        async function fetchTokenUsageSummaryAndEvents(page = 1, showSpinner = false) {
          const connectionKey = syncTokenUsageConnection();
          const requestId = ++state.tokenUsageRequestId;
          const eventsRequestId = ++state.eventsRequestId;
          const isCurrentRequest = () =>
            requestId === state.tokenUsageRequestId && connectionKey === getConnectionKey();
          const isCurrentEventsRequest = () =>
            eventsRequestId === state.eventsRequestId && isCurrentRequest();
          invalidateSessionsRequest();
          state.isEventsLoading = false;
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) {
            state.isLoading = false;
            state.isTokenUsageLoading = false;
            state.tokenUsageDailySummary = null;
            state.tokenUsageSummary = null;
            state.tokenUsageEventsPage = null;
            state.tokenUsageDailyError =
              "Token usage requires a valid endpoint URL.";
            state.tokenUsageSummaryError =
              "Token usage requires a valid endpoint URL.";
            state.tokenUsageEventsError = null;
            render();
            return;
          }

          const period = getSelectedPeriod();
          state.isLoading = showSpinner;
          state.isTokenUsageLoading = true;
          state.tokenUsageDailySummary = null;
          state.tokenUsageSummary = null;
          state.tokenUsageEventsPage = null;
          state.tokenUsageDailyError = null;
          state.tokenUsageSummaryError = null;
          state.tokenUsageEventsError = null;
          render();

          try {
            const usageUrl = resolveUsageUrl(endpoint);
            const [summaryResult, dailyResult, eventsResult] =
              await Promise.allSettled([
                fetchJson(buildTokenUsageSummaryUrl(usageUrl, period), isCurrentRequest),
                fetchJson(buildTokenUsageDailyUrl(usageUrl, period), isCurrentRequest),
                fetchJson(buildTokenUsageEventsUrl(usageUrl, period, page), isCurrentEventsRequest),
              ]);
            if (!isCurrentRequest()) return;

            if (summaryResult.status === "fulfilled") {
              state.tokenUsageSummary = summaryResult.value;
              void fetchTokenUsageSessionsPage(1);
            } else if (
              isMissingTokenUsageEndpointError(summaryResult.reason)
            ) {
              state.tokenUsageSummary = null;
              state.tokenUsageSummaryError = null;
            } else {
              state.tokenUsageSummary = null;
              state.tokenUsageSummaryError = getErrorMessage(
                summaryResult.reason
              );
            }

            if (dailyResult.status === "fulfilled") {
              state.tokenUsageDailySummary = dailyResult.value;
            } else if (
              isMissingTokenUsageEndpointError(dailyResult.reason)
            ) {
              state.tokenUsageDailySummary = null;
              state.tokenUsageDailyError = null;
            } else {
              state.tokenUsageDailySummary = null;
              state.tokenUsageDailyError = getErrorMessage(
                dailyResult.reason
              );
            }

            if (!isCurrentEventsRequest()) return;
            if (eventsResult.status === "fulfilled") {
              state.tokenUsageEventsPage = eventsResult.value;
            } else if (
              isMissingTokenUsageEndpointError(eventsResult.reason)
            ) {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = null;
            } else {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = getErrorMessage(
                eventsResult.reason
              );
            }
          } catch (error) {
            if (!isCurrentRequest()) return;
            console.error("Token usage fetch error:", error);
            state.tokenUsageDailySummary = null;
            state.tokenUsageSummary = null;
            state.tokenUsageDailyError = getErrorMessage(error);
            state.tokenUsageSummaryError = getErrorMessage(error);
            if (isCurrentEventsRequest()) {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = getErrorMessage(error);
            }
          } finally {
            if (isCurrentRequest()) {
              state.isLoading = false;
              state.isTokenUsageLoading = false;
              render("usage");
            }
          }
        }

        async function fetchTokenUsageEventsPage(page) {
          const connectionKey = syncTokenUsageConnection();
          const requestId = ++state.eventsRequestId;
          const isCurrentRequest = () =>
            requestId === state.eventsRequestId && connectionKey === getConnectionKey();
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) {
            state.isEventsLoading = false;
            state.tokenUsageEventsError =
              "Token usage requires a valid endpoint URL.";
            render();
            return;
          }

          state.isEventsLoading = true;
          state.tokenUsageEventsError = null;
          render();

          try {
            const usageUrl = resolveUsageUrl(endpoint);
            const result = await fetchJson(
              buildTokenUsageEventsUrl(usageUrl, getSelectedPeriod(), page),
              isCurrentRequest
            );
            if (isCurrentRequest()) state.tokenUsageEventsPage = result;
          } catch (error) {
            if (!isCurrentRequest()) return;
            if (isMissingTokenUsageEndpointError(error)) {
              state.tokenUsageEventsPage = null;
              state.tokenUsageEventsError = null;
            } else {
              console.error("Token usage events fetch error:", error);
              state.tokenUsageEventsError = getErrorMessage(error);
            }
          } finally {
            if (isCurrentRequest()) {
              state.isEventsLoading = false;
              render("usage");
            }
          }
        }

        async function fetchTokenUsageSessionsPage(page) {
          const connectionKey = syncTokenUsageConnection();
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) {
            return;
          }

          const requestId = ++state.sessionsRequestId;
          const isCurrentRequest = () =>
            requestId === state.sessionsRequestId && connectionKey === getConnectionKey();
          state.isSessionsLoading = true;
          state.tokenUsageSessionsError = null;
          render();

          try {
            const result = await fetchJson(
              buildTokenUsageEventsUrl(
                resolveUsageUrl(endpoint),
                getSelectedPeriod(),
                page,
                "sessions"
              ),
              isCurrentRequest
            );
            if (!isCurrentRequest()) {
              return;
            }
            state.tokenUsageSessionsPage = result;
          } catch (error) {
            if (!isCurrentRequest()) {
              return;
            }
            // Older servers have no sessions endpoint; show the empty state.
            if (isMissingTokenUsageEndpointError(error)) {
              state.tokenUsageSessionsPage = null;
            } else {
              console.error("Token usage sessions fetch error:", error);
              state.tokenUsageSessionsError = getErrorMessage(error);
            }
          }

          state.isSessionsLoading = false;
          render("usage");
        }

        // Clears sessions when refreshing the endpoint or period and ignores
        // late responses from the previous context.
        function invalidateSessionsRequest() {
          state.sessionsRequestId += 1;
          state.isSessionsLoading = false;
          state.tokenUsageSessionsPage = null;
          state.tokenUsageSessionsError = null;
        }

        function syncTokenUsageConnection() {
          const key = getConnectionKey();
          if (state.tokenUsageConnectionKey !== key) {
            state.tokenUsageConnectionKey = key;
            state.tokenUsageRequestId += 1;
            state.eventsRequestId += 1;
            state.isLoading = false;
            state.isTokenUsageLoading = false;
            state.isEventsLoading = false;
            state.tokenUsageSummary = null;
            state.tokenUsageDailySummary = null;
            state.tokenUsageEventsPage = null;
            state.tokenUsageSummaryError = null;
            state.tokenUsageDailyError = null;
            state.tokenUsageEventsError = null;
            invalidateSessionsRequest();
          }
          return key;
        }

        // --- Event Handlers & Initialization ---

        /**
         * Handles the form submission to trigger a data fetch.
         * @param {Event} event - The form submission event.
         */
        function handleFormSubmit(event) {
          event.preventDefault();
          syncEndpointCredential();
          storeApiKey(apiKeyInput.value, endpointUrlInput.value.trim());
          syncUrlState();
          if (state.activeTab === "models") {
            void fetchModels();
          } else if (state.activeTab === "providers") {
            void fetchProviders();
          } else if (state.activeTab === "subscriptions") {
            void refreshSubscriptionQuotas();
          } else if (state.activeTab === "admin") {
            void fetchAdminData();
          } else {
            void fetchData();
          }
        }

        function handlePeriodChange() {
          syncUrlState();
          void fetchTokenUsageSummaryAndEvents(1);
        }

        function handleContentAreaClick(event) {
          if (!(event.target instanceof Element)) {
            return;
          }
          const quotaRefresh = event.target.closest("[data-quota-refresh]");
          if (quotaRefresh) {
            void refreshSubscriptionQuotas(quotaRefresh.dataset.quotaRefresh);
            return;
          }
          const copyButton = event.target.closest("[data-model-copy]");
          if (copyButton) {
            void copyModelId(copyButton.dataset.modelCopy);
            return;
          }
          const collapseToggle = event.target.closest("[data-collapse-toggle]");
          if (collapseToggle) {
            toggleCollapsedSection(collapseToggle);
            return;
          }
          const detailsButton = event.target.closest("[data-model-details]");
          if (detailsButton) {
            const details = document.getElementById(
              detailsButton.dataset.modelDetails
            );
            details.hidden = !details.hidden;
            detailsButton.setAttribute("aria-expanded", String(!details.hidden));
            detailsButton.textContent = details.hidden ? "View JSON" : "Hide JSON";
            return;
          }
          const trendMetric = event.target.closest("[data-trend-metric]");
          if (trendMetric) {
            state.tokenUsageTrendMetric =
              trendMetric.getAttribute("data-trend-metric")
              || ALL_METRICS_VALUE;
            render();
            return;
          }

          const trendPoint = event.target.closest("[data-trend-day]");
          if (trendPoint) {
            const day = trendPoint.getAttribute("data-trend-day");
            if (day) {
              state.tokenUsageTrendDay = day;
              render();
            }
            return;
          }

          const sessionButton = event.target.closest("[data-session-page]");
          if (sessionButton) {
            if (!state.isSessionsLoading) {
              // Offset 0 is the error retry button: reload the current page.
              void fetchTokenUsageSessionsPage(
                (state.tokenUsageSessionsPage?.page ?? 1)
                  + Number(sessionButton.getAttribute("data-session-page"))
              );
            }
            return;
          }

          const actionButton = event.target.closest("[data-page-action]");
          if (!actionButton || !state.tokenUsageEventsPage || state.isEventsLoading) {
            return;
          }

          const action = actionButton.getAttribute("data-page-action");
          if (
            action === "previous"
            && state.tokenUsageEventsPage.page > 1
          ) {
            void fetchTokenUsageEventsPage(state.tokenUsageEventsPage.page - 1);
          }

          if (
            action === "next"
            && state.tokenUsageEventsPage.page
              < state.tokenUsageEventsPage.total_pages
          ) {
            void fetchTokenUsageEventsPage(state.tokenUsageEventsPage.page + 1);
          }
          const providerModelsButton = event.target.closest("[data-provider-models]");
          if (providerModelsButton) {
            void fetchProviderModels(providerModelsButton.dataset.providerModels);
            return;
          }
        }

        function handleContentAreaChange(event) {
          if (!(event.target instanceof HTMLSelectElement)) {
            return;
          }

          if (!event.target.matches("[data-token-usage-trend-model]")) {
            return;
          }

          state.tokenUsageTrendModel =
            event.target.value || ALL_MODELS_VALUE;
          render();
        }

        // --- Admin: providers, API keys, virtual models, best-model router ---
        const ADMIN_KEY_STORAGE_PREFIX = "copilot-api.usage-viewer.admin-key.";
        const ADMIN_PROVIDER_TYPES = [
          "openai-compatible",
          "openai-responses",
          "anthropic",
          "google",
          "chatgpt",
        ];
        const ADMIN_AUTH_TYPES = [
          "",
          "authorization",
          "x-api-key",
          "x-goog-api-key",
          "oauth2",
          "azure-entra",
          "cookie",
        ];

        function getAdminKeyStorageKey(endpoint) {
          const origin = getEndpointOrigin(endpoint);
          return origin ? `${ADMIN_KEY_STORAGE_PREFIX}${origin}` : "";
        }

        function readStoredAdminKey(endpoint) {
          const storageKey = getAdminKeyStorageKey(endpoint);
          if (!storageKey) return "";
          try {
            return window.localStorage.getItem(storageKey) || "";
          } catch (error) {
            console.warn("Could not read admin key:", getErrorMessage(error));
            return "";
          }
        }

        function writeStoredAdminKey(endpoint, value) {
          const storageKey = getAdminKeyStorageKey(endpoint);
          if (!storageKey) return;
          try {
            if (value) window.localStorage.setItem(storageKey, value);
            else window.localStorage.removeItem(storageKey);
          } catch (error) {
            console.warn("Could not store admin key:", getErrorMessage(error));
          }
        }

        function adminHeaders() {
          const headers = { "Content-Type": "application/json" };
          const key = (state.admin.adminKey || "").trim();
          if (key) headers["x-api-key"] = key;
          return headers;
        }

        async function adminFetch(path, options = {}) {
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) throw new Error("Endpoint URL cannot be empty.");
          const response = await fetch(
            deriveEndpointUrl(endpoint, `admin/config/${path}`),
            {
              method: options.method || "GET",
              headers: adminHeaders(),
              body:
                options.body === undefined ? undefined : JSON.stringify(options.body),
            }
          );
          if (!response.ok) {
            let message = response.statusText || "Request failed";
            try {
              const contentType = response.headers.get("content-type") || "";
              if (contentType.includes("application/json")) {
                const payload = await response.json();
                const apiMessage = payload?.error?.message || payload?.message;
                if (typeof apiMessage === "string" && apiMessage.trim()) {
                  message = apiMessage.trim();
                }
              } else {
                const text = await response.text();
                if (text.trim()) message = text.trim();
              }
            } catch (error) {
              console.warn("Could not parse admin error:", getErrorMessage(error));
            }
            const err = new Error(message);
            err.status = response.status;
            throw err;
          }
          return response.json();
        }

        /**
         * Calls the admin API-key management endpoints (`/admin/api-keys`),
         * which are guarded by the admin key / admin session middleware.
         */
        async function adminApiKeysFetch(path = "", options = {}) {
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) throw new Error("Endpoint URL cannot be empty.");
          const response = await fetch(
            deriveEndpointUrl(endpoint, `admin/api-keys${path}`),
            {
              method: options.method || "GET",
              headers: adminHeaders(),
              body:
                options.body === undefined ? undefined : JSON.stringify(options.body),
            }
          );
          if (!response.ok) {
            let message = response.statusText || "Request failed";
            try {
              const payload = await response.json();
              const apiMessage = payload?.error?.message || payload?.message;
              if (typeof apiMessage === "string" && apiMessage.trim()) {
                message = apiMessage.trim();
              }
            } catch (error) {
              console.warn("Could not parse admin error:", getErrorMessage(error));
            }
            throw new Error(message);
          }
          return response.json();
        }

        async function webApiFetch(path, options = {}) {
          const endpoint = endpointUrlInput.value.trim();
          if (!endpoint) throw new Error("Endpoint URL cannot be empty.");
          const response = await fetch(
            deriveEndpointUrl(endpoint, `admin/web/${path}`),
            {
              method: options.method || "GET",
              headers: adminHeaders(),
              body: options.body === undefined ? undefined : JSON.stringify(options.body),
            }
          );
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            const err = new Error(payload?.error?.message || `Request failed (${response.status})`);
            err.loginHint = payload?.error?.loginHint || "";
            throw err;
          }
          return payload;
        }

        async function fetchWebApiProviders() {
          if (state.webapi.loading) return;
          state.webapi.loading = true;
          state.webapi.error = null;
          try {
            const payload = await webApiFetch("providers");
            state.webapi.providers = Array.isArray(payload.providers) ? payload.providers : [];
            state.webapi.loaded = true;
          } catch (error) {
            state.webapi.error = getErrorMessage(error);
          } finally {
            state.webapi.loading = false;
            if (state.activeTab === "webapi") render("webapi");
          }
        }

        function webApiStatusBadge(provider) {
          if (!provider.configured) return `<span class="badge">nicht eingerichtet</span>`;
          if (provider.status === "active") return `<span class="badge">aktiv</span>`;
          if (provider.status === "expired") return `<span class="badge">abgelaufen</span>`;
          return `<span class="badge">ungeprüft</span>`;
        }

        function renderWebApiSection() {
          const w = state.webapi;
          if (w.loading && !w.loaded) return renderSpinner();
          const activeCount = w.providers.filter((p) => p.status === "active").length;
          const cards = w.providers.map((provider) => {
            const busy = Boolean(w.busy[provider.id]);
            const test = w.testResults[provider.id];
            return `
              <section class="data-table" style="margin-bottom:1rem;padding:1rem">
                <h3>${escapeHtml(provider.displayName)} ${webApiStatusBadge(provider)}</h3>
                <p>${escapeHtml(provider.webUrl)}${provider.accountLabel ? ` · Account: ${escapeHtml(provider.accountLabel)}` : ""}${provider.modelCount !== null && provider.modelCount !== undefined ? ` · ${provider.modelCount} Modelle` : ""}</p>
                ${provider.status === "expired" ? `<p>Session abgelaufen. ${escapeHtml(provider.loginHint)}</p>` : ""}
                <details>
                  <summary>Login-Anleitung</summary>
                  <p>${escapeHtml(provider.loginHint)}</p>
                </details>
                <label>Session (Cookie, Token oder kompletter fetch()-Aufruf)
                  <textarea data-webapi-session="${escapeHtml(provider.id)}" rows="3" style="width:100%" autocomplete="off" spellcheck="false"></textarea>
                </label>
                <div>
                  <button type="button" data-webapi-save="${escapeHtml(provider.id)}" ${busy ? "disabled" : ""}>Session speichern</button>
                  <button type="button" data-webapi-validate="${escapeHtml(provider.id)}" ${busy ? "disabled" : ""}>Prüfen</button>
                  <button type="button" data-webapi-test="${escapeHtml(provider.id)}" ${busy ? "disabled" : ""}>Test-Chat</button>
                  <button type="button" data-webapi-delete="${escapeHtml(provider.id)}" ${busy ? "disabled" : ""}>Session löschen</button>
                </div>
                ${test ? `<p>Test: ${escapeHtml(test.model)} · ${test.latencyMs} ms · Antwort: ${escapeHtml(test.reply || "")}</p>` : ""}
              </section>`;
          }).join("");
          return `
            <div>
              <p>${activeCount} von ${w.providers.length} Web-Providern aktiv.
                <button type="button" data-webapi-refresh>Aktualisieren</button>
                <button type="button" data-webapi-validate-all>Alle prüfen</button>
              </p>
              ${w.error ? `<p role="alert">${escapeHtml(w.error)}</p>` : ""}
              ${w.notice ? `<p>${escapeHtml(w.notice)}</p>` : ""}
              ${cards || "<p>Keine Web-Provider gefunden.</p>"}
            </div>`;
        }

        async function webApiAction(id, action, body) {
          state.webapi.busy[id] = true;
          state.webapi.error = null;
          render("webapi");
          try {
            const result = await webApiFetch(`providers/${encodeURIComponent(id)}/${action}`, {
              method: action === "session" && body?._delete ? "DELETE" : "POST",
              body: body?._delete ? undefined : body,
            });
            if (action === "test-chat") state.webapi.testResults[id] = result;
            state.webapi.notice = "OK";
            await fetchWebApiProviders();
            return result;
          } catch (error) {
            state.webapi.error = getErrorMessage(error) + (error.loginHint ? ` ${error.loginHint}` : "");
            throw error;
          } finally {
            state.webapi.busy[id] = false;
            if (state.activeTab === "webapi") render("webapi");
          }
        }

        function wireWebApiSection() {
          const root = contentArea;
          root.querySelector("[data-webapi-refresh]")?.addEventListener("click", () => void fetchWebApiProviders());
          root.querySelector("[data-webapi-validate-all]")?.addEventListener("click", async () => {
            for (const provider of state.webapi.providers) {
              if (provider.configured) await webApiAction(provider.id, "validate").catch(() => {});
            }
          });
          root.querySelectorAll("[data-webapi-save]").forEach((button) => {
            button.addEventListener("click", async () => {
              const id = button.getAttribute("data-webapi-save");
              const textarea = root.querySelector(`[data-webapi-session="${CSS.escape(id)}"]`);
              const value = textarea ? textarea.value : "";
              const kind = value.trim().startsWith("fetch(") ? "fetch-capture" : "cookie";
              await webApiAction(id, "session", { kind, value }).catch(() => {});
              if (textarea) textarea.value = "";
            });
          });
          root.querySelectorAll("[data-webapi-validate]").forEach((button) => {
            button.addEventListener("click", () => void webApiAction(button.getAttribute("data-webapi-validate"), "validate").catch(() => {}));
          });
          root.querySelectorAll("[data-webapi-test]").forEach((button) => {
            button.addEventListener("click", () => void webApiAction(button.getAttribute("data-webapi-test"), "test-chat").catch(() => {}));
          });
          root.querySelectorAll("[data-webapi-delete]").forEach((button) => {
            button.addEventListener("click", () => void webApiAction(button.getAttribute("data-webapi-delete"), "session", { _delete: true }).catch(() => {}));
          });
        }

        function normalizeRouterDraft(input) {
          const router = input && typeof input === "object" ? input : {};
          return {
            enabled: router.enabled === true,
            alias:
              typeof router.alias === "string" && router.alias.trim()
                ? router.alias.trim()
                : "auto",
            pool: Array.isArray(router.pool)
              ? router.pool.filter((m) => typeof m === "string")
              : [],
            strategy: ["auto", "rules", "heuristic"].includes(router.strategy)
              ? router.strategy
              : "auto",
            rules: Array.isArray(router.rules)
              ? router.rules.map((rule) => ({
                  match: String(rule?.match ?? ""),
                  model: String(rule?.model ?? ""),
                }))
              : [],
            defaultModel:
              typeof router.defaultModel === "string" ? router.defaultModel : "",
            modelHints:
              router.modelHints && typeof router.modelHints === "object"
                ? router.modelHints
                : {},
          };
        }

        async function fetchAdminData() {
          if (state.admin.loading) return;
          syncEndpointCredential();
          const endpoint = endpointUrlInput.value.trim();
          if (!state.admin.adminKey) {
            state.admin.adminKey = readStoredAdminKey(endpoint);
          }
          state.admin.loading = true;
          state.admin.error = null;
          state.admin.notice = null;
          state.admin.apiKeysError = null;
          render("admin");
          try {
            let models = [];
            try {
              const payload = await adminFetch("models");
              models = Array.isArray(payload?.models)
                ? payload.models.map((model) => model?.id).filter((id) => typeof id === "string")
                : [];
            } catch (error) {
              models = [];
            }

            const [providersPayload, keysPayload, routerPayload, mappingsPayload, codexAccountsPayload, apiKeysPayload] =
              await Promise.all([
                adminFetch("providers"),
                adminFetch("keys"),
                adminFetch("router"),
                adminFetch("model-mappings"),
                adminFetch("codex/accounts").catch(() => ({ accounts: [] })),
                adminApiKeysFetch("").catch((error) => {
                  state.admin.apiKeysError = getErrorMessage(error);
                  return { keys: [] };
                }),
              ]);

            state.admin.models = models;
            state.admin.providers = Array.isArray(providersPayload.providers)
              ? providersPayload.providers
              : [];
            state.admin.keys = {
              apiKeys: keysPayload.apiKeys || [],
              adminApiKey: keysPayload.adminApiKey || "",
            };
            state.admin.keysDraft = {
              apiKeysText: (keysPayload.apiKeys || []).join("\n"),
              adminApiKey: keysPayload.adminApiKey || "",
            };
            state.admin.apiKeys = Array.isArray(apiKeysPayload.keys)
              ? apiKeysPayload.keys
              : [];
            state.admin.router = normalizeRouterDraft(routerPayload.router);
            state.admin.mappings = mappingsPayload.modelMappings || {};
            state.admin.mappingsDraft = Object.entries(state.admin.mappings).map(
              ([source, target]) => ({ source, target })
            );
            state.admin.codexAccounts = Array.isArray(codexAccountsPayload.accounts)
              ? codexAccountsPayload.accounts
              : [];
            state.admin.users = [];
            if (state.session?.role === "admin") {
              const usersPayload = await authRequest("users").catch(() => ({ users: [] }));
              state.admin.users = Array.isArray(usersPayload.users) ? usersPayload.users : [];
              state.admin.usersMailReady = Boolean(usersPayload.mailReady);
            }
            state.admin.loaded = true;
          } catch (error) {
            state.admin.error = getErrorMessage(error);
          } finally {
            state.admin.loading = false;
            render("admin");
          }
        }

        function usableModelOptions(selected, options = {}) {
          const { includeEmpty = false, emptyLabel = "— none —" } = options;
          const parts = [];
          if (includeEmpty) {
            parts.push(`<option value="">${escapeHtml(emptyLabel)}</option>`);
          }
          for (const model of state.admin.models) {
            parts.push(
              `<option value="${escapeHtml(model)}"${model === selected ? " selected" : ""}>${escapeHtml(model)}</option>`
            );
          }
          if (selected && !state.admin.models.includes(selected)) {
            parts.push(
              `<option value="${escapeHtml(selected)}" selected>${escapeHtml(selected)} (unavailable)</option>`
            );
          }
          return parts.join("");
        }

        /**
         * Serializes a provider's API-key pool for the Admin textarea. Each line
         * is `key | enabled | rpm | owner`; trailing empty fields are dropped.
         */
        function formatProviderApiKeys(apiKeys) {
          return (Array.isArray(apiKeys) ? apiKeys : [])
            .map((entry) => {
              if (!entry || typeof entry.key !== "string") return "";
              return [entry.key, entry.enabled === false ? "no" : "yes", entry.rpm == null ? "" : String(entry.rpm), entry.owner || ""]
                .join(" | ")
                .replace(/(\s*\|\s*)+$/, "");
            })
            .filter(Boolean)
            .join("\n");
        }

        /**
         * Parses the Admin textarea back into a key pool. A bare key line means
         * "enabled, unlimited rpm".
         */
        function parseProviderApiKeys(text) {
          return (text || "")
            .split("\n")
            .map((line) => line.trim())
            .filter(Boolean)
            .map((line) => {
              const [key, enabled, rpm, owner] = line.split("|").map((part) => part.trim());
              const entry = { key };
              if (enabled) entry.enabled = !/^(no|false|0|off|disabled)$/i.test(enabled);
              const rpmValue = Number(rpm);
              if (rpm && Number.isFinite(rpmValue) && rpmValue > 0) entry.rpm = rpmValue;
              if (owner) entry.owner = owner;
              return entry;
            })
            .filter((entry) => entry.key);
        }
