<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot API Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js"></script>

    <style>
      :root {
        --page-zoom: 1;
        zoom: var(--page-zoom);

        --color-red: #dc2626;
        --color-green: #16a34a;
        --color-yellow: #d97706;
        --color-blue: #2563eb;
        --color-purple: #7c3aed;
        --color-aqua: #0891b2;
        --color-orange: #ea580c;
        --color-gray: #64748b;

        --color-red-accent: #ef4444;
        --color-green-accent: #22c55e;
        --color-yellow-accent: #f59e0b;
        --color-blue-accent: #1d4ed8;
        --color-purple-accent: #8b5cf6;
        --color-aqua-accent: #0ea5e9;
        --color-orange-accent: #f97316;
        --color-gray-accent: #94a3b8;

        --color-bg-darkest: #0f172a;
        --color-bg: #ffffff;
        --color-bg-light-1: #f8fafc;
        --color-bg-light-2: #e2e8f0;
        --color-bg-light-3: #cbd5e1;
        --color-bg-light-4: #94a3b8;
        --color-bg-soft: #f1f5f9;

        --color-fg-darker: #64748b;
        --color-fg-dark: #475569;
        --color-fg-medium: #334155;
        --color-fg-light: #1e293b;
        --color-fg-lightest: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: #eef2f7;
        color: var(--color-fg-light);
      }

      .app-shell {
        min-height: calc(100vh / var(--page-zoom));
        background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      }

      .main-shell {
        min-width: 0;
        padding: 16px 24px 24px;
      }

      .topbar {
        margin: 0 auto 10px;
        max-width: 1720px;
      }

      .topbar-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 10px;
      }

      .page-title {
        font-size: clamp(28px, 3vw, 38px);
        font-weight: 700;
        line-height: 1.05;
        color: var(--color-fg-lightest);
      }

      .page-subtitle {
        margin-top: 4px;
        color: var(--color-gray);
        font-size: 14px;
      }

      .control-surface {
        display: grid;
        grid-template-columns:
          minmax(320px, 1fr)
          minmax(220px, 320px)
          150px
          132px;
        gap: 12px;
        align-items: end;
      }

      [hidden] {
        display: none !important;
      }

      .page-tabs {
        display: inline-flex;
        max-width: 100%;
        gap: 4px;
        margin-bottom: 14px;
        padding: 4px;
        border: 1px solid var(--color-bg-light-2);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.88);
      }

      .page-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 7px;
        color: var(--color-gray);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .page-tab[aria-selected="true"] {
        background: var(--color-blue);
        color: #ffffff;
      }

      .page-tab:focus-visible,
      .models-action:focus-visible {
        outline: 2px solid var(--color-blue);
        outline-offset: 3px;
      }

      .control-surface.models-view {
        grid-template-columns: minmax(320px, 1fr) minmax(220px, 320px) 132px;
      }

      .models-toolbar {
        flex-wrap: wrap;
        padding: 14px;
      }

      .models-toolbar .models-search {
        width: min(340px, 100%);
      }

      .models-table-scroll {
        overflow-x: auto;
      }

      .models-table {
        width: 100%;
        min-width: 640px;
        border-collapse: collapse;
        table-layout: fixed;
        text-align: left;
        font-size: 13px;
      }

      .models-table th,
      .models-table td {
        padding: 14px;
        border-bottom: 1px solid var(--color-bg-light-2);
        overflow-wrap: anywhere;
      }

      .models-table th {
        background: #f8fafc;
        color: var(--color-gray);
        font-size: 12px;
        font-weight: 700;
      }

      .models-id {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .models-id code {
        min-width: 0;
        color: var(--color-fg-lightest);
        font-size: 12px;
      }

      .models-action {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        color: var(--color-blue);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .models-action:hover {
        color: var(--color-blue-accent);
        text-decoration: underline;
      }

      .models-table .models-json-cell {
        padding: 0;
      }

      .models-json {
        margin: 0;
        max-height: 480px;
        overflow-y: auto;
        padding: 16px;
        background: #f8fafc;
        color: var(--color-fg-medium);
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        color: var(--color-fg-medium);
        font-size: 12px;
        font-weight: 700;
      }

      .input-control,
      .select-control {
        width: 100%;
        height: 42px;
        border: 1px solid var(--color-bg-light-3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        color: var(--color-fg-lightest);
        font-size: 14px;
        outline: none;
        transition:
          border-color 0.16s ease,
          box-shadow 0.16s ease,
          background-color 0.16s ease;
      }

      .input-control {
        padding: 0 12px;
      }

      .select-control {
        padding: 0 34px 0 12px;
      }

      .input-control::placeholder {
        color: #94a3b8;
      }

      .primary-action {
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--color-blue);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        transition:
          background-color 0.16s ease,
          transform 0.16s ease;
      }

      .primary-action:hover {
        background: var(--color-blue-accent);
      }

      .content-area {
        max-width: 1720px;
        margin: 0 auto;
      }

      .dashboard-section {
        margin-bottom: 10px;
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        color: var(--color-fg-lightest);
        font-size: 16px;
        font-weight: 700;
      }

      .collapse-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .collapse-toggle:focus-visible {
        outline: 2px solid var(--color-blue);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .collapse-chevron {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: var(--color-gray);
      }

      .collapse-toggle[aria-expanded="false"] .collapse-chevron {
        transform: rotate(-90deg);
      }

      .collapse-body[hidden] {
        display: none !important;
      }

      .panel-header:has(+ .collapse-body[hidden]) {
        border-bottom-color: transparent;
      }

      .section-subtitle {
        margin-top: -4px;
        margin-bottom: 8px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .panel {
        border: 1px solid var(--color-bg-light-2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--color-bg-light-2);
      }

      .panel-title {
        color: var(--color-fg-lightest);
        font-size: 14px;
        font-weight: 700;
      }

      .panel-meta {
        margin-top: 2px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }

      .metric-grid-tight {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .subscription-grid {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      }

      .metric-grid-tight .metric-label {
        white-space: nowrap;
      }

      .metric-card {
        min-height: 88px;
        padding: 12px;
        border: 1px solid var(--color-bg-light-2);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
      }

      .metric-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--color-fg-medium);
        font-size: 13px;
        font-weight: 700;
      }

      .metric-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .metric-value {
        margin-top: 10px;
        color: var(--color-fg-lightest);
        font-size: clamp(20px, 2vw, 28px);
        font-weight: 700;
        line-height: 1.1;
      }

      .metric-note {
        margin-top: 4px;
        color: var(--color-gray);
        font-size: 12px;
      }

      .progress-bar-bg {
        background-color: var(--color-bg-soft);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-bar-fg {
        border-radius: 999px;
        transition: width 0.5s ease-in-out;
      }

      .code-block::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .code-block::-webkit-scrollbar-track {
        background: var(--color-bg-light-1);
      }

      .code-block::-webkit-scrollbar-thumb {
        background: var(--color-bg-light-3);
        border-radius: 999px;
      }

      .code-block::-webkit-scrollbar-thumb:hover {
        background: var(--color-bg-light-4);
      }

      .input-focus:focus {
        border-color: var(--color-blue);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .data-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      .data-table thead {
        background: var(--color-bg-light-1);
        color: var(--color-fg-medium);
      }

      .data-table th {
        font-size: 12px;
        font-weight: 700;
      }

      .data-table td {
        font-size: 12px;
      }

      .data-table th,
      .data-table td {
        border-bottom: 1px solid var(--color-bg-light-2);
      }

      /* Breakdown tables: numeric columns hug their content, first column takes the rest and wraps. */
      .breakdown-table th:not(:first-child),
      .breakdown-table td:not(:first-child) {
        white-space: nowrap;
        padding-left: 10px;
        padding-right: 10px;
      }

      .events-table th,
      .events-table td {
        padding-left: 10px;
        padding-right: 10px;
      }

      .breakdown-table td:first-child {
        min-width: 260px;
        overflow-wrap: anywhere;
      }

      .pill-button {
        border: 1px solid var(--color-bg-light-2);
        border-radius: 7px;
        background: var(--color-bg);
        color: var(--color-fg-medium);
      }

      .quick-state-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }

      @media (max-width: 899px) {
        .metric-grid-tight {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 1100px) {
        .control-surface {
          grid-template-columns: minmax(0, 1fr) 170px 132px;
        }

        .endpoint-field {
          grid-column: 1 / -1;
        }

        .control-surface.models-view {
          grid-template-columns: minmax(0, 1fr) 132px;
        }
      }

      @media (max-width: 639px) {
        .page-tabs { display: flex; width: 100%; gap: 2px; }
        .page-tab { flex: 1 1 auto; min-width: 0; justify-content: center; gap: 5px; padding: 8px; font-size: 12px; white-space: nowrap; }
        .main-shell {
          padding: 12px 14px 18px;
        }

        .topbar-row {
          display: block;
        }

        .control-surface,
        .control-surface.models-view {
          grid-template-columns: 1fr;
        }

        .models-toolbar .models-search {
          width: 100%;
        }

        .endpoint-field {
          grid-column: auto;
        }

        .metric-grid-tight {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

/* Subscription allowance workspace. Provider SVGs are bundled from models.dev. */
.subscriptions-page {
  --quota-text: var(--color-ink, var(--color-fg-lightest));
  --quota-muted: var(--color-ink-soft, var(--color-fg-dark));
  --quota-faint: var(--color-ink-faint, var(--color-fg-medium));
  --quota-line: var(--color-line, var(--color-bg-light-2));
  --quota-soft: var(--color-sunken, var(--color-bg-light-1));
  --quota-surface: var(--color-surface, var(--color-bg));
  padding: 0;
  color: var(--quota-text);
}
.subscriptions-page-heading { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 16px; }
.subscriptions-eyebrow { margin: 0 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--quota-faint); }
.subscriptions-page-heading h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.03em; line-height: 1.2; }
.subscriptions-description { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--quota-muted); }
.subscriptions-count { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; padding: 5px 9px; border: 1px solid var(--quota-line); border-radius: 99px; font-size: 11px; color: var(--quota-muted); background: var(--quota-surface); }
.subscriptions-count > span { width: 5px; height: 5px; border-radius: 50%; background: #22a06b; }
.subscriptions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; align-items: start; }
.quota-provider-card { --quota-brand: #7c5ac7; position: relative; min-width: 0; padding: 10px 10px 8px; overflow: hidden; border: 1px solid var(--quota-line); border-radius: 10px; background: var(--quota-surface); box-shadow: 0 1px 4px rgb(0 0 0 / 2%); }
.quota-provider-card[data-provider="codex"] { --quota-brand: #179876; }
.quota-provider-card[data-provider="xai"] { --quota-brand: #386fce; }
.dark .quota-provider-card { --quota-brand: #b095ef; }
.dark .quota-provider-card[data-provider="codex"] { --quota-brand: #50bd9b; }
.dark .quota-provider-card[data-provider="xai"] { --quota-brand: #7aa8f1; }
.quota-card-header { display: flex; align-items: center; gap: 8px; }
.quota-provider-logo { display: grid; place-items: center; width: 28px; height: 28px; flex-shrink: 0; border: 1px solid var(--quota-line); border-radius: 8px; background: var(--quota-soft); }
.quota-provider-logo img { width: 18px; height: 18px; object-fit: contain; }
.quota-card-header h3 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.quota-provider-product { margin: 1px 0 0; font-size: 10px; color: var(--quota-faint); }
.quota-refresh { display: grid; place-items: center; flex-shrink: 0; width: 22px; height: 22px; padding: 0; margin-left: auto; border: 1px solid var(--quota-line); border-radius: 6px; color: var(--quota-muted); background: var(--quota-surface); cursor: pointer; }
.quota-refresh:hover { background: var(--quota-soft); color: var(--quota-text); }
.quota-refresh:disabled { opacity: .45; cursor: default; }
.quota-card-meta { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: 6px 0 0; }
.quota-plan { min-width: 0; max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 6px; border-radius: 5px; background: var(--quota-soft); color: var(--quota-muted); font-size: 10px; font-weight: 500; }
.quota-status { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; font-size: 10px; color: var(--quota-faint); }
.quota-status > span { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.quota-status[data-state="ready"] { color: var(--quota-muted); }
.quota-status[data-state="warning"] { color: #d58a25; }
.quota-summary { margin: 6px 0 8px; padding: 6px 8px; border-radius: 8px; background: var(--quota-soft); background: color-mix(in srgb, var(--quota-brand) 4%, var(--quota-soft)); }
.quota-summary-label { margin: 0 0 2px; font-size: 10px; font-weight: 500; color: var(--quota-muted); }
.quota-summary-value { font-size: 18px; line-height: 1.05; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.quota-summary-context { margin: 2px 0 0; font-size: 10px; color: var(--quota-faint); }
.quota-details { font-size: 10px; }
.quota-window + .quota-window { margin-top: 6px; }
.quota-window-heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px; margin-bottom: 3px; font-size: 10px; }
.quota-window-heading > :first-child { color: var(--quota-muted); }
.quota-window-heading > :last-child { font-weight: 600; color: var(--quota-text); }
.quota-progress { height: 4px; overflow: hidden; border-radius: 99px; background: var(--quota-soft); }
.quota-progress-fill { height: 100%; border-radius: inherit; background: var(--quota-brand); transition: width .25s ease; }
.quota-window[data-warning="true"] .quota-progress-fill { background: #d58a25; }
.quota-window-note { margin: 3px 0 0; font-size: 10px; color: var(--quota-faint); line-height: 1.4; }
.quota-balance { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--quota-line); font-size: 10px; color: var(--quota-muted); }
.quota-balance strong { color: var(--quota-text); font-weight: 600; }
.quota-notice { margin: 0 0 6px; padding: 6px 8px; border-radius: 6px; background: rgb(213 138 37 / 8%); color: #b67822; font-size: 10px; line-height: 1.4; }
.quota-card-footer { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--quota-line); color: var(--quota-faint); font-size: 10px; }
.quota-card-message { display: flex; align-items: center; min-height: 80px; margin: 0; font-size: 11px; line-height: 1.5; color: var(--quota-muted); }
.quota-card-message[role="alert"] { color: #b67822; }
.quota-skeleton { display: flex; flex-direction: column; justify-content: center; gap: 8px; min-height: 100px; animation: quota-pulse 1.5s ease-in-out infinite; }
.quota-skeleton > div { height: 6px; border-radius: 4px; background: var(--quota-soft); }
.quota-skeleton > div:first-child { width: 55%; height: 20px; margin-bottom: 6px; }
.quota-skeleton > div:last-child { width: 75%; }
@keyframes quota-pulse { 50% { opacity: .45; } }
.subscriptions-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 260px; padding: 30px; text-align: center; border: 1px dashed var(--quota-line); border-radius: 18px; color: var(--quota-muted); font-size: 13px; }
.subscriptions-empty h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--quota-text); }
.subscriptions-empty p { max-width: 360px; margin: 0; line-height: 1.7; }
.subscriptions-action { margin-top: 5px; border: 0; border-radius: 9px; padding: 8px 14px; background: var(--quota-text); color: var(--quota-surface); cursor: pointer; font-size: 12px; }
@media (max-width: 899px) {
  .subscriptions-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
}
@media (max-width: 639px) {
  .subscriptions-page-heading { align-items: flex-start; gap: 10px; margin-bottom: 12px; flex-direction: column; }
  .subscriptions-page-heading h2 { font-size: 18px; }
  .subscriptions-grid { grid-template-columns: minmax(0, 1fr); }
  .quota-provider-card { padding: 10px; }
}
    /* ── Admin: neon terminal console (skidel / bkg-crew-cli design) ── */
    .admin-wrap { display: flex; flex-direction: column; gap: 16px; }
    .admin-card {
      position: relative;
      border: 1px solid var(--vi-40);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--neon-panel);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.4),
        0 6px 18px rgba(0, 0, 0, 0.35),
        0 0 12px var(--vi-glow);
    }
    .admin-card h2 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin: 0 0 6px;
      color: var(--text-section);
    }
    .admin-card p.admin-hint { margin: 0 0 14px; font-size: 12px; color: var(--text-meta); }
    .admin-card p.admin-hint code { color: var(--text-code); }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 14px; }
    .admin-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .admin-field label { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-desc); }
    .admin-field input, .admin-field select, .admin-field textarea {
      width: 100%;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid var(--neon-line);
      background: var(--neon-input);
      color: var(--text-body);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
    }
    .admin-field textarea { resize: vertical; }
    .admin-field select[multiple] { min-height: 150px; }
    .admin-field select option { background: var(--neon-input); color: var(--text-body); }
    .admin-field input:focus, .admin-field select:focus, .admin-field textarea:focus {
      border-color: var(--cy-60);
      box-shadow:
        0 0 0 1px var(--cy-25),
        0 0 14px var(--cy-glow);
    }
    .admin-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
    .admin-btn {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--neon-cyan);
      background: var(--cy-10);
      border: 1px solid var(--cy-60);
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .admin-btn:hover { background: var(--cy-25); box-shadow: 0 0 14px var(--cy-glow); }
    .admin-btn.secondary { color: var(--neon-blue); border-color: var(--bl-40); background: var(--bl-08); }
    .admin-btn.secondary:hover { background: var(--bl-25); box-shadow: 0 0 14px var(--bl-40); }
    .admin-btn.danger { color: var(--neon-red); border-color: var(--rd-40); background: var(--rd-12); }
    .admin-btn.danger:hover { background: var(--rd-40); box-shadow: 0 0 14px var(--rd-glow); }
    .admin-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .admin-note { font-size: 12px; padding: 8px 11px; border-radius: 8px; margin-top: 10px; }
    .admin-note.error { background: var(--rd-12); color: var(--text-danger); border: 1px solid var(--rd-40); }
    .admin-note.ok { background: var(--li-12); color: var(--text-ok); border: 1px solid var(--li-40); }
    .admin-rule-row, .admin-map-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .admin-table th {
      text-align: left;
      padding: 7px 9px;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-desc);
      border-bottom: 1px solid var(--neon-line);
      white-space: nowrap;
    }
    .admin-table td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--neon-line-soft); vertical-align: top; color: var(--text-body); }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .admin-table code { font-size: 12px; color: var(--text-code); }
    @media (max-width: 720px) {
      .admin-rule-row, .admin-map-row { grid-template-columns: 1fr; }
    }

    /* ════════════════════════════════════════════════════════════════
       NEON THEME — skidel / bkg-crew-cli design system.
       Dark terminal surface, per-area neon accents, glowing text.
       High-contrast neon on near-black for low-vision readability.
       ════════════════════════════════════════════════════════════════ */
    :root {
      --neon-cyan: #00ffcc;
      --neon-mint: #4dffb8;
      --neon-lime: #b5ff2b;
      --neon-violet: #d9a0ff;   /* bright neon violet — never dim on black */
      --neon-blue: #4dc3ff;
      --neon-magenta: #ff00ff;
      --neon-orange: #ff8800;
      --neon-gold: #ffc94d;
      --neon-red: #ff4d6d;
      --neon-yellow: #ffff00;
      --neon-pink: #ff5fd7;
      --neon-pistachio: #9dff9a;
      --neon-coral: #ff927e;
      --neon-purple: #e0a0ff;
      --neon-azure: #9db8ff;    /* bright neon azure */
      --neon-peach: #ffc09a;
      --neon-ice: #e8f4ff;

      /* semantic text colours: what a colour means, not which neon it is */
      --text-title: var(--neon-cyan);
      --text-section: var(--neon-violet);
      --text-subsection: var(--neon-blue);
      --text-link: var(--neon-blue);
      --text-emphasis: var(--neon-yellow);
      --text-code: var(--neon-lime);
      --text-ok: var(--neon-lime);
      --text-warn: var(--neon-orange);
      --text-danger: var(--neon-red);
      --text-info: var(--neon-blue);
      --text-strong: var(--neon-blue);
      --text-body: #a8f0ff;
      --text-desc: var(--neon-violet);
      --text-meta: var(--neon-pistachio);
      --text-faint: var(--neon-orange);

      /* surfaces */
      --neon-bg: #050505;
      --neon-panel: #0a0a10;
      --neon-panel2: #0d0d16;
      --neon-line: #1b1b28;
      --neon-line-soft: #14141f;
      --neon-input: #0b0b13;
      --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;

      /* rgba neon helpers — plain rgba() so every browser renders them */
      --cy-06: rgba(0, 255, 204, 0.06);
      --cy-10: rgba(0, 255, 204, 0.10);
      --cy-16: rgba(0, 255, 204, 0.16);
      --cy-25: rgba(0, 255, 204, 0.25);
      --cy-40: rgba(0, 255, 204, 0.40);
      --cy-60: rgba(0, 255, 204, 0.60);
      --cy-glow: rgba(0, 255, 204, 0.30);
      --vi-08: rgba(217, 160, 255, 0.08);
      --vi-16: rgba(217, 160, 255, 0.16);
      --vi-25: rgba(217, 160, 255, 0.25);
      --vi-40: rgba(217, 160, 255, 0.40);
      --vi-glow: rgba(217, 160, 255, 0.30);
      --mi-08: rgba(77, 255, 184, 0.08);
      --mi-25: rgba(77, 255, 184, 0.25);
      --mi-40: rgba(77, 255, 184, 0.40);
      --bl-08: rgba(77, 195, 255, 0.08);
      --bl-25: rgba(77, 195, 255, 0.25);
      --bl-40: rgba(77, 195, 255, 0.40);
      --or-08: rgba(255, 136, 0, 0.08);
      --or-16: rgba(255, 136, 0, 0.16);
      --or-40: rgba(255, 136, 0, 0.40);
      --or-glow: rgba(255, 136, 0, 0.30);
      --az-08: rgba(157, 184, 255, 0.08);
      --az-16: rgba(157, 184, 255, 0.16);
      --az-25: rgba(157, 184, 255, 0.25);
      --az-40: rgba(157, 184, 255, 0.40);
      --az-glow: rgba(157, 184, 255, 0.30);
      --rd-12: rgba(255, 77, 109, 0.12);
      --rd-40: rgba(255, 77, 109, 0.40);
      --rd-glow: rgba(255, 77, 109, 0.30);
      --li-12: rgba(181, 255, 43, 0.12);
      --li-40: rgba(181, 255, 43, 0.40);
      --li-glow: rgba(181, 255, 43, 0.30);
      --go-40: rgba(255, 201, 77, 0.40);

      /* remap the dashboard's own palette onto neon */
      --color-bg: var(--neon-panel);
      --color-bg-darkest: var(--neon-bg);
      --color-bg-light-1: var(--neon-panel2);
      --color-bg-light-2: var(--neon-line);
      --color-bg-light-3: var(--neon-cyan);
      --color-bg-light-4: var(--neon-violet);
      --color-bg-soft: var(--neon-panel2);

      --color-fg-lightest: var(--text-title);
      --color-fg-light: var(--text-body);
      --color-fg-medium: var(--text-desc);
      --color-fg-dark: var(--text-meta);
      --color-fg-darker: var(--text-faint);

      --color-blue: var(--neon-cyan);
      --color-blue-accent: var(--neon-mint);
      --color-gray: var(--text-meta);
      --color-gray-accent: var(--text-meta);
      --color-green: var(--neon-lime);
      --color-green-accent: var(--neon-mint);
      --color-red: var(--neon-red);
      --color-red-accent: var(--neon-red);
      --color-yellow: var(--neon-orange);
      --color-yellow-accent: var(--neon-gold);
      --color-purple: var(--neon-violet);
      --color-purple-accent: var(--neon-purple);
      --color-aqua: var(--neon-mint);
      --color-aqua-accent: var(--neon-cyan);
      --color-orange: var(--neon-orange);
      --color-orange-accent: var(--neon-coral);

      /* semantic aliases used by the subscriptions / quota cards */
      --color-ink: var(--text-body);
      --color-ink-soft: var(--text-desc);
      --color-ink-faint: var(--text-faint);
      --color-line: var(--neon-line);
      --color-sunken: var(--neon-panel2);
      --color-surface: var(--neon-panel);
    }

    /* ── base ── */
    body {
      background-color: var(--neon-bg);
      color: var(--text-body);
      font-family: var(--mono);
      background-image:
        radial-gradient(1100px 500px at 85% -10%, rgba(0, 255, 204, 0.055), transparent 60%),
        radial-gradient(900px 480px at -10% 110%, rgba(217, 160, 255, 0.06), transparent 60%);
      background-attachment: fixed;
    }

    .app-shell { background: transparent; }

    ::selection { background: rgba(0, 255, 204, 0.3); color: #ffffff; }

    /* Headings/values: solid bright neon, no glow. Glow blurs letters and
       hurts readability for low-vision readers, so text stays crisp. */
    .page-title { color: var(--text-title); }
    .section-heading { color: var(--text-section); }
    .panel-title { color: var(--text-strong); }
    .metric-value { color: var(--text-title); }
    .metric-label { color: var(--text-body); }

    /* ── terminal title bar around the top controls ── */
    .topbar {
      position: relative;
      padding: 30px 16px 16px;
      border: 1px solid var(--cy-40);
      border-radius: 14px;
      background: linear-gradient(180deg, var(--cy-10), rgba(10, 10, 16, 0.75));
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.5),
        0 12px 34px rgba(0, 0, 0, 0.5),
        0 0 26px var(--cy-glow);
    }
    .topbar::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 16px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff5f57;
      box-shadow: 16px 0 0 #febc2e, 32px 0 0 #28c840;
    }
    .topbar::after {
      content: "copilot-api@dashboard:~$";
      position: absolute;
      top: 8px;
      left: 66px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.5px;
      color: var(--neon-violet);
    }

    /* ── surfaces ── */
    .panel {
      background: var(--neon-panel);
      border-color: var(--cy-40);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.4),
        0 12px 34px rgba(0, 0, 0, 0.45),
        0 0 24px var(--cy-glow);
    }
    .panel-header { border-bottom-color: var(--cy-25); }

    .metric-card {
      background: var(--neon-panel2);
      border-color: var(--cy-40);
      box-shadow: 0 0 18px var(--cy-glow);
    }

    .page-tabs {
      background: var(--neon-panel2);
      border-color: var(--cy-25);
    }
    .page-tab { color: var(--text-desc); }
    .page-tab:hover { color: var(--text-body); }
    .page-tab[aria-selected="true"] {
      background: var(--cy-16);
      color: var(--text-title);
      border: 1px solid var(--cy-60);
      box-shadow: 0 0 16px var(--cy-glow);
    }

    /* ── forms ── */
    .input-control, .select-control {
      background: var(--neon-input);
      border-color: var(--cy-25);
      color: var(--text-body);
      font-family: var(--mono);
    }
    .input-control:focus, .select-control:focus {
      border-color: var(--cy-60);
      box-shadow:
        0 0 0 1px var(--cy-25),
        0 0 14px var(--cy-glow);
    }
    .input-control::placeholder { color: var(--text-faint); }
    .field-label { color: var(--text-desc); }

    .primary-action {
      background: var(--cy-16);
      border: 1px solid var(--cy-60);
      color: var(--text-title);
      box-shadow: 0 0 14px var(--cy-glow);
    }
    .primary-action:hover {
      background: var(--cy-25);
      box-shadow: 0 0 20px var(--cy-60);
    }

    /* ── tables ── */
    .models-table th {
      background: var(--neon-panel2);
      color: var(--text-desc);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 12px;
    }
    .models-table th, .models-table td { border-bottom-color: var(--neon-line-soft); }
    .models-table tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .models-json { background: var(--neon-input); color: var(--text-code); }
    .models-action { color: var(--text-link); }
    .models-action:hover { color: var(--neon-mint); }
    .collapse-chevron { color: var(--text-meta); }

    /* ── subscriptions / quota cards ── */
    .quota-provider-card { --quota-brand: var(--neon-violet); }
    .quota-provider-card[data-provider="codex"] { --quota-brand: var(--neon-mint); }
    .quota-provider-card[data-provider="xai"] { --quota-brand: var(--neon-azure); }
    .quota-notice { color: var(--text-warn); }
    .quota-card-message[role="alert"] { color: var(--text-warn); }
    .quota-status[data-state="warning"] { color: var(--text-warn); }
    .quota-window[data-warning="true"] .quota-progress-fill { background: var(--neon-orange); box-shadow: 0 0 10px var(--or-glow); }
    .subscriptions-count > span { background: var(--neon-mint); box-shadow: 0 0 8px var(--neon-mint); }
    .subscriptions-action { background: var(--cy-16); color: var(--text-title); border: 1px solid var(--cy-60); }

    /* ── scrollbars: thin neon, like the terminal console ── */
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: var(--cy-40); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cy-60); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ── links / code ── */
    a { color: var(--text-link); }
    code { color: var(--text-code); }
    strong, b { color: var(--text-emphasis); }

    /* ════════ terminal chrome ════════ */
    @keyframes neon-blink { 50% { opacity: 0; } }

    /* title as a shell prompt with a blinking block cursor */
    .page-title::before { content: "$ "; color: var(--neon-lime); }
    .page-title::after {
      content: "\2588";
      margin-left: 8px;
      color: var(--neon-cyan);
      animation: neon-blink 1.05s steps(1) infinite;
    }
    .page-subtitle::before { content: "# "; color: var(--neon-violet); }

    /* headings get terminal prompt markers */
    .section-heading::before { content: "> "; color: var(--neon-lime); }
    .panel-title::before { content: "$ "; color: var(--neon-lime); }

    /* per-tab neon accents */
    .page-tab[data-tab="usage"] { --tab-ac: var(--neon-cyan); --tab-bg: var(--cy-16); --tab-line: var(--cy-60); --tab-glow: var(--cy-glow); }
    .page-tab[data-tab="subscriptions"] { --tab-ac: var(--neon-violet); --tab-bg: var(--vi-16); --tab-line: var(--vi-40); --tab-glow: var(--vi-glow); }
    .page-tab[data-tab="models"] { --tab-ac: var(--neon-mint); --tab-bg: var(--mi-08); --tab-line: var(--mi-40); --tab-glow: var(--mi-25); }
    .page-tab[data-tab="providers"] { --tab-ac: var(--neon-azure); --tab-bg: var(--az-16); --tab-line: var(--az-40); --tab-glow: var(--az-glow); }
    .page-tab[data-tab="admin"] { --tab-ac: var(--neon-orange); --tab-bg: var(--or-16); --tab-line: var(--or-40); --tab-glow: var(--or-glow); }
    .page-tab[data-tab="webapi"] { --tab-ac: var(--neon-mint); --tab-bg: var(--mi-08); --tab-line: var(--mi-40); --tab-glow: var(--mi-25); }
    .page-tab[data-tab="log"] { --tab-ac: var(--neon-cyan); --tab-bg: var(--cy-16); --tab-line: var(--cy-60); --tab-glow: var(--cy-glow); }
    .page-tab { color: var(--tab-ac, var(--text-desc)); }
    .page-tab:hover { color: var(--tab-ac, var(--text-body)); }
    .page-tab[aria-selected="true"] {
      background: var(--tab-bg, var(--cy-16));
      color: var(--tab-ac);
      border: 1px solid var(--tab-line, var(--cy-60));
      box-shadow: 0 0 16px var(--tab-glow, var(--cy-glow));
    }

    /* terminal window dots on panel headers */
    .panel-header { position: relative; padding-left: 58px; }
    .panel-header::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff5f57;
      box-shadow: 15px 0 0 #febc2e, 30px 0 0 #28c840;
    }
    .panel { border-left: 3px solid var(--neon-cyan); }

    /* admin cards: terminal window dots top-left */
    .admin-card { padding-top: 24px; border-left: 3px solid var(--neon-violet); }
    .admin-card::after {
      content: "";
      position: absolute;
      top: 9px;
      left: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff5f57;
      box-shadow: 11px 0 0 #febc2e, 22px 0 0 #28c840;
    }

    /* metric cards: colored top accent + neon glow */
    .metric-card {
      border-top: 3px solid var(--neon-cyan);
      box-shadow: 0 0 18px var(--cy-glow);
    }
    .metric-card:nth-child(4n + 1) { border-top-color: var(--neon-cyan); }
    .metric-card:nth-child(4n + 2) { border-top-color: var(--neon-violet); }
    .metric-card:nth-child(4n + 3) { border-top-color: var(--neon-mint); }
    .metric-card:nth-child(4n + 4) { border-top-color: var(--neon-gold); }

    /* quota progress bars glow */
    .quota-progress-fill { box-shadow: 0 0 10px var(--quota-brand); }

    /* ── loading spinner ── */
    .animate-spin { background-color: transparent !important; }

    /* ── Login gate + session chip ── */
    .auth-gate {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--neon-bg);
    }
    .auth-gate[hidden] { display: none; }
    .auth-card {
      width: 100%; max-width: 380px;
      border: 1px solid var(--cy-40); border-radius: 14px;
      padding: 24px 22px; background: var(--neon-panel);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 0 26px var(--cy-glow);
    }
    .auth-card h2 { margin: 0 0 4px; font-size: 18px; color: var(--text-title); }
    .auth-card p { margin: 0 0 16px; font-size: 12px; line-height: 1.6; color: var(--text-desc); }
    .auth-card .admin-field { margin-bottom: 12px; }
    .auth-card .admin-btn { width: 100%; padding: 9px 14px; font-size: 13px; }
    .auth-error {
      margin: 0 0 12px; padding: 8px 10px; border-radius: 8px; font-size: 12px;
      color: var(--neon-red); border: 1px solid var(--rd-40); background: var(--rd-12);
    }
    .auth-error[hidden] { display: none; }
    .auth-info {
      margin: 0 0 12px; padding: 8px 10px; border-radius: 8px; font-size: 12px;
      color: var(--neon-lime); border: 1px solid var(--neon-lime); background: rgba(0,0,0,0.35);
    }
    .auth-info[hidden], #auth-fields[hidden], #auth-setup-mail[hidden] { display: none; }
    .auth-card .auth-small { margin: 8px 0 14px; }
    .auth-link {
      display: block; margin: 12px auto 0; padding: 4px; border: 0; background: none;
      color: var(--neon-cyan); font-size: 12px; text-decoration: underline; cursor: pointer;
    }
    .auth-link[hidden] { display: none; }
    .session-chip {
      display: inline-flex; align-items: center; gap: 10px; flex-shrink: 0;
      font-size: 12px; color: var(--text-body);
    }
    .session-chip[hidden] { display: none; }
    .session-role {
      padding: 2px 8px; border-radius: 99px; font-size: 11px;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--neon-cyan); border: 1px solid var(--cy-40); background: var(--cy-10);
    }
    .topbar-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }

    /* Readable form controls everywhere in the admin area, including the ones
       rendered inside tables (browser defaults were light-on-white). */
    .admin-wrap select,
    .admin-wrap textarea,
    .admin-wrap input:not([type="checkbox"]):not([type="radio"]) {
      background: var(--neon-input);
      color: var(--text-body);
      border: 1px solid var(--neon-line);
      border-radius: 7px;
      font-family: var(--mono);
      font-size: 13px;
      padding: 5px 8px;
    }
    .admin-wrap select option { background: var(--neon-input); color: var(--text-body); }
    .admin-wrap select:disabled { color: var(--text-desc); opacity: 0.8; }

    /* ── skidel look (apps/web): neon text on #050505, Geist + Fira Code,
       sheet tables, neon buttons. Size: 100% by default, A+/A- to scale. ── */
    :root {
      --ui-scale: 1;
      --background: #050505;
      --text-body: #a8f0ff;
      --neon-violet: #b98cff;
      --neon-azure: #6f8cff;
      --neon-purple: #d77bff;
      --neon-line: color-mix(in srgb, var(--neon-cyan) 22%, transparent);
      --sans: "Geist", "Inter", Arial, Helvetica, sans-serif;
      --mono: "Fira Code", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    }
    .main-shell, .auth-gate .auth-card { zoom: var(--ui-scale); }
    html, body { max-width: 100%; overflow-x: clip; }
    body {
      background-color: var(--background);
      color: var(--text-body);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 400;
      overflow-wrap: anywhere;
      background-image:
        linear-gradient(rgba(0, 255, 204, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.015) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    code, pre, kbd, .page-title, .page-tab, .admin-card h2, .field-label, label { font-family: var(--mono); }
    b, strong { color: var(--text-emphasis); }
    a { color: var(--text-link); }
    p, td, th, label, li, .admin-hint, .field-label { line-height: 1.55; }
    input::placeholder, textarea::placeholder { color: var(--neon-violet); opacity: 0.7; }
    input, select, textarea, .input-control, .select-control {
      border-color: color-mix(in srgb, var(--neon-violet) 45%, transparent) !important;
    }
    input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--neon-yellow) !important; }
    :focus-visible { outline: 2px solid var(--neon-yellow) !important; outline-offset: 2px; }

    /* Panels: thin neon frame, no heavy glow (skidel .sheet / terminal-box). */
    .admin-card, .panel, .quota-provider-card, .auth-card {
      border: 1px solid color-mix(in srgb, var(--section, var(--neon-cyan)) 28%, transparent) !important;
      border-radius: 0.5rem !important;
      background: rgba(10, 10, 10, 0.8) !important;
      box-shadow: none !important;
    }
    .admin-card h2 { color: var(--text-section); font-size: 13px; letter-spacing: 0.08em; }
    .admin-card p.admin-hint { font-size: 13px; color: var(--text-desc); }
    .admin-field label { font-size: 12px; color: var(--text-meta); letter-spacing: 0.05em; }

    /* Lists and tables: skidel .sheet. */
    #content-area table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      border: 1px solid color-mix(in srgb, var(--neon-cyan) 28%, transparent);
      border-radius: 0.5rem;
      overflow: clip;
    }
    #content-area thead th {
      background: #07110f;
      color: var(--neon-violet);
      font-family: var(--mono);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      padding: 0.55rem 0.6rem;
      border-bottom: 1px solid color-mix(in srgb, var(--neon-cyan) 45%, transparent);
      white-space: nowrap;
    }
    #content-area tbody td {
      padding: 0.45rem 0.6rem;
      color: var(--text-body);
      border-bottom: 1px solid color-mix(in srgb, var(--neon-cyan) 9%, transparent);
      vertical-align: middle;
      overflow-wrap: break-word;
    }
    #content-area tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--neon-cyan) 2.5%, transparent); }
    #content-area tbody tr:hover td { background: color-mix(in srgb, var(--neon-yellow) 7%, transparent); }
    #content-area tbody td code { color: var(--text-code); }

    /* Buttons: skidel .neon-btn (border follows the text colour). */
    .admin-btn, .primary-action, .page-tab, .subscriptions-action {
      border: 1px solid color-mix(in srgb, currentColor 45%, transparent) !important;
      border-radius: 0.5rem !important;
      background: color-mix(in srgb, currentColor 6%, transparent) !important;
      box-shadow: none !important;
      font-family: var(--mono);
      font-weight: 500;
    }
    .admin-btn:hover, .primary-action:hover, .page-tab:hover, .subscriptions-action:hover {
      border-color: currentColor !important;
      background: color-mix(in srgb, currentColor 14%, transparent) !important;
    }
    .page-tab[aria-selected="true"] {
      border-color: currentColor !important;
      background: color-mix(in srgb, currentColor 14%, transparent) !important;
      font-weight: 600;
    }
    .page-tabs { background: transparent !important; border: 0 !important; gap: 0.5rem; flex-wrap: wrap; }

    /* Small-screen fit: no horizontal scrolling, tables become cards. */
    @media (max-width: 640px) {
      body { font-size: 14px; }
      #content-area table, #content-area tbody, #content-area tr, #content-area td { display: block; width: 100%; }
      #content-area thead { display: none; }
      #content-area tbody td { border: 0; padding: 0.15rem 0.7rem; }
      #content-area tbody tr { padding: 0.5rem 0; border-bottom: 1px solid color-mix(in srgb, var(--neon-cyan) 14%, transparent); }
    }
    .font-scale {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .font-scale button {
      min-width: 34px; padding: 0.3rem 0.55rem; font-size: 13px; font-weight: 600;
      font-family: var(--mono); color: var(--neon-yellow);
      background: color-mix(in srgb, currentColor 6%, transparent);
      border: 1px solid color-mix(in srgb, currentColor 45%, transparent);
      border-radius: 0.5rem; cursor: pointer;
    }
    .font-scale button:hover { border-color: currentColor; background: color-mix(in srgb, currentColor 14%, transparent); }
    .font-scale span { min-width: 40px; text-align: center; color: var(--neon-yellow); font-family: var(--mono); font-size: 13px; }
    .topbar-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }


    /* ── Subscription sign-in (Codex / Anthropic / xAI) ── */
    .sub-auth { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .sub-auth-intro { grid-column: 1 / -1; margin: 0; font-size: 12px; color: var(--neon-yellow); }
    .sub-auth .admin-card h2 { font-size: 13px; font-weight: 800; color: var(--neon-yellow); }
    .sub-auth ol { margin: 3px 0 6px 16px; padding: 0; color: var(--text-body); font-size: 12px; line-height: 1.4; font-weight: 500; }
    .sub-auth-account { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding: 4px 0; border-bottom: 1px solid var(--neon-line); font-size: 12px; }
    .sub-auth-account:last-child { border-bottom: 0; }
    .sub-auth-account strong { color: var(--neon-cyan); }
    .sub-auth-badge { color: var(--neon-lime); font-weight: 700; font-size: 11px; }
    .device-code { font-family: "Fira Code", ui-monospace, monospace; font-size: clamp(1rem, 3.5vw, 1.4rem); font-weight: 700; letter-spacing: 0.1em; color: var(--neon-lime); text-align: center; padding: 8px; margin: 6px 0; border: 2px solid var(--neon-lime); border-radius: 8px; background: rgba(0,0,0,0.4); user-select: all; word-break: break-all; }
    .sub-auth-link { display: inline-block; word-break: break-all; color: var(--neon-cyan); font-weight: 700; }
    .sub-auth .gh-login { color: var(--neon-lime); font-weight: 700; }
    .sub-auth .admin-card p.admin-hint { font-size: 11px; font-weight: 500; line-height: 1.35; }
    .sub-auth .admin-btn { font-size: 12px; font-weight: 700; padding: 5px 10px; }
    .sub-auth .admin-field label { font-size: 12px; font-weight: 700; }
    .sub-auth .admin-field input { font-size: 14px; }
    .sub-auth .admin-note { font-size: 12px; font-weight: 700; }

    <script>
      (function () {
        var scale = 1;
        try {
          var stored = parseFloat(window.localStorage.getItem("copilot-api.ui-scale-v2"));
          if (stored >= 0.8 && stored <= 2) scale = stored;
        } catch (error) {}
        document.documentElement.style.setProperty("--ui-scale", String(scale));
      })();

    <div id="auth-gate" class="auth-gate" hidden>
      <form id="auth-form" class="auth-card" autocomplete="on">
        <h2 id="auth-title">Sign in</h2>
        <p id="auth-description">Sign in with your email address.</p>
        <div id="auth-error" class="auth-error" role="alert" hidden></div>
        <div id="auth-info" class="auth-info" role="status" hidden></div>
        <div id="auth-setup-mail" hidden>
          <button id="auth-setup-mail-button" type="button" class="admin-btn">Send setup link by email</button>
          <p id="auth-setup-mail-hint" class="auth-small"></p>
        </div>
        <div id="auth-fields">
          <div class="admin-field">
            <label for="auth-email">Email</label>
            <input id="auth-email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="admin-field">
            <label for="auth-password">Password</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <div id="auth-password2-field" class="admin-field" hidden>
            <label for="auth-password2">Repeat password</label>
            <input id="auth-password2" type="password" autocomplete="new-password" />
          </div>
          <div id="auth-admin-key-field" class="admin-field" hidden>
            <label for="auth-admin-key">Admin API key (one-time setup)</label>
            <input id="auth-admin-key" type="password" autocomplete="off" />
          </div>
          <button id="auth-submit" type="submit" class="admin-btn">Sign in</button>
          <button id="auth-forgot" type="button" class="auth-link" hidden>Forgot password?</button>
          <button id="auth-adminreset" type="button" class="auth-link" hidden>Reset with admin key</button>
        </div>
      </form>
    </div>

        <header class="topbar">

            </div>

            <button id="subscriptions-tab" type="button" class="page-tab" role="tab" data-tab="subscriptions" aria-selected="false" aria-controls="content-area" tabindex="-1">

              Subscriptions
            </button>
            <button
              id="models-tab"
              type="button"
              class="page-tab"
              role="tab"
              data-tab="models"
              aria-selected="false"
              aria-controls="content-area"
              tabindex="-1"
            >
              <i data-lucide="boxes" class="h-4 w-4" aria-hidden="true"></i>
              Models
            </button>
            <button
              id="providers-tab"
              type="button"
              class="page-tab"
              role="tab"
              data-tab="providers"
              aria-selected="false"

              tabindex="-1"
            >
              <i data-lucide="server" class="h-4 w-4" aria-hidden="true"></i>
              Providers
            </button>
            <button
              id="webapi-tab"
              type="button"
              class="page-tab"
              role="tab"
              data-tab="webapi"
              aria-selected="false"
              aria-controls="content-area"
              tabindex="-1"
            >
              <i data-lucide="globe" class="h-4 w-4" aria-hidden="true"></i>
              Web API
            </button>
            <button
              id="log-tab"
              type="button"
              class="page-tab"
              role="tab"
              data-tab="log"
              aria-selected="false"
              aria-controls="content-area"
              tabindex="-1"
            >
              <i data-lucide="scroll-text" class="h-4 w-4" aria-hidden="true"></i>
              Log
            </button>
            <button
              id="admin-tab"
              type="button"
              class="page-tab"
              role="tab"
              data-tab="admin"
              aria-selected="false"
              aria-controls="content-area"
              tabindex="-1"
            >
              <i data-lucide="settings-2" class="h-4 w-4" aria-hidden="true"></i>
              Admin
            </button>
          </div>

          <form id="endpoint-form" class="control-surface">
            <div class="endpoint-field">
              <label for="endpoint-url" class="field-label">Endpoint URL</label>
              <input
                type="text"
                id="endpoint-url"
                class="input-control input-focus"
                placeholder="http://localhost:4141/usage"
              />
            </div>
            <div id="credential-field">
              <label for="x-api-key" class="field-label">Auth credential</label>
              <input
                type="password"
                id="x-api-key"
                class="input-control input-focus"
                placeholder="x-api-key or Authorization Bearer"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <div id="token-usage-period-field">
              <label for="token-usage-period" class="field-label">Period</label>
              <select
                id="token-usage-period"
                class="select-control input-focus"

                <option value="today">Today</option>
                <option value="this_week">This week</option>
                <option value="last_7_days">Last 7 days</option>
                <option value="this_month">This month</option>

                <option value="lifetime">Lifetime</option>
              </select>
            </div>
            <button id="fetch-button" type="submit" class="primary-action">
              <i data-lucide="refresh-cw" class="h-4 w-4"></i>
              <span>Refresh</span>

          </form>
          <p id="credential-hint" class="mt-2 text-xs" style="color: var(--text-desc);">

          </p>
        </header>

        <main
          id="content-area"
          class="content-area"
          role="tabpanel"
          aria-labelledby="usage-tab"
        ></main>
      </div>
